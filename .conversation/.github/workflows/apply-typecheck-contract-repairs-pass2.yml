name: Apply Typecheck Contract Repairs Pass 2

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-typecheck-contract-repairs-pass2.mjs"
      - ".github/workflows/apply-typecheck-contract-repairs-pass2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-typecheck-contract-repairs-pass2.mjs
      - name: Commit repairs when changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "apex-typecheck-bot"
          git config user.email "apex-typecheck-bot@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/discovery-agent.ts \
            artifacts/api-server/src/src/lib/case-bureau.ts \
            artifacts/api-server/src/src/routes/research/cases.ts
          git commit -m "fix: repair remaining discovery case type contracts"
          git push origin HEAD:main
