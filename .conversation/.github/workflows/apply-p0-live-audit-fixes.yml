name: apply-p0-live-audit-fixes
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-p0-incremental-admit.mjs"
      - "scripts/apply-mobile-span-live-feed.mjs"
      - ".github/workflows/apply-p0-live-audit-fixes.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches into source
        run: |
          set -euo pipefail
          node scripts/apply-p0-incremental-admit.mjs
          node scripts/apply-mobile-span-live-feed.mjs
          grep -q 'onCandidate' artifacts/api-server/src/src/lib/discovery-agent.ts
          grep -q 'onCandidate: async' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          grep -q 'SPAN_FEED_FALLBACK_V1' artifacts/apex-finder/src/components/mobile-reactor-flow.tsx || grep -q 'Now searching' artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/src/lib/discovery-agent.ts \
            artifacts/api-server/src/src/lib/atlas-orchestrator.ts \
            artifacts/apex-finder/src/components/mobile-reactor-flow.tsx \
            scripts/apply-p0-incremental-admit.mjs \
            scripts/apply-mobile-span-live-feed.mjs || true
          if git diff --cached --quiet; then echo no-source-changes; else
            git commit -m "fix(live-audit): incremental admit, batch default 3, mobile span feed"
            git push
          fi
