name: apply-desk-bugfix-2b
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-desk-bugfix-2b.py"
      - ".github/workflows/apply-desk-bugfix-2b.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: |
          set -euo pipefail
          test "$(wc -l < artifacts/apex-finder/src/pages/reactor.tsx)" -ge 2000
          python3 scripts/apply-desk-bugfix-2b.py
          grep -q 'out.add("inhouse")' artifacts/apex-finder/src/pages/reactor.tsx
          ! grep -q 'out.add("whoxy")' artifacts/apex-finder/src/pages/reactor.tsx
          grep -q 'Activity-only mobile scheme' artifacts/apex-finder/src/pages/reactor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no-changes; else
            git commit -m "fix(ui): liveNodes RDAP→inhouse; mobile activity-only scheme"
            git push
          fi
