name: preproof-architecture
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-preproof-architecture.py"
      - ".github/workflows/preproof-architecture.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sources whole
        run: |
          set -euo pipefail
          A=artifacts/api-server/src/src/lib/agentic-web-research.ts
          T=artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          test "$(wc -l < "$A")" -ge 2000
          test "$(wc -l < "$T")" -ge 3000
          ! grep -q PLACEHOLDER "$A" "$T"
      - name: Apply pre-proof architecture
        run: |
          set -euo pipefail
          python3 scripts/apply-preproof-architecture.py
          ! grep -q 'await import("./whoxy-enricher")' artifacts/api-server/src/src/lib/agentic-web-research.ts
          grep -q 'DISCOVERY STATE' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          grep -q 'Dig investigator only\|Dig only\|GROQ_API_KEY or MISTRAL' docs/REPLIT_UPDATE_PROMPT_LATEST.md
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fix(architecture): pre-proof — Whoxy off Dig, discovery state into Dig, Dig role docs"
            git push
          fi
