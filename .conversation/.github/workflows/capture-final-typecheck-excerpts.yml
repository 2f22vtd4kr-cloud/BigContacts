name: Capture Final Typecheck Excerpts
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-final-typecheck-excerpts.yml"
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ci/final
          nl -ba artifacts/api-server/src/src/routes/research/cases.ts | sed -n '925,945p' > ci/final/cases-938.txt
          nl -ba artifacts/api-server/src/src/routes/research/cases.ts | sed -n '1672,1692p' > ci/final/cases-1684.txt
          nl -ba artifacts/api-server/src/src/routes/research/cases.ts | sed -n '2188,2205p' > ci/final/cases-2198.txt
          nl -ba artifacts/api-server/src/src/routes/research/cases.ts | sed -n '2808,2824p' > ci/final/cases-2817.txt
          git config user.name "apex-typecheck-bot"
          git config user.email "apex-typecheck-bot@users.noreply.github.com"
          git checkout --orphan ci-typecheck-final-excerpts
          git rm -rf .
          git add ci/final
          git commit -m "ci: capture final typecheck source excerpts"
          git push --force origin HEAD:refs/heads/ci/typecheck-final-excerpts
