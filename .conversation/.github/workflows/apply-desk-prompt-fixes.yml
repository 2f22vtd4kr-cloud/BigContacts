name: apply-desk-prompt-fixes
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-desk-and-prompt-fixes.py"
      - ".github/workflows/apply-desk-prompt-fixes.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: |
          set -euo pipefail
          test "$(wc -l < artifacts/api-server/src/src/lib/agentic-web-research.ts)" -ge 2000
          test "$(wc -l < artifacts/apex-finder/src/pages/reactor.tsx)" -ge 2000
          python3 scripts/apply-desk-and-prompt-fixes.py
          grep -q '4500' artifacts/api-server/src/src/lib/agentic-web-research.ts
          grep -q 'do not mount inactive tool nodes' artifacts/apex-finder/src/pages/reactor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no-changes; else
            git commit -m "fix(ui+prompt): activity-only desk scheme + discovery objective context"
            git push
          fi
