name: apply-reactor-human-live-copy
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-reactor-human-live-copy.mjs"
      - "artifacts/apex-finder/src/lib/humanize-live-copy.ts"
      - ".github/workflows/apply-reactor-human-live-copy.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply human live copy
        run: |
          set -euo pipefail
          node scripts/apply-reactor-human-live-copy.mjs
          grep -q humanizeLiveStep artifacts/apex-finder/src/components/dig-span-trajectory.tsx
          grep -q humanizeLiveStep artifacts/apex-finder/src/components/mobile-reactor-flow.tsx || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/apex-finder/src/components/dig-span-trajectory.tsx \
                  artifacts/apex-finder/src/components/mobile-reactor-flow.tsx \
                  artifacts/apex-finder/src/components/bureau-ops-stage.tsx \
                  artifacts/apex-finder/src/lib/humanize-live-copy.ts || true
          if git diff --cached --quiet; then echo no-changes; else
            git commit -m "ui: plain-English reactor live feed (no internal dumps)"
            git push
          fi
