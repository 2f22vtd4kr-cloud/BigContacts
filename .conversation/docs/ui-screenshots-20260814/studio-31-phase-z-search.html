<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Deep Search</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:400px;border-radius:16px;border:1px solid #1e293b;background:#071018;padding:16px}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.h{font-size:11px;font-family:ui-monospace,monospace;color:#94a3b8;margin-bottom:12px;letter-spacing:.08em;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;font-family:ui-monospace,monospace;color:#94a3b8}
.track{flex:1;height:6px;border-radius:99px;background:#1e293b;overflow:hidden}
.fill{height:100%;border-radius:99px}
.name{font-size:14px;font-weight:600;margin-bottom:10px}
</style></head>
<body>
<div>
<p class="cap">Deep Search · operator scores</p>
<div class="card">
  <div class="h">3 results — best matches first</div>
  <div class="name">Walker Tool &amp; Die</div>
  <div class="bar"><span style="width:64px">Keywords</span><div class="track"><div class="fill" style="width:78%;background:#3b82f6"></div></div></div>
  <div class="bar"><span style="width:64px">Meaning</span><div class="track"><div class="fill" style="width:64%;background:#8b5cf6"></div></div></div>
  <div class="bar"><span style="width:64px">Links</span><div class="track"><div class="fill" style="width:42%;background:#10b981"></div></div></div>
  <div class="bar"><span style="width:64px">Combined</span><div class="track"><div class="fill" style="width:86%;background:#34d399"></div></div></div>
</div>
</div>
</body></html>
