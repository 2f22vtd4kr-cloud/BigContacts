<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:20px;flex-wrap:wrap}
.cap{width:100%;text-align:center;font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#64748b}
.card{width:360px;border-radius:16px;border:1px solid #1e293b;background:#071018;padding:16px}
.h{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#34d399;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:#6ee7b7;font-size:12px;font-family:ui-monospace,monospace;margin:4px 4px 0 0}
.chip.org{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:#c4b5fd}
.lab{font-size:8px;text-transform:uppercase;opacity:.7}
.empty{font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:10px}
.btn{display:inline-block;padding:8px 12px;border-radius:8px;font-size:11px;border:1px solid #334155;margin-right:6px}
.btn.p{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#6ee7b7}
</style></head>
<body>
<p class="cap">Profile · how to reach them</p>
<div class="card">
  <div class="h">How to reach them</div>
  <div class="chip"><span class="lab">Personal</span>j.walker@…</div>
  <div class="chip org"><span class="lab">Company</span>info@walkertool.com</div>
  <div class="chip"><span class="lab">Phone</span>+1 616 ···</div>
</div>
<div class="card">
  <div class="h">Empty</div>
  <div class="empty">No public email or phone on file yet. Run research to search registries and the open web.</div>
  <span class="btn p">Run research</span><span class="btn">Open Reactor</span>
</div>
</body></html>
