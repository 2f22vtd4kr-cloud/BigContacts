<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase P</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;gap:32px;flex-wrap:wrap}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.card{width:360px;border-radius:12px;border:1px solid #1e293b;background:rgba(7,15,29,.97);padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.45)}
input{width:100%;border-radius:6px;border:1px solid #22d3ee88;background:#020617;color:#e2e8f0;font-size:12px;padding:10px;outline:2px solid #22d3ee;outline-offset:2px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;text-align:center;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;font-size:11px;outline:2px solid #22d3ee;outline-offset:2px}
.badge{display:inline-block;margin-top:14px;font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.08em;color:#a7f3d0;border:1px solid rgba(52,211,153,.35);border-radius:6px;padding:6px 10px}
</style></head>
<body>
<div>
<p class="cap">Desktop desk search + focus ring</p>
<div class="card">
  <input value="hr@" readonly />
  <div class="row"><div class="btn">Scene chip</div><div class="btn">Scheme node</div></div>
  <div class="badge">prefers-reduced-motion · loops off</div>
</div>
</div>
</body></html>
