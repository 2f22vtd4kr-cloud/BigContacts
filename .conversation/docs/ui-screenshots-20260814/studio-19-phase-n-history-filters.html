<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase N</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:28px;flex-wrap:wrap}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.phone{width:360px;border-radius:24px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel{margin:14px;border-radius:14px;border:1px solid rgba(148,163,184,.28);padding:12px;background:linear-gradient(165deg,rgba(15,23,42,.96),rgba(7,16,24,.98))}
.lab{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#cbd5e1;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.badge{font-size:8px;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:999px;border:1px solid rgba(148,163,184,.5);background:rgba(100,116,139,.2);color:#e2e8f0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:10px;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#94a3b8}
.chip.on{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.15);color:#a5f3fc}
.step{border:1px solid #1e293b;border-radius:8px;padding:8px;margin-bottom:6px;background:#0f172a;font-size:11px}
.rl{border-top:1px solid rgba(245,158,11,.3);background:rgba(69,26,3,.35);padding:12px 14px}
.rl .t{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fcd34d}
.rl .b{margin-top:4px;font-size:11px;color:rgba(254,243,199,.9);line-height:1.35}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{font-size:11px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.1);color:#fef3c7}
.btn2{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#cbd5e1}
</style></head>
<body>
<div>
<p class="cap">History filters</p>
<div class="phone">
  <div class="panel">
    <div class="lab">History archive <span class="badge">archive</span></div>
    <div class="chips">
      <span class="chip">All</span>
      <span class="chip on">Done</span>
      <span class="chip">Live</span>
      <span class="chip">Failed</span>
    </div>
    <div class="step">1 · Domain · <span style="color:#6ee7b7">done</span></div>
    <div class="step">3 · Browser · <span style="color:#6ee7b7">done</span></div>
  </div>
</div>
</div>
<div>
<p class="cap">Rate-limit recovery</p>
<div class="phone">
  <div style="height:120px;background:#0b1120"></div>
  <div class="rl">
    <div class="t">Provider rate limit</div>
    <div class="b">Atlas is rotating configured keys and will keep working. · Groq, Serper</div>
    <div class="btns"><span class="btn">Check status</span><span class="btn btn2">Dismiss</span></div>
  </div>
</div>
</div>
</body></html>
