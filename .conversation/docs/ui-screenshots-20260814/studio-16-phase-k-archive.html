<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase K archive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;border-radius:28px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.header{padding:14px 16px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
.chip{font-size:11px;padding:6px 10px;border-radius:12px;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.1);color:#67e8f9}
.panel{margin:16px;border-radius:16px;border:1px solid rgba(148,163,184,.28);padding:12px;background:linear-gradient(165deg,rgba(15,23,42,.96),rgba(7,16,24,.98));box-shadow:inset 0 0 0 1px rgba(148,163,184,.08),0 12px 36px rgba(0,0,0,.45)}
.lab{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.lab strong{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#cbd5e1}
.badge{font-size:8px;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid rgba(148,163,184,.5);background:rgba(100,116,139,.2);color:#e2e8f0}
.step{border:1px solid #1e293b;border-radius:10px;padding:10px;margin-bottom:8px;background:#0f172a}
.step .t{font-size:10px;font-family:ui-monospace,monospace;color:#94a3b8;display:flex;justify-content:space-between}
.step .s{font-size:12px;color:#e2e8f0;margin-top:4px}
.done{color:#6ee7b7;font-size:9px;font-weight:700;letter-spacing:.08em}
.cap{font-size:10px;font-family:ui-monospace,monospace;color:#64748b;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:12px}
</style></head>
<body>
<div>
<p class="cap">Apex Atlas · Phase K · history archive</p>
<div class="phone">
  <div class="header">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:8px;height:8px;border-radius:99px;background:#64748b"></span>
      <strong style="font-size:13px">Apex Atlas</strong>
    </div>
    <button class="chip">Live</button>
  </div>
  <div class="panel">
    <div class="lab">
      <strong>History archive</strong>
      <span class="badge">archive</span>
      <span style="margin-left:auto;font-size:10px;font-family:ui-monospace,monospace;color:#64748b">4 steps</span>
    </div>
    <div class="step"><div class="t"><span>1 · Domain</span><span class="done">DONE</span></div><div class="s">walkertool.com · registered 1996</div></div>
    <div class="step"><div class="t"><span>2 · Serper</span><span class="done">DONE</span></div><div class="s">Leadership + contact SERP</div></div>
    <div class="step"><div class="t"><span>3 · Browser</span><span class="done">DONE</span></div><div class="s">resources.html · hr@ admitted</div></div>
    <div class="step"><div class="t"><span>4 · Analyst</span><span class="done">DONE</span></div><div class="s">Hendricks ownership locked</div></div>
    <p style="text-align:center;font-size:9px;font-family:ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-top:8px">Swipe right or tap Live to return</p>
  </div>
</div>
</div>
</body></html>
