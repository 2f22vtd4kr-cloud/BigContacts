<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase O</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:28px;flex-wrap:wrap}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.phone{width:360px;border-radius:24px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel{margin:14px;border-radius:14px;border:1px solid rgba(148,163,184,.28);padding:12px;background:linear-gradient(165deg,rgba(15,23,42,.96),rgba(7,16,24,.98))}
input{width:100%;border-radius:8px;border:1px solid rgba(34,211,238,.45);background:#020617;padding:10px 12px;color:#e2e8f0;font-size:12px;margin-bottom:10px;outline:none;box-shadow:0 0 0 1px rgba(34,211,238,.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:10px;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.1);color:#94a3b8}
.chip.on{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.15);color:#a5f3fc}
.step{border:1px solid #1e293b;border-radius:8px;padding:8px;background:#0f172a;font-size:11px;margin-bottom:6px}
.hint{font-size:9px;font-family:ui-monospace,monospace;color:#64748b;text-align:center;margin-top:8px;letter-spacing:.06em}
.node{width:280px;border-radius:8px;border:1px solid rgba(34,211,238,.5);background:rgba(34,211,238,.08);padding:12px 14px;outline:2px solid #22d3ee;outline-offset:3px;display:flex;justify-content:space-between;align-items:center}
.node .t{font-size:12px;font-weight:700;letter-spacing:.1em;color:#22d3ee}
.node .tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3e635}
</style></head>
<body>
<div>
<p class="cap">History search</p>
<div class="phone"><div class="panel">
  <input value="mailto" readonly />
  <div class="chips"><span class="chip on">All</span><span class="chip">Done</span><span class="chip">Live</span></div>
  <div class="step">Browser · resources.html · mailto admitted</div>
  <p class="hint">/ focuses search · esc exits archive</p>
</div></div>
</div>
<div>
<p class="cap">Scheme keyboard focus</p>
<div class="node"><span class="t">DOMAIN SURFACE</span><span class="tag">done</span></div>
<p class="hint" style="margin-top:12px">tab · arrows · home/end</p>
</div>
</body></html>
