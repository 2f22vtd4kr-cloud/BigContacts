<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apex Reactor Live Desk — visual QA</title>
<style>
  :root { --bg:#0b1120; --panel:#0d1219; --lime:#9CFF1A; --violet:#a78bfa; --text:#e8e0cc; --muted:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, sans-serif; min-height:100vh; }
  h1 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#b8ff4d; padding:14px 16px; border-bottom:1px solid #192840; }
  .tabs { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid #192840; flex-wrap:wrap; }
  .tabs button { background:#121820; border:1px solid #253850; color:#94a3b8; padding:8px 12px; border-radius:8px; font-size:11px; cursor:pointer; }
  .tabs button.on { border-color:#9CFF1A88; color:#d4ff8a; background:#9CFF1A14; }
  .stage { padding:16px; max-width:1100px; margin:0 auto; }
  .frame { border:1px solid #1e293b; border-radius:14px; overflow:hidden; background:#080c14; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .frame.desktop { width:100%; }
  .frame.mobile { width:390px; margin:0 auto; min-height:720px; }
  .chrome-top { height:36px; background:#0a0e16; border-bottom:1px solid #1e293b; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:10px; color:#64748b; letter-spacing:.12em; text-transform:uppercase; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#9CFF1A; box-shadow:0 0 10px #9CFF1A; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.4 } }
  .desk { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .narration { border:1px solid rgba(167,139,250,.4); background:linear-gradient(135deg,rgba(76,29,149,.45),#0c1018); border-radius:12px; padding:12px 14px; }
  .narration .label { font-family:ui-monospace,monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#ddd6fe; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .narration .dot { width:8px; height:8px; border-radius:50%; background:#c4b5fd; box-shadow:0 0 10px #a78bfa; animation:pulse 1.2s infinite; }
  .narration p { font-size:13px; line-height:1.45; color:#f5f3ff; }
  .scene { border:1px solid rgba(156,255,26,.18); border-radius:12px; overflow:hidden; background:#0a0f14; }
  .scene-bar { height:32px; background:#0c1410; border-bottom:1px solid rgba(156,255,26,.12); display:flex; align-items:center; gap:8px; padding:0 10px; font-size:10px; color:#94a3b8; letter-spacing:.06em; }
  .scene-body { padding:12px; }
  .urlbar { font-family:ui-monospace,monospace; font-size:10px; color:#94a3b8; background:#0d1219; border:1px solid rgba(156,255,26,.08); border-radius:6px; padding:6px 8px; margin-bottom:10px; }
  .search-box { background:#fff; color:#202124; border-radius:24px; padding:10px 16px; font-size:14px; margin-bottom:12px; display:flex; gap:10px; align-items:center; box-shadow:0 1px 6px rgba(0,0,0,.2); }
  .serp-row { padding:8px 0; border-bottom:1px solid #1e293b; }
  .serp-row a { color:#8ab4f8; font-size:14px; text-decoration:none; }
  .serp-row .u { color:#81c995; font-size:11px; }
  .serp-row .s { color:#94a3b8; font-size:12px; margin-top:2px; }
  .pre { font-family:ui-monospace,monospace; font-size:11px; color:#d9f99d; white-space:pre-wrap; line-height:1.5; }
  .badge { display:inline-flex; font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px solid #9CFF1A55; color:#b8ff4d; }
  .row { display:grid; gap:12px; }
  .desktop .row { grid-template-columns: 1.1fr .9fr; }
  .side { border-left:1px solid #1e293b; padding:12px; background:#0a0f18; min-height:520px; }
  .note { margin-top:16px; font-size:11px; color:#64748b; line-height:1.5; }
  .fail { border-color:#fb718555; }
  .fail .badge { border-color:#fb718555; color:#fda4af; }
  .rail { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .rail span { font-size:9px; padding:4px 8px; border-radius:6px; border:1px solid #253850; color:#94a3b8; }
  .rail span.on { border-color:#9CFF1A55; color:#d4ff8a; }
  .rail span.rh { border-color:#a78bfa55; color:#ddd6fe; }
  .reg { background:#0c1210; border:1px solid #1a2e24; border-radius:8px; padding:10px; font-size:12px; }
  .reg h3 { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#86efac; margin-bottom:8px; }
  .foot { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .foot div { background:#121820; border:1px solid #253850; border-radius:8px; padding:8px; font-size:11px; color:#94a3b8; }
  .foot strong { display:block; color:#d4ff8a; font-size:10px; letter-spacing:.1em; margin-bottom:4px; }
</style>
</head>
<body>
  <h1>Apex Reactor — Live Desk visual QA</h1>
  <div class="tabs" id="tabs"></div>
  <div class="stage" id="stage"></div>
  <p class="note" style="padding:0 16px 24px;max-width:1100px;margin:0 auto;">
    Ground truth for Replit: violet = right-hand adaptive voice (NVIDIA). Scene chrome = tool kind (search / fetch / registry / footprint). Not scripted ATLAS_EVENT dumps.
  </p>
<script>
const N = (t) => `<div class="narration"><div class="label"><span class="dot"></span>Right-hand · under the hood</div><p>${t}</p></div>`;
const rail = (items) => `<div class="rail">${items.map(([l,c])=>`<span class="${c||''}">${l}</span>`).join('')}</div>`;

function desk(body, mobile) {
  return `<div class="frame ${mobile?'mobile':'desktop'}">
    <div class="chrome-top"><span class="live-dot"></span> Live desk · Apex Atlas · ${mobile?'mobile':'desktop'}</div>
    <div class="${mobile?'':'row'}">
      ${mobile?'':`<div class="side"><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#64748b;margin-bottom:10px">Scheme</div>
        <div style="height:200px;border:1px dashed #1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475569;font-size:12px">Intelligence graph</div>
        <div style="margin-top:12px;font-size:11px;color:#94a3b8;line-height:1.4">Target locked · free ReAct dig · tools on demand</div></div>`}
      <div class="desk">${body}</div>
    </div>
  </div>`;
}

const scenes = {
  "desk-live": () => desk(`
    ${rail([['Search','on'],['Fetch','on'],['RH live','rh'],['Extract','']])}
    ${N("About page loaded cleanly — pulling domain emails and officer bylines before any social footprint tools.")}
    <div class="scene">
      <div class="scene-bar"><span class="live-dot"></span> Reading a page · fetch · <span class="badge">Live</span></div>
      <div class="scene-body">
        <div class="urlbar">https://example-demo.test/about</div>
        <div class="pre">CONTACT FACTS
email: info@example-demo.test
phone: +1 555 0100
— page excerpt —
Demo Holdings Ltd is privately held…</div>
      </div>
    </div>`),
  "desk-search": () => desk(`
    ${rail([['Web search','on'],['Serper','on'],['RH live','rh']])}
    ${N("Serper returned the company site and a filings hit — next hop is the about page, not another blind search.")}
    <div class="scene">
      <div class="scene-bar">Web search · Google / Serper · <span class="badge">Done</span></div>
      <div class="scene-body">
        <div class="search-box"><strong style="color:#4285f4">G</strong><span>Demo Holdings Ltd contact</span></div>
        <div class="serp-row"><a href="#">Demo Holdings — About</a><div class="u">https://example-demo.test/about</div><div class="s">Company overview and leadership…</div></div>
        <div class="serp-row"><a href="#">SEC filing — Demo Holdings</a><div class="u">https://www.sec.gov/…</div><div class="s">Form related to issuer…</div></div>
      </div>
    </div>`),
  "desk-registry": () => desk(`
    ${rail([['Registry','on'],['EDGAR','on'],['RH live','rh']])}
    ${N("Pulling the SEC document for this issuer so we can read role lines and notice addresses from the filing itself.")}
    <div class="scene">
      <div class="scene-bar">Official records · EDGAR · <span class="badge">Live</span></div>
      <div class="scene-body">
        <div class="reg">
          <h3>SEC EDGAR</h3>
          <div class="urlbar">https://www.sec.gov/Archives/edgar/data/…</div>
          <div class="pre">Form SC 13D — reporting person block
Notice address / phone fields when present…</div>
        </div>
      </div>
    </div>`),
  "desk-offline": () => desk(`
    ${rail([['Perplexity','fail'],['RH live','rh']])}
    ${N("Perplexity is not configured on this desk — skipping that lane and staying on Serper / Tavily / Exa for search.")}
    <div class="scene fail">
      <div class="scene-bar">Web search · Perplexity · <span class="badge">Offline</span></div>
      <div class="scene-body">
        <div class="pre" style="color:#fda4af">Provider offline · 0 keys
No LIVE badge · no fabricated results</div>
      </div>
    </div>`),
  "mob-live": () => desk(`
    ${rail([['Fetch','on'],['RH','rh']])}
    ${N("Mobile desk: same under-the-hood voice. Reading the about page for contact facts.")}
    <div class="scene">
      <div class="scene-bar"><span class="live-dot"></span> Fetch · <span class="badge">Live</span></div>
      <div class="scene-body">
        <div class="urlbar">https://example-demo.test/about</div>
        <div class="pre">CONTACT FACTS · info@… · +1 555…</div>
      </div>
    </div>`, true),
  "mob-foot": () => desk(`
    ${rail([['Footprint','on'],['Holehe','on'],['RH','rh']])}
    ${N("Running an email footprint check on a candidate address found on the company domain — not inventing new emails.")}
    <div class="scene">
      <div class="scene-bar">Footprint · Holehe · <span class="badge">Live</span></div>
      <div class="scene-body">
        <div class="foot">
          <div><strong>HOLEHE</strong>info@example-demo.test<br/>sites checked…</div>
          <div><strong>SOURCE</strong>from about page<br/>not invented</div>
        </div>
      </div>
    </div>`, true),
};

const order = [
  ["desk-live","Desktop · live dig"],
  ["desk-search","Desktop · Google SERP"],
  ["desk-registry","Desktop · registry"],
  ["desk-offline","Desktop · tool offline"],
  ["mob-live","Mobile · live dig"],
  ["mob-foot","Mobile · footprint"],
];
const tabs = document.getElementById("tabs");
const stage = document.getElementById("stage");
function show(id) {
  order.forEach(([k],i)=>{ tabs.children[i].classList.toggle("on", k===id); });
  stage.innerHTML = scenes[id]();
}
order.forEach(([id,label])=>{
  const b=document.createElement("button");
  b.textContent=label; b.onclick=()=>show(id);
  tabs.appendChild(b);
});
show("desk-registry");
</script>
</body>
</html>
