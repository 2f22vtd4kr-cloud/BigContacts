name: Temporary identity boundary repair

on:
  push:
    branches:
      - apex/identity-boundary-candidate-names

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove target-name inheritance from candidate evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/target-contact-agent.ts')
          s = p.read_text()
          old = '''export function sourceBackedFindings(findings: AgenticFinding[]): AgenticFinding[] {\n  return findings.filter((finding) =>\n    Array.isArray(finding.sourceUrls)\n    && finding.sourceUrls.some((url) => /^https?:\\/\\/\\S+$/i.test(String(url))),\n  );\n}'''
          new = '''export function sourceBackedFindings(findings: AgenticFinding[]): AgenticFinding[] {\n  return findings\n    .filter((finding) =>\n      Array.isArray(finding.sourceUrls)\n      && finding.sourceUrls.some((url) => /^https?:\\/\\/\\S+$/i.test(String(url))),\n    )\n    .map((finding) => {\n      const candidate = String(finding.scope).toLowerCase() === "candidate";\n      const explicitPerson = typeof finding.personName === "string" && finding.personName.trim().length > 0;\n      if (candidate && !explicitPerson) {\n        return { ...finding, scope: "organization", personName: null };\n      }\n      return finding;\n    });\n}'''
          if s.count(old) != 1: raise SystemExit('sourceBackedFindings block not found exactly once')
          s = s.replace(old, new, 1)
          old2 = '''      scope: String(f.scope).toLowerCase() === "candidate" ? "candidate" : "organization",\n      personName: String(f.scope).toLowerCase() === "candidate" ? (f.personName ?? personName) : null,'''
          new2 = '''      scope: String(f.scope).toLowerCase() === "candidate" && typeof f.personName === "string" && f.personName.trim().length > 0 ? "candidate" : "organization",\n      personName: String(f.scope).toLowerCase() === "candidate" && typeof f.personName === "string" && f.personName.trim().length > 0 ? f.personName : null,'''
          if s.count(old2) != 1: raise SystemExit('findingsToContacts inheritance block not found exactly once')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --filter ./artifacts/api-server... --registry=https://registry.npmjs.org/
      - run: pnpm --dir artifacts/api-server run test -- --run src/src/test/agentic-scope-boundary.test.ts
      - run: pnpm --dir artifacts/api-server run typecheck
      - name: Commit verified identity boundary repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/target-contact-agent.ts
          git diff --cached --quiet || git commit -m "fix(identity): reject candidate target-name inheritance"
          git push
