name: One-time Reactor source repair
on:
  push:
    branches: [audit/deep-round9]
    paths:
      - '.github/workflows/one-time-reactor-source-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fabricated Reactor fallback copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/apex-finder/src/pages/reactor.tsx')
          s = p.read_text()
          old = '''      if (/ATLAS_EVENT|DIRECTOR\\s+20\\d{2}-|"kind"\\s*:\\s*"telemetry"/i.test(text)) {\n        return { kind: "log", resultSummary: "Working on this person", timestamp, raw: text };\n      }\n      const cleaned = text\n        .replace(/^\\d{4}-\\d{2}-\\d{2}T[\\d:.Z+-]+\\s*/, "")\n        .replace(/^DIRECTOR\\s+\\S+\\s*/i, "")\n        .trim();\n      return {\n        kind: "log",\n        resultSummary: cleaned.length > 8 && cleaned.length < 160 ? cleaned : "Working on this person",\n        timestamp,\n        raw: text,\n      };'''
          new = '''      if (/ATLAS_EVENT|DIRECTOR\\s+20\\d{2}-|"kind"\\s*:\\s*"telemetry"/i.test(text)) {\n        return { kind: "log", timestamp, raw: text };\n      }\n      const cleaned = text\n        .replace(/^\\d{4}-\\d{2}-\\d{2}T[\\d:.Z+-]+\\s*/, "")\n        .replace(/^DIRECTOR\\s+\\S+\\s*/i, "")\n        .trim();\n      return {\n        kind: "log",\n        ...(cleaned.length > 8 && cleaned.length < 160 ? { resultSummary: cleaned } : {}),\n        timestamp,\n        raw: text,\n      };'''
          if old not in s:
              raise SystemExit('expected Reactor fallback block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/apex-finder/src/pages/reactor.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(reactor): remove fabricated live-state fallback copy'
          git push
