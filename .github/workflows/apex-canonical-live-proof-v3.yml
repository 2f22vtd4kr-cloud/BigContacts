name: Apex Canonical Live Proof v3
# Canonical runtime proof: tracked source, failure boundary, provider readiness, and genuine evidence gate.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apex-canonical-live-proof-v3.yml"
      - "artifacts/api-server/src/src/lib/agentic-web-research.ts"
      - "artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts"
      - "artifacts/api-server/src/src/test/canonical-discovery-failure-boundary.test.ts"
      - "scripts/check-agentic-runtime.mjs"
      - "artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apex-canonical-live-proof-v3-${{ github.sha }}
  cancel-in-progress: true
jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_URL_1: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      NODE_ENV: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHOISJSON_API_KEY: ${{ secrets.WHOISJSON_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      APEX_AGENTIC_CONCURRENCY: "1"
      APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
      AGENTIC_PROVIDER_DECISION_TIMEOUT_MS: "55000"
      GROQ_AGENTIC_MIN_INTERVAL_MS: "30000"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --filter @workspace/api-server... --registry=https://registry.npmjs.org/
      - name: Install local services
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
      - name: Build tracked canonical application
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts && cd ../../
          pnpm --dir artifacts/api-server run build
      - name: Static and focused gates
        run: |
          pnpm run check:no-force-dig
          pnpm run check:free-react
          pnpm run check:trajectory
          pnpm run check:agentic-runtime
          pnpm run check:comparison-contract
          node scripts/check-agentic-timeout.mjs
          node scripts/check-workflow-action-pins.mjs
          pnpm --dir artifacts/api-server exec vitest run src/src/test/gemini-transient-retry.test.ts src/src/test/discovery-agent-parse.test.ts src/src/test/discovery-runtime-correctness.test.ts src/src/test/agentic-scope-boundary.test.ts src/src/test/agentic-source-provenance.test.ts src/src/test/canonical-discovery-failure-boundary.test.ts --maxWorkers=1
      - name: Provider readiness
        run: |
          node --input-type=module <<'NODE'
          async function request(url, key, init, attempts = 3) {
            if (!key) return { ok: false, reason: 'missing-key' };
            let last = 'unknown';
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const r = await fetch(url,{...init,signal:AbortSignal.timeout(60000)});
                let body = await r.text();
                if (r.status === 202 && url === 'https://integrate.api.nvidia.com/v1/chat/completions') {
                  let requestId = null;
                  try {
                    const pending = JSON.parse(body);
                    requestId = typeof pending.requestId === 'string' ? pending.requestId : (typeof pending.request_id === 'string' ? pending.request_id : null);
                  } catch {}
                  if (!requestId) last = 'http-202-no-request-id';
                  else {
                    const statusUrl = `https://integrate.api.nvidia.com/v1/status/${encodeURIComponent(requestId)}`;
                    for (let poll = 0; poll < 20; poll++) {
                      await new Promise((resolve) => setTimeout(resolve, 1000));
                      const pendingResponse = await fetch(statusUrl,{method:'GET',headers:init.headers,signal:AbortSignal.timeout(10000)});
                      body = await pendingResponse.text();
                      if (pendingResponse.ok) return { ok: true, body };
                      if (![202,408,425,429,500,502,503,504,529].includes(pendingResponse.status)) { last = `status-http-${pendingResponse.status}`; break; }
                      last = `status-http-${pendingResponse.status}`;
                    }
                  }
                } else if (r.ok) return { ok: true, body };
                last = `http-${r.status}`;
                if (![408,425,429,500,502,503,504,529].includes(r.status) || attempt === attempts) break;
              } catch (error) {
                last = error instanceof Error ? error.message : 'transport-error';
                if (attempt === attempts) break;
              }
              await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
            }
            return { ok: false, reason: last };
          }
          const geminiCatalog = await request('https://generativelanguage.googleapis.com/v1beta/models',process.env.GEMINI_API_KEY,{method:'GET',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'accept':'application/json','x-goog-api-client':'apex-atlas-live-proof/1.0'}},3);
          let geminiModel = null;
          if (geminiCatalog.ok) {
            try {
              const entries = JSON.parse(geminiCatalog.body).models ?? [];
              const retired = /^(gemini-1\.5-flash|gemini-1\.0-pro|gemini-2\.5-flash|gemini-2\.5-pro|gemini-2\.5-flash-lite|gemini-2\.0-flash|gemini-pro|gemini-pro-vision)(?:-|$)/i;
              geminiModel = entries.map((entry) => ({name:String(entry.name||'').replace(/^models\//,''),methods:Array.isArray(entry.supportedGenerationMethods)?entry.supportedGenerationMethods:[]})).filter((entry)=>/^gemini-\d+(?:\.\d+)?-flash(?:-[a-z0-9]+)?$/i.test(entry.name)&&entry.methods.includes('generateContent')&&!retired.test(entry.name)&&!/embedding|aqa|robotics|image|tts|deep-research|latest/i.test(entry.name)).sort((a,b)=>b.name.localeCompare(a.name))[0]?.name ?? null;
            } catch {}
          }
          const gemini = geminiModel ? await request(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(geminiModel)}:generateContent`,process.env.GEMINI_API_KEY,{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'content-type':'application/json','x-goog-api-client':'apex-atlas-live-proof/1.0'},body:JSON.stringify({contents:[{parts:[{text:'Reply READY only.'}]}]})},3) : {ok:false,reason:geminiCatalog.ok?'no-compatible-generateContent-model':'catalog-'+geminiCatalog.reason};
          const deepseek = await request('https://integrate.api.nvidia.com/v1/chat/completions',process.env.DEEPSEEK_API_KEY,{method:'POST',headers:{Authorization:`Bearer ${process.env.DEEPSEEK_API_KEY}`,'content-type':'application/json'},body:JSON.stringify({model:'deepseek-ai/deepseek-v4-flash-0731',messages:[{role:'user',content:'Reply READY only.'}],temperature:1,top_p:0.95,max_tokens:8,reasoning_effort:'high',stream:false})},3);
          const groq = await request('https://api.groq.com/openai/v1/chat/completions',process.env.GROQ_API_KEY,{method:'POST',headers:{Authorization:`Bearer ${process.env.GROQ_API_KEY}`,'content-type':'application/json'},body:JSON.stringify({model:process.env.GROQ_AGENTIC_MODEL||'qwen/qwen3.8-27b',messages:[{role:'user',content:'Reply READY only.'}],max_tokens:8})},3);
          const mistral = await request('https://api.mistral.ai/v1/chat/completions',process.env.MISTRAL_API_KEY,{method:'POST',headers:{Authorization:`Bearer ${process.env.MISTRAL_API_KEY}`,'content-type':'application/json'},body:JSON.stringify({model:process.env.MISTRAL_AGENTIC_MODEL||'mistral-small-latest',messages:[{role:'user',content:'Reply READY only.'}],max_tokens:8})},3);
          console.log(JSON.stringify({gemini:{ok:gemini.ok,reason:gemini.reason,model:geminiModel},deepseek:{ok:deepseek.ok,reason:deepseek.reason},groq:{ok:groq.ok,reason:groq.reason},mistral:{ok:mistral.ok,reason:mistral.reason}}));
          if (!gemini.ok) { console.error('Gemini Boss readiness failed:', gemini.reason); process.exit(2); }
          if (!deepseek.ok) { console.error('DeepSeek Right Hand readiness failed:', deepseek.reason); process.exit(3); }
          if (!groq.ok && !mistral.ok) { console.error('No Investigator LLM is ready:', {groq,mistral}); process.exit(4); }
          NODE
      - name: Create API auth token before process start
        run: echo "APEX_API_AUTH_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start API
        run: |
          redis-cli ping
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 45); do sleep 1; test "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = 200 && break; done
          test "$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz)" = 200
      - name: Open fresh discovery case
        run: |
          curl -sS -m 20 -X POST http://127.0.0.1:8080/api/research/bureau/cases -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" -H 'Content-Type: application/json' -d '{"objective":"Investigate Personio, a European B2B software company, and identify a current senior partnerships, business development, or commercial leader plus only source-backed professional contact routes. Start from Personio’s public company/partnership surfaces and follow the strongest evidence-led pivots you judge useful.","motivation":"Produce one evidence-backed named-person research finding with truthful professional contact routing.","geography":"Europe","exclusions":["Do not invent people, contact values, or source URLs.","Do not substitute organization inboxes for personal contact routes."]}' | tee /tmp/case.json
          node -e 'const x=require("/tmp/case.json"); if(!x.id){console.error(JSON.stringify(x));process.exit(1)}'
      - name: Start canonical case discovery
        run: |
          CASE_ID=$(node -e 'console.log(require("/tmp/case.json").id)')
          curl -sS -m 20 -X POST "http://127.0.0.1:8080/api/research/bureau/cases/${CASE_ID}/run-discovery" -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" -H 'Content-Type: application/json' -d '{}' | tee /tmp/run.json
          node -e 'const x=require("/tmp/run.json"); if(!x.jobId){console.error(JSON.stringify(x));process.exit(1)}'
      - name: Poll canonical discovery job
        run: |
          JOB_ID=$(node -e 'console.log(require("/tmp/run.json").jobId)')
          CASE_ID=$(node -e 'console.log(require("/tmp/case.json").id)')
          STABLE_DONE=0
          for i in $(seq 1 900); do
            sleep 5
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/${JOB_ID}" > /tmp/job.json || true
            STATUS=$(node -e 'const fs=require("fs");try{process.stdout.write(String(JSON.parse(fs.readFileSync("/tmp/job.json","utf8")).status||""))}catch{}')
            case "$STATUS" in
              failed|cancelled) cat /tmp/job.json; exit 1 ;;
              done) STABLE_DONE=$((STABLE_DONE+1)); [ "$STABLE_DONE" -ge 2 ] && break ;;
              *) STABLE_DONE=0 ;;
            esac
          done
          test "$STATUS" = done
          curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/${JOB_ID}" > /tmp/job.json
          FINAL_STATUS=$(node -e 'console.log(require("/tmp/job.json").status||"")')
          test "$FINAL_STATUS" = done
          curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/research/bureau/cases/${CASE_ID}" > /tmp/case-final.json
          curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/research/bureau/cases/${CASE_ID}/events?limit=200" > /tmp/events.json
      - name: Enforce genuine live evidence gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const job=JSON.parse(fs.readFileSync('/tmp/job.json','utf8')); const c=JSON.parse(fs.readFileSync('/tmp/case-final.json','utf8')); const events=JSON.parse(fs.readFileSync('/tmp/events.json','utf8')); const file=JSON.parse(c.caseFile); const text=JSON.stringify({job,c,events});
          const records=Array.isArray(file.investigatorTrajectoryRecords) ? file.investigatorTrajectoryRecords : [];
          const investigator=String(file.investigatorLlm||'').toLowerCase();
          const completedInvestigator=(investigator==='groq'||investigator==='mistral') && records.some((r)=>r?.action==='done'&&r?.execution==='success');
          const successfulRecords=records.filter((r)=>r?.execution==='success');
          const hasSearch=successfulRecords.some((r)=>r?.action==='web_search') || events.some((e)=>/search/i.test(`${e.eventType||''} ${e.summary||''} ${e.payload||''}`));
          const hasVisit=successfulRecords.some((r)=>r?.action==='visit'||r?.action==='browser_fetch') || events.some((e)=>/visit|browse|fetch|http/i.test(`${e.eventType||''} ${e.summary||''} ${e.payload||''}`));
          const observedUrls=new Set(successfulRecords.flatMap((r)=>Array.isArray(r?.observedUrls)?r.observedUrls:[]).filter((u)=>/^https?:\/\//i.test(String(u))).map((u)=>String(u)));
          const candidates=Array.isArray(file.discoveredCandidates) ? file.discoveredCandidates : [];
          const named=candidates.some((x)=>typeof x?.name==='string'&&x.name.trim());
          const sourceBacked=candidates.some((x)=>Array.isArray(x?.sourceUrls)&&x.sourceUrls.some((u)=>observedUrls.has(String(u))));
          const reviewAdmission=candidates.some((x)=>x?.state==='review_only'||x?.reviewOnly===true||x?.admittedEntityId);
          const contactFinding=records.flatMap((r)=>Array.isArray(r?.findings)?r.findings:[]).find((f)=>['email','phone','linkedin','website','social'].includes(String(f?.vectorType||'').toLowerCase())&&typeof f?.personName==='string'&&f.personName.trim()&&Array.isArray(f?.sourceUrls)&&f.sourceUrls.some((u)=>observedUrls.has(String(u))));
          const sourceBackedContact=Boolean(contactFinding);
          console.log(JSON.stringify({caseId:c.id,jobId:job.id,status:job.status,caseStatus:c.status,investigator,completedInvestigator,hasSearch,hasVisit,namedCandidate:named,sourceBacked,reviewAdmission,sourceBackedContact,trajectoryRecords:records.length,observedUrls:observedUrls.size},null,2));
          if(job.status!=='done'||c.status==='error'||!completedInvestigator||!hasSearch||!hasVisit||!named||!sourceBacked||!reviewAdmission||!sourceBackedContact) process.exit(1);
          if(/Jane Doe|John Doe|example\.com/i.test(text)) process.exit(2);
          NODE
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apex-canonical-live-proof-v3
          path: |
            /tmp/case.json
            /tmp/run.json
            /tmp/job.json
            /tmp/case-final.json
            /tmp/events.json
            /tmp/health.json
            /tmp/apex-api.log
          if-no-files-found: ignore
