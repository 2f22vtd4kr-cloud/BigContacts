name: Repair live proof trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-live-proof-trigger.yml'
      - '.github/workflows/apex-canonical-live-proof-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DeepSeek contract to live-proof trigger
        shell: bash
        run: |
          set -euo pipefail
          f='.github/workflows/apex-canonical-live-proof-v3.yml'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apex-canonical-live-proof-v3.yml')
          s=p.read_text()
          needle='      - "artifacts/api-server/src/src/lib/agentic-web-research.ts"\n'
          addition='      - "artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts"\n'
          if addition in s:
              raise SystemExit('DeepSeek path already present')
          if needle not in s:
              raise SystemExit('live-proof trigger anchor missing')
          p.write_text(s.replace(needle, needle + addition, 1))
          PY
          grep -Fq 'artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts' "$f"
          git diff --check
      - name: Commit trigger repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apex-canonical-live-proof-v3.yml
          git commit -m 'ci: trigger live proof on DeepSeek contract changes'
          git push origin HEAD:main
      - name: Remove one-shot repair workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          rm -f .github/workflows/repair-live-proof-trigger.yml
          git add .github/workflows/repair-live-proof-trigger.yml
          git commit -m 'chore: remove one-shot live proof repair workflow'
          git push origin HEAD:main
