name: Apply Dig live tool span typefix

on:
  push:
    branches: [apex/dig-live-tool-spans]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted typefix
        run: node scripts/apply-dig-live-tool-span-typefix.mjs
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/agentic-web-research.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(dig): type active tool span input safely"
          git push
