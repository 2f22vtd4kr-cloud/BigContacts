name: One-time DeepSeek 202 status patch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-deepseek-202-patch.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Patch NVIDIA DeepSeek request handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts')
          s = p.read_text(encoding='utf-8')
          old = '''async function requestDeepSeekCompletion(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  options: { timeoutMs: number; responseFormat?: { type: "json_object" } },\n): Promise<{ raw: string; error: string | null }> {\n  const key = getDeepSeekKey();\n  if (!key) return { raw: "", error: "DEEPSEEK_API_KEY is not configured." };\n\n  try {\n    const response = await fetch(DEEPSEEK_CHAT_API, {\n      method: "POST",\n      headers: {\n        Accept: "application/json",\n        "Content-Type": "application/json",\n        Authorization: `Bearer ${key}`,\n      },\n      body: JSON.stringify({\n        model: DEEPSEEK_CASE_REASONING_MODEL,\n        messages,\n        temperature: 1,\n        top_p: 0.95,\n        // Right-hand output is intentionally bounded: its job is strategic\n        // diagnosis, not to consume an investigator-sized reasoning budget.\n        max_tokens: 16384,\n        reasoning_effort: "high",\n        ...(options.responseFormat ? { response_format: options.responseFormat } : {}),\n        stream: false,\n      }),\n      signal: AbortSignal.timeout(options.timeoutMs),\n    });\n\n    if (!response.ok) {\n      const detail = (await response.text().catch(() => "")).slice(0, 300);\n      return {\n        raw: "",\n        error: `DeepSeek via NVIDIA Integrate ${DEEPSEEK_CASE_REASONING_MODEL} HTTP ${response.status}${detail ? `: ${detail}` : ""}`,\n      };\n    }\n\n    const payload = await response.json() as ChatCompletionResponse;\n    return { raw: extractAssistantText(payload.choices?.[0]?.message), error: null };\n  } catch (error) {\n    return {\n      raw: "",\n      error: error instanceof Error ? error.message : "DeepSeek via NVIDIA Integrate request failed.",\n    };\n  }\n}\n'''
          new = '''async function requestDeepSeekCompletion(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  options: { timeoutMs: number; responseFormat?: { type: "json_object" } },\n): Promise<{ raw: string; error: string | null }> {\n  const key = getDeepSeekKey();\n  if (!key) return { raw: "", error: "DEEPSEEK_API_KEY is not configured." };\n\n  const headers = {\n    Accept: "application/json",\n    "Content-Type": "application/json",\n    Authorization: `Bearer ${key}`,\n  };\n  const deadline = Date.now() + options.timeoutMs;\n  const remainingSignal = () => AbortSignal.timeout(Math.max(1000, Math.min(15000, deadline - Date.now())));\n\n  try {\n    const response = await fetch(DEEPSEEK_CHAT_API, {\n      method: "POST",\n      headers,\n      body: JSON.stringify({\n        model: DEEPSEEK_CASE_REASONING_MODEL,\n        messages,\n        temperature: 1,\n        top_p: 0.95,\n        // Right-hand output is intentionally bounded: its job is strategic\n        // diagnosis, not to consume an investigator-sized reasoning budget.\n        max_tokens: 16384,\n        reasoning_effort: "high",\n        ...(options.responseFormat ? { response_format: options.responseFormat } : {}),\n        stream: false,\n      }),\n      signal: remainingSignal(),\n    });\n\n    let payloadText = await response.text().catch(() => "");\n    if (response.status === 202) {\n      let requestId: string | null = null;\n      try {\n        const pending = JSON.parse(payloadText) as { requestId?: unknown; request_id?: unknown };\n        const candidate = pending.requestId ?? pending.request_id;\n        requestId = typeof candidate === "string" && candidate.trim() ? candidate.trim() : null;\n      } catch {}\n      if (!requestId) {\n        return { raw: "", error: `DeepSeek via NVIDIA Integrate ${DEEPSEEK_CASE_REASONING_MODEL} HTTP 202 without requestId` };\n      }\n\n      const statusUrl = `https://integrate.api.nvidia.com/v1/status/${encodeURIComponent(requestId)}`;\n      while (Date.now() < deadline) {\n        await new Promise((resolve) => setTimeout(resolve, 1000));\n        if (Date.now() >= deadline) break;\n        const polled = await fetch(statusUrl, { method: "GET", headers, signal: remainingSignal() });\n        payloadText = await polled.text().catch(() => "");\n        if (polled.ok) {\n          const payload = JSON.parse(payloadText) as ChatCompletionResponse;\n          return { raw: extractAssistantText(payload.choices?.[0]?.message), error: null };\n        }\n        if (polled.status === 202 || [408, 425, 429, 500, 502, 503, 504, 529].includes(polled.status)) continue;\n        const detail = payloadText.slice(0, 300);\n        return {\n          raw: "",\n          error: `DeepSeek via NVIDIA Integrate status HTTP ${polled.status}${detail ? `: ${detail}` : ""}`,\n        };\n      }\n      return { raw: "", error: `DeepSeek via NVIDIA Integrate ${DEEPSEEK_CASE_REASONING_MODEL} status polling timed out.` };\n    }\n\n    if (!response.ok) {\n      const detail = payloadText.slice(0, 300);\n      return {\n        raw: "",\n        error: `DeepSeek via NVIDIA Integrate ${DEEPSEEK_CASE_REASONING_MODEL} HTTP ${response.status}${detail ? `: ${detail}` : ""}`,\n      };\n    }\n\n    const payload = JSON.parse(payloadText) as ChatCompletionResponse;\n    return { raw: extractAssistantText(payload.choices?.[0]?.message), error: null };\n  } catch (error) {\n    return {\n      raw: "",\n      error: error instanceof Error ? error.message : "DeepSeek via NVIDIA Integrate request failed.",\n    };\n  }\n}\n'''
          if old not in s:
              raise SystemExit('expected DeepSeek request function was not found; refusing mutation')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate and commit patch
        run: |
          grep -n "HTTP 202\|status polling\|max_tokens: 16384\|reasoning_effort: \"high\"" artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          git diff --check
          git diff -- artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          git commit -m "fix: handle DeepSeek asynchronous 202 responses"
          git push
