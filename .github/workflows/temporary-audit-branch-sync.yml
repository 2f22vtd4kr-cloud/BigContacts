name: Temporary audit branch sync
on:
  push:
    branches: [tmp/audit-sync-branch]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes to authoritative audit branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/genuine-five-green-final
          git checkout -B audit/genuine-five-green-final origin/audit/genuine-five-green-final
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('artifacts/api-server/src/src/lib/bureau-agentic-pass.ts'); t=p.read_text()
          bad=r'runIds:\[\.\.\.new Set\(\[\.\.\.\(Array\.isArray\(current\.runIds\).*?input\.runId\]\)\]\)'
          t=re.sub(bad,'runIds:[...new Set([...(Array.isArray(current.runIds)?current.runIds:[]),input.runId])]',t)
          p.write_text(t)
          for f in ['artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts','artifacts/api-server/src/src/lib/target-control-decision.ts','artifacts/api-server/src/src/lib/atlas-control-decision.ts','artifacts/api-server/src/src/lib/final-target-review.ts']:
            p=Path(f); t=p.read_text(); t=re.sub(r'\.slice\(-\d+\)','',t); t=re.sub(r'\.slice\(\d+\s*,\s*\d+\)','',t); p.write_text(t)
          p=Path('artifacts/api-server/src/src/lib/agentic-web-research-core.ts'); t=p.read_text(); old='const body = await response.text(); return body.slice(0, MAX_NETWORK_RESPONSE_BYTES);'; new='const body = await response.text(); if (Buffer.byteLength(body, "utf8") > MAX_NETWORK_RESPONSE_BYTES) throw new Error(`Network response exceeds the configured memory safety bound (${MAX_NETWORK_RESPONSE_BYTES} bytes); response was rejected, not truncated.`); return body;';
          if old in t: t=t.replace(old,new,1)
          p.write_text(t)
          p=Path('artifacts/api-server/src/src/lib/case-bureau.ts'); t=p.read_text()
          for old,new in [('.slice(0, 8)',''),('.slice(0, 12)',''),('.slice(0, 20)',''),('.slice(0, 30)',''),('.slice(0, 40)',''),('.slice(-100)',''),('.slice(-50)',''),('.slice(-30)',''),('.slice(-20)',''),('.slice(0, 100_000)','')]: t=t.replace(old,new)
          t=re.sub(r'return \[\.\.\.new Set\(strings\)\]\.slice\(0, limit\);','return [...new Set(strings)];',t)
          marker='"Gemini Boss text-generation capacity busy; stopping this Boss attempt (not a web-search failure)"'
          if marker in t:
            t=t.replace(marker,'"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"',1); pos=t.index('"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"'); ret=t.find('          return { model, raw: null, error: lastError };',pos)
            if ret<0: raise SystemExit('Boss transient return missing')
            t=t[:ret]+'          continue;'+t[ret+len('          return { model, raw: null, error: lastError };'):]
          elif 'trying the next compatible Gemini model' not in t: raise SystemExit('Boss transient block missing')
          p.write_text(t)
          for f in ['.github/workflows/one-time-context-integrity-closeout.yml','.github/workflows/one-time-lossless-investigator-context.yml']:
            if Path(f).exists(): Path(f).unlink()
          p=Path('.github/workflows/audit-five-greens.yml'); t=p.read_text()
          if 'Context integrity — no hard prompt/data clipping' not in t:
            needle='      - name: Assert unified investigator architecture\n        run: node scripts/check-unified-investigator-architecture.mjs\n'
            guard='''      - name: Context integrity — no hard prompt/data clipping\n        shell: bash\n        run: |\n          set -euo pipefail\n          ! git grep -n -E 'slice\\(-[0-9]+\\)|slice\\([0-9]+, *[0-9]+\\)|MAX_TRAJECTORY_RECORDS = 100|MAX_OBS = 5_000' -- artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/case-bureau.ts\n          grep -q 'trajectoryRecords' artifacts/api-server/src/src/lib/agentic-web-research-core.ts\n          grep -q 'trying the next compatible Gemini model' artifacts/api-server/src/src/lib/case-bureau.ts\n'''
            if needle not in t: raise SystemExit('audit insertion point missing')
            t=t.replace(needle,needle+guard,1)
          p.write_text(t)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply context integrity closeout to authoritative audit branch'
          git push origin audit/genuine-five-green-final
