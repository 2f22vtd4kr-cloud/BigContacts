name: Finish Gemini Right-hand migration
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace retired Right-hand implementation references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          roots = [Path('artifacts/api-server/src'), Path('scripts'), Path('docs'), Path('.github')]
          files = [p for root in roots for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          replacements = [
            ('./deepseek-case-reasoning', './gemini-right-hand-reasoning'),
            ('deepseek-case-reasoning', 'gemini-right-hand-reasoning'),
            ('getDeepSeekCaseReasoningStatus', 'getGeminiRightHandStatus'),
            ('runDeepSeekCaseReasoning', 'runGeminiRightHandCaseReasoning'),
            ('runDeepSeekDiscoveryAdvice', 'runGeminiRightHandDiscoveryAdvice'),
            ('runDeepSeekFreeJson', 'runGeminiRightHandFreeJson'),
            ('runDeepSeekFinalReview', 'runGeminiRightHandFinalReview'),
            ('DeepSeekCaseReasoningResult', 'GeminiRightHandCaseReasoningResult'),
            ('DeepSeekCaseReasoningStatus', 'GeminiRightHandStatus'),
            ('DeepSeekDiscoveryAdviceResult', 'GeminiRightHandDiscoveryAdviceResult'),
            ('deepseek-right-hand-final-review', 'gemini-right-hand-final-review'),
            ('deepseek-right-hand', 'gemini-right-hand'),
            ('deepseek-v4-flash-0731', 'gemini-3.8-flash'),
            ('deepseek-ai/deepseek-v4-flash-0731', 'gemini-3.8-flash'),
            ('DeepSeek via Gemini API', 'Gemini Right-hand'),
            ('DeepSeek via Gemini Right-hand', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right Hand', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right-hand', 'Gemini Right-hand'),
            ('DeepSeek Right-hand', 'Gemini Right-hand'),
            ('DeepSeek', 'Gemini Right-hand'),
            ('deepseek', 'gemini'),
          ]
          for p in files:
              try: s = p.read_text()
              except (UnicodeDecodeError, OSError): continue
              old = s
              for a, b in replacements: s = s.replace(a, b)
              if s != old: p.write_text(s)
          PY
          rm -f artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          rm -f scripts/migrate-right-hand-to-deepseek.mjs
          rm -f .github/workflows/_one_shot_gemini_cleanup.yml .github/workflows/fix-provider-cleanup.yml .github/workflows/retire-provider-globally.yml .github/workflows/final-provider-role-scrub.yml .github/workflows/finish-gemini-migration.yml
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'DEEPSEEK|DeepSeek|deepseek|NVIDIA_NIM|NVIDIA_AGENTIC|NVIDIA NIM|NVIDIA Integrate|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' artifacts/api-server/src scripts docs .github 2>/dev/null; then
            echo 'Retired provider references remain after migration.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Gemini Right-hand source migration' || exit 0
          git push
