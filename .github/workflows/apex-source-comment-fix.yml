name: apex-source-comment-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip apex comment fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix stale role comment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/ai-extractor.ts')
          s = p.read_text()
          old = '/** Final card publication review: Boss (Gemini) primary → NVIDIA right-hand → Groq.\n'
          new = '/** Final card publication review: Boss (Gemini) primary → NVIDIA right-hand.\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale final-review comment, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
      - name: Verify
        run: |
          ! grep -q 'Final card publication review: Boss (Gemini) primary → NVIDIA right-hand → Groq' artifacts/api-server/src/src/lib/ai-extractor.ts
          grep -q 'Final card publication review: Boss (Gemini) primary → NVIDIA right-hand.' artifacts/api-server/src/src/lib/ai-extractor.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/ai-extractor.ts
          git commit -m 'Correct final-review role comment [skip apex comment fix]'
          git push origin HEAD:main

# One-time source comment correction; remove after the source commit lands.
