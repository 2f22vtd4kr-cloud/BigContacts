name: audit current stack verification

on:
  push:
    branches: [audit/stack-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --dir artifacts/apex-finder run build
      - run: node scripts/check-frontend-responsive.mjs
      - run: node scripts/check-reactor-live-integrity.mjs