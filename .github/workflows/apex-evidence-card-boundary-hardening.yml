name: one-time evidence card boundary hardening
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove legacy evidence-to-card projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('artifacts/api-server/src/src/lib/bureau-contact-persist.ts')
          s = p.read_text()

          auto = '''  // Dig bag → card: promote best non-issuer phone/email onto the entity so
          // free agentic findings are not stranded as evidence_only while EDGAR-Phone stays.
          try
          await promoteBureauContactsToEntityCard(entityId, items ?? [], source, jobId);
          } catch (err) {
            logger.debug(
              { err: err instanceof Error ? err.message : String(err), entityId },
              "promoteBureauContactsToEntityCard skipped",
            );
          }
          return rows.length;'''
          replacement = '''  // Evidence persistence ends here. Card mutation belongs exclusively to
  // the explicit investigator-selected promotion boundary.
  return rows.length;'''
          if s.count(auto) != 1:
              raise SystemExit('expected exactly one legacy auto-promotion block')
          s = s.replace(auto, replacement, 1)

          generated_related = '''    // related-person without URL: attach issuer EDGAR search when company known; else drop
    if (urls.length === 0 && /^related-person:/i.test(value)) {
      if (!companyName) continue;
      urls = [
        `https://efts.sec.gov/LATEST/search-index?q=${encodeURIComponent('"' + companyName.slice(0, 80) + '"')}&forms=SC+13D,SC+13G`,
      ];
    }
    // Org issuer name anchor without URL: attach EDGAR search, never a fake contact
    if (urls.length === 0 && (vectorType === "domain" || vectorType === "organization" || vectorType === "other")
        && orgish && companyName) {
      urls = [
        `https://efts.sec.gov/LATEST/search-index?q=${encodeURIComponent('"' + companyName.slice(0, 80) + '"')}&forms=SC+13D,SC+13G`,
      ];
    }
'''
          if s.count(generated_related) != 1:
              raise SystemExit('expected exactly one generated query-URL provenance block')
          s = s.replace(generated_related, '    // Missing exact source pages are not provenance. Do not manufacture search URLs.\n', 1)

          pattern = re.compile(r'/\*\* Rehydrate entity cards from durable contact_evidence \(no new dig\)\. \*/\nexport async function rehydrateEntityCardFromEvidence\(entityId: number\): Promise<boolean> \{.*?\n\}', re.S)
          replacement_rehydrate = '''/**
 * Legacy rehydration is intentionally disabled.
 * Durable evidence is not a promotion decision; only the canonical investigator
 * promotion boundary may mutate an entity card.
 */
export async function rehydrateEntityCardFromEvidence(_entityId: number): Promise<boolean> {
  return false;
}'''
          s2, n = pattern.subn(replacement_rehydrate, s, count=1)
          if n != 1:
              raise SystemExit('expected exactly one legacy rehydration function')
          p.write_text(s2)
          PY
          git diff --check
          git diff --check
          grep -n "promoteBureauContactsToEntityCard(entityId" artifacts/api-server/src/src/lib/bureau-contact-persist.ts && exit 1 || true
          grep -n "efts.sec.gov/LATEST/search-index" artifacts/api-server/src/src/lib/bureau-contact-persist.ts && exit 1 || true
          git diff --stat
      - name: Verify targeted boundary tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts src/src/test/agentic-scope-boundary.test.ts src/src/test/investigator-promotion-contract.test.ts
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/bureau-contact-persist.ts
          git rm .github/workflows/apex-evidence-card-boundary-hardening.yml
          git commit -m 'fix: enforce explicit evidence to card promotion boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}