name: Materialize canonical agentic source

on:
  push:
    paths:
      - ".github/workflows/.materialize-agentic-source"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize canonical agentic source
        run: node scripts/apply-agentic-concurrency-hardening.mjs
      - name: Verify materialized source changed only where expected
        run: |
          git diff --check
          git diff -- artifacts/api-server/src/src/lib/agentic-web-research.ts | grep -E '^\+|^- ' | head -120 || true
      - name: Commit canonical source and remove migration harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-agentic-canonical-source.yml .github/workflows/.materialize-agentic-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/agentic-web-research.ts .github/workflows/materialize-agentic-canonical-source.yml .github/workflows/.materialize-agentic-source
          if git diff --cached --quiet; then
            echo "No canonical source changes were necessary."
            exit 0
          fi
          git commit -m "fix(agentic): materialize canonical investigator source [skip ci]"
          git push origin HEAD:main
