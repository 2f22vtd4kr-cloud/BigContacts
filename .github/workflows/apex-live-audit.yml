name: Apex Live Bureau Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/live-batch-trigger.md]
permissions:
  contents: read

jobs:
  live-bureau-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_local_dev
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U apex -d apex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      NODE_ENV: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_AGENTIC_MODEL: gemini-3.8-flash
      GEMINI_RIGHT_HAND_API_KEY: ${{ secrets.GEMINI_RIGHT_HAND_API_KEY }}
      GEMINI_RIGHT_HAND_MODEL: gemini-3.8-flash
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_AGENTIC_MODEL: mistral-small-latest
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      WHOISJSON_API_KEY: ${{ secrets.WHOISJSON_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      APEX_AGENTIC_CONCURRENCY: "1"
      APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
      APEX_ALLOW_SCHEMA_PUSH: "true"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: ${{ github.sha }} }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Build canonical application
        run: pnpm run build
      - name: Initialize canonical Apex schema
        run: bash scripts/initialize-apex-schema.sh
      - name: Configure isolated CI API authentication
        shell: bash
        run: echo "APEX_API_AUTH_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Provider generation preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const results=[];
          async function probe(url,key,model,provider){
            if(!key){results.push({provider,state:'not_configured'});return false}
            try{const r=await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${key}`,'content-type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:'Reply READY only.'}],max_tokens:32}),signal:AbortSignal.timeout(15000)});await r.text();results.push({provider,model,status:r.status});return r.ok}catch(e){results.push({provider,model,state:'transport_error',error:String(e?.message||e)});return false}
          }
          const groq=await probe('https://api.groq.com/openai/v1/chat/completions',process.env.GROQ_API_KEY,'openai/gpt-oss-120b','groq');
          const mistral=await probe('https://api.mistral.ai/v1/chat/completions',process.env.MISTRAL_API_KEY,process.env.MISTRAL_AGENTIC_MODEL,'mistral');
          const keys=[process.env.GEMINI_API_KEY].filter(Boolean);let boss=false;
          let rightHand=false;
          if(process.env.GEMINI_RIGHT_HAND_API_KEY){try{const model=process.env.GEMINI_RIGHT_HAND_MODEL||'gemini-3.8-flash';const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_RIGHT_HAND_API_KEY,'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Return READY only.'}]}],generationConfig:{maxOutputTokens:32,responseMimeType:'application/json'}}),signal:AbortSignal.timeout(15000)});await r.text();results.push({provider:'gemini-right-hand',model,status:r.status});rightHand=r.ok}catch(e){results.push({provider:'gemini-right-hand',state:'transport_error',error:String(e?.message||e)})}}else results.push({provider:'gemini-right-hand',state:'not_configured'});
          for(const key of keys){try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(process.env.GEMINI_AGENTIC_MODEL)}:generateContent`,{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply READY only.'}]}],generationConfig:{maxOutputTokens:32}}),signal:AbortSignal.timeout(15000)});await r.text();results.push({provider:'gemini-boss',status:r.status});if(r.ok){boss=true;break}}catch(e){results.push({provider:'gemini-boss',state:'transport_error',error:String(e?.message||e)})}}
          console.log(JSON.stringify({groq,mistral,boss,rightHand,results},null,2));if(!boss||!rightHand||(!groq&&!mistral))process.exit(2);
          NODE
      - name: Start API
        run: |
          unset APEX_ALLOW_SCHEMA_PUSH
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 45); do sleep 1; test "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = 200 && break; done
          test "$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz)" = 200
      - name: Launch bounded 3-target discovery-first smoke
        run: |
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run -H "Authorization: Bearer $APEX_API_AUTH_TOKEN" -H 'Content-Type: application/json' -d '{"discoveryFirst":true,"targetCount":3,"runResearch":true,"skipFaa":true,"targetTimeoutMs":300000,"researchDepth":"standard"}' | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json");if(!x.jobId)process.exit(1);console.log("job",x.jobId)'
          JOB_ID="$(node -p 'require("/tmp/launch.json").jobId')"
          for i in $(seq 1 120); do
            sleep 5
            curl -sS -m 10 -H "Authorization: Bearer $APEX_API_AUTH_TOKEN" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" > /tmp/job.json
            STATUS="$(node -p 'require("/tmp/job.json").status || ""')"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then cat /tmp/job.json; exit 2; fi
          done
          node -e 'const x=require("/tmp/job.json");if(x.status!=="done"){console.error(x);process.exit(1)}'
          curl -sS -m 20 -H "Authorization: Bearer $APEX_API_AUTH_TOKEN" "http://127.0.0.1:8080/api/entities?type=HNWI&limit=100" > /tmp/entities.json
          curl -sS -m 20 -H "Authorization: Bearer $APEX_API_AUTH_TOKEN" "http://127.0.0.1:8080/api/ingest/atlas-trace/$JOB_ID" > /tmp/atlas-trace.json
      - name: Audit live Bureau
        if: always()
        run: node scripts/audit-live-bureau.mjs
