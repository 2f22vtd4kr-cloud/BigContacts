name: Apex Live Bureau Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-bureau-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      NODE_ENV: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EXA_1: ${{ secrets.EXA_1 }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHOXY_API_KEY: ${{ secrets.WHOXY_API_KEY }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Show exact tip
        run: |
          git log -1 --oneline
          git status --short
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install pnpm
        run: npm install -g pnpm@9
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --filter @workspace/db... --filter @workspace/api-server... --filter @workspace/api-zod... --filter apex-finder-local... --registry=https://registry.npmjs.org/
      - name: Install local services
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
      - name: Schema and builds
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts
          cd ../../
          pnpm --dir artifacts/apex-finder run build
          test -f artifacts/apex-finder/dist/public/index.html
          pnpm --dir artifacts/api-server run build
      - name: Run autonomy and discovery checks
        run: |
          pnpm run check:no-force-dig
          pnpm run check:free-react
          pnpm run check:discovery-quality
          pnpm run check:trajectory
          pnpm run check:comparison-contract
      - name: Start Apex API
        run: |
          redis-cli ping
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 45); do
            sleep 1
            code=$(curl -sS -m 2 -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:8080/api/healthz || true)
            if [ "$code" = "200" ]; then break; fi
          done
          cat /tmp/health.json || true
          head -100 /tmp/apex-api.log || true
          test "$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz)" = "200"
      - name: Launch bounded discovery-first Bureau audit
        run: |
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run \
            -H 'Content-Type: application/json' \
            -d '{"discoveryFirst":true,"targetCount":3,"researchLimit":2,"runResearch":true,"skipFaa":true,"targetTimeoutMs":180000,"researchDepth":"standard"}' \
            | tee /tmp/launch.json
          JOB_ID=$(node -e 'const x=require("/tmp/launch.json"); if(!x.jobId) process.exit(1); process.stdout.write(x.jobId)')
          echo "BUREAU_JOB_ID=$JOB_ID" | tee /tmp/job-id.txt
          test -n "$JOB_ID"
      - name: Poll Bureau until complete
        run: |
          for i in $(seq 1 180); do
            sleep 5
            curl -sS -m 10 http://127.0.0.1:8080/api/ingest/atlas-status > /tmp/atlas-status.json || true
            STATUS=$(node -e 'const fs=require("fs"); try { const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json","utf8")); process.stdout.write(String(x.status || x.job?.status || "")); } catch { process.stdout.write(""); }')
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ] || [ "$STATUS" = "idle" ]; then
              if [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then exit 1; fi
              exit 0
            fi
          done
          echo 'Bureau did not finish within audit window'
          exit 1
      - name: Audit trajectory and entity provenance
        if: always()
        run: |
          echo '=== HEALTH ==='
          curl -sS -m 10 http://127.0.0.1:8080/api/healthz || true
          echo
          echo '=== ATLAS STATUS ==='
          curl -sS -m 10 http://127.0.0.1:8080/api/ingest/atlas-status || true
          echo
          echo '=== ENTITIES ==='
          curl -sS -m 10 'http://127.0.0.1:8080/api/entities?limit=20&offset=0' | tee /tmp/entities.json || true
          echo
          echo '=== SCOREBOARD ==='
          curl -sS -m 10 'http://127.0.0.1:8080/api/ingest/scoreboard-snapshot?limit=20' || true
          echo
          echo '=== API LOG TAIL ==='
          tail -300 /tmp/apex-api.log || true
          echo
          echo '=== AUTONOMY VIOLATION SCAN ==='
          if grep -E 'Phase 0|Pre-run cross-references|DISCOVERY_SOURCES|European venue owners|MODEL TARGET: (security issues|Chief Executive Officer|of Vista Equity Partners|as talented and unique as)' /tmp/apex-api.log; then
            echo 'FAIL: legacy/fabricated discovery marker found in live log'
            exit 1
          fi
      - name: Upload live audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-live-audit
          path: |
            /tmp/launch.json
            /tmp/atlas-status.json
            /tmp/entities.json
            /tmp/health.json
            /tmp/apex-api.log
            /tmp/job-id.txt
          if-no-files-found: ignore
