name: Apex Live Bureau Audit
on:
  workflow_dispatch: {}
jobs:
  live-bureau-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_local_dev
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U apex -d apex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_URL_1: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      ENABLE_REDIS_ON_BOOT: "true"
      NODE_ENV: development
      GROQ_BOSS_API_KEY: ${{ secrets.GROQ_BOSS_API_KEY }}
      GROQ_BOSS_API_KEY_1: ${{ secrets.GROQ_BOSS_API_KEY_1 }}
      GROQ_BOSS_API_KEY_2: ${{ secrets.GROQ_BOSS_API_KEY_2 }}
      GROQ_BOSS_API_KEY_3: ${{ secrets.GROQ_BOSS_API_KEY_3 }}
      GROQ_BOSS_API_KEY_4: ${{ secrets.GROQ_BOSS_API_KEY_4 }}
      GROQ_BOSS_API_KEY_5: ${{ secrets.GROQ_BOSS_API_KEY_5 }}
      GROQ_BOSS_API_KEY_6: ${{ secrets.GROQ_BOSS_API_KEY_6 }}
      GROQ_BOSS_API_KEY_7: ${{ secrets.GROQ_BOSS_API_KEY_7 }}
      GROQ_BOSS_API_KEY_8: ${{ secrets.GROQ_BOSS_API_KEY_8 }}
      GROQ_BOSS_API_KEY_9: ${{ secrets.GROQ_BOSS_API_KEY_9 }}
      GROQ_BOSS_API_KEY_10: ${{ secrets.GROQ_BOSS_API_KEY_10 }}
      GROQ_INVESTIGATOR_API_KEY: ${{ secrets.GROQ_INVESTIGATOR_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_1: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_1 }}
      GROQ_INVESTIGATOR_API_KEY_2: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_2 }}
      GROQ_INVESTIGATOR_API_KEY_3: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_3 }}
      GROQ_INVESTIGATOR_API_KEY_4: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_4 }}
      GROQ_INVESTIGATOR_API_KEY_5: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_5 }}
      GROQ_RIGHT_HAND_API_KEY: ${{ secrets.GROQ_RIGHT_HAND_API_KEY }}
      GROQ_RIGHT_HAND_API_KEY_2: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_2 }}
      GROQ_RIGHT_HAND_API_KEY_3: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_3 }}
      GROQ_RIGHT_HAND_API_KEY_4: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_4 }}
      GROQ_RIGHT_HAND_API_KEY_5: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_5 }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      WHOISJSON_API_KEY: ${{ secrets.WHOISJSON_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      APEX_AGENTIC_CONCURRENCY: "1"
      APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
      APEX_ALLOW_SCHEMA_PUSH: "true"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Fail fast when canonical model roles are not configured
        shell: bash
        run: |
          set -euo pipefail
          require_any() {
            for name in "$@"; do
              value="$(printenv "$name" 2>/dev/null || true)"
              if [ -n "$value" ]; then return 0; fi
            done
            return 1
          }
          require_any GROQ_BOSS_API_KEY GROQ_BOSS_API_KEY_1 GROQ_BOSS_API_KEY_2 GROQ_BOSS_API_KEY_3 GROQ_BOSS_API_KEY_4 GROQ_BOSS_API_KEY_5 GROQ_BOSS_API_KEY_6 GROQ_BOSS_API_KEY_7 GROQ_BOSS_API_KEY_8 GROQ_BOSS_API_KEY_9 GROQ_BOSS_API_KEY_10 || { echo "::error::Missing GitHub Actions secret for the Groq Boss role."; exit 1; }
          require_any GROQ_RIGHT_HAND_API_KEY GROQ_RIGHT_HAND_API_KEY_2 GROQ_RIGHT_HAND_API_KEY_3 GROQ_RIGHT_HAND_API_KEY_4 GROQ_RIGHT_HAND_API_KEY_5 || { echo "::error::Missing GitHub Actions secret for the Groq Right-hand role."; exit 1; }
          require_any GROQ_INVESTIGATOR_API_KEY GROQ_INVESTIGATOR_API_KEY_1 GROQ_INVESTIGATOR_API_KEY_2 GROQ_INVESTIGATOR_API_KEY_3 GROQ_INVESTIGATOR_API_KEY_4 GROQ_INVESTIGATOR_API_KEY_5 || { echo "::error::Missing GitHub Actions secret for the Groq Investigator role."; exit 1; }
          require_any SERPER_API_KEY TAVILY_API_KEY EXA_API_KEY EXA_1 || { echo "::error::Missing GitHub Actions search-provider credential."; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Build canonical application
        run: pnpm run build
      - name: Initialize canonical Apex schema
        run: bash scripts/initialize-apex-schema.sh
      - name: Create ephemeral operator credentials for live audit
        run: |
          set -euo pipefail
          API_TOKEN="$(openssl rand -hex 32)"
          OPERATOR_PASSWORD="$(openssl rand -hex 24)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$API_TOKEN"
          echo "::add-mask::$OPERATOR_PASSWORD"
          echo "::add-mask::$SESSION_SECRET"
          {
            echo "APEX_API_AUTH_TOKEN=$API_TOKEN"
            echo "APEX_OPERATOR_PASSWORD=$OPERATOR_PASSWORD"
            echo "APEX_SESSION_SECRET=$SESSION_SECRET"
          } >> "$GITHUB_ENV"
      - name: Launch bounded 3-target UI-equivalent smoke with live API
        run: |
          set -euo pipefail
          unset APEX_ALLOW_SCHEMA_PUSH
          rm -f /tmp/apex-api.log /tmp/health.json /tmp/health-final.json /tmp/launch.json /tmp/job.json /tmp/job-final.json /tmp/atlas-trace.json /tmp/atlas-trace-final.json /tmp/entities.json
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          API_PID=$!
          collect_evidence() {
            JOB_ID="$(node -p 'try{require("/tmp/launch.json").jobId||""}catch{""}')"
            curl -sS -m 10 http://127.0.0.1:8080/api/healthz | tee /tmp/health-final.json || true
            if [ -n "$JOB_ID" ]; then
              curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" | tee /tmp/job-final.json || true
              curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/atlas-trace/$JOB_ID" | tee /tmp/atlas-trace-final.json || true
            fi
            if kill -0 "$API_PID" 2>/dev/null; then kill "$API_PID" 2>/dev/null || true; fi
            wait "$API_PID" 2>/dev/null || true
          }
          trap collect_evidence EXIT
          READY=0
          for i in $(seq 1 45); do
            CODE="$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)"
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/apex-api.log; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/apex-api.log; exit 1; fi
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" -H 'Content-Type: application/json' -d '{"targetCount":3,"researchDepth":"standard","targetTimeoutMs":420000}' | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json");if(!x.jobId)process.exit(1);console.log("job",x.jobId)'
          JOB_ID="$(node -p 'require("/tmp/launch.json").jobId')"
          for i in $(seq 1 120); do
            sleep 5
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" > /tmp/job.json
            STATUS="$(node -p 'require("/tmp/job.json").status || ""')"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then cat /tmp/job.json; exit 2; fi
          done
          node -e 'const x=require("/tmp/job.json");if(x.status!=="done"){console.error(x);process.exit(1)}'
          curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/entities?type=HNWI&limit=100" > /tmp/entities.json
          curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/atlas-trace/$JOB_ID" > /tmp/atlas-trace.json
      - name: Preserve live failure evidence
        if: always()
        run: |
          # The launch step captures evidence in its EXIT trap before stopping
          # the server; do not overwrite it with requests to a stopped process.
          if [ ! -s /tmp/health-final.json ] && [ -s /tmp/health.json ]; then cp /tmp/health.json /tmp/health-final.json; fi
          if [ ! -s /tmp/job-final.json ] && [ -s /tmp/job.json ]; then cp /tmp/job.json /tmp/job-final.json; fi
          if [ ! -s /tmp/atlas-trace-final.json ] && [ -s /tmp/atlas-trace.json ]; then cp /tmp/atlas-trace.json /tmp/atlas-trace-final.json; fi
      - name: Audit live Bureau
        if: always()
        run: node scripts/audit-live-bureau.mjs
      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-live-audit
          path: |
            /tmp/launch.json
            /tmp/job.json
            /tmp/job-final.json
            /tmp/atlas-trace.json
            /tmp/atlas-trace-final.json
            /tmp/entities.json
            /tmp/health.json
            /tmp/health-final.json
            /tmp/apex-api.log
          if-no-files-found: ignore
