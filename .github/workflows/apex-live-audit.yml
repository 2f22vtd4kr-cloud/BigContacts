name: Apex Live Bureau Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

# Live Bureau is expensive and must have one authoritative run at a time.
# A newer main commit supersedes an older live audit instead of creating a
# queue of stale provider-backed jobs.
concurrency:
  group: apex-live-bureau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  live-bureau-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      NODE_ENV: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EXA_1: ${{ secrets.EXA_1 }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHOXY_API_KEY: ${{ secrets.WHOXY_API_KEY }}
      WHOISJSON_API_KEY: ${{ secrets.WHOISJSON_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Show exact tip
        run: git log -1 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Apply strict free-ReAct purity repair
        run: |
          node scripts/apply-free-react-purity-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/agentic-web-research.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: enforce strict free-ReAct execution [skip ci]"
            git push origin HEAD:main
          fi
      - run: npm install -g pnpm@9
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --filter @workspace/db... --filter @workspace/api-server... --filter @workspace/api-zod... --filter apex-finder-local... --registry=https://registry.npmjs.org/
      - name: Install local services
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
      - name: Schema and builds
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts && cd ../../
          pnpm --dir artifacts/apex-finder run build
          test -f artifacts/apex-finder/dist/public/index.html
          pnpm --dir artifacts/api-server run build
      - name: Static autonomy checks
        run: |
          pnpm run check:no-force-dig
          pnpm run check:free-react
          pnpm run check:discovery-quality
          pnpm run check:trajectory
          pnpm run check:comparison-contract
          pnpm --dir artifacts/api-server exec vitest run src/src/test/discovery-agent-parse.test.ts
      - name: Start Apex API
        run: |
          redis-cli ping
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 45); do
            sleep 1
            test "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = 200 && break
          done
          cat /tmp/health.json || true
          test "$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz)" = 200
      - name: Launch 10-target discovery-first Bureau
        run: |
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run \
            -H 'Content-Type: application/json' \
            -d '{"discoveryFirst":true,"targetCount":10,"researchLimit":10,"runResearch":true,"skipFaa":true,"targetTimeoutMs":180000,"researchDepth":"standard"}' \
            | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json"); if(!x.jobId) { console.error(JSON.stringify(x)); process.exit(1); } console.log(`BUREAU_JOB_ID=${x.jobId}`)'
      - name: Poll Bureau
        run: |
          for i in $(seq 1 600); do
            sleep 5
            curl -sS -m 10 http://127.0.0.1:8080/api/ingest/atlas-status > /tmp/atlas-status.json || true
            node -e 'const fs=require("fs"); try { const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json","utf8")); console.log(JSON.stringify({status:x.status,jobId:x.jobId||x.job?.jobId,phase:x.atlasPhase,progress:x.entityProgress,total:x.entityTotal,names:x.entityNames})); } catch {}'
            STATUS=$(node -e 'const fs=require("fs"); try { const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json","utf8")); process.stdout.write(String(x.status||x.job?.status||"")); } catch {}')
            case "$STATUS" in done|completed|idle) exit 0;; failed|cancelled) exit 1;; esac
          done
          exit 1
      - name: Collect live state
        if: always()
        run: |
          curl -sS -m 10 http://127.0.0.1:8080/api/healthz | tee /tmp/health.json || true
          curl -sS -m 10 http://127.0.0.1:8080/api/ingest/atlas-status | tee /tmp/atlas-status.json || true
          curl -sS -m 10 'http://127.0.0.1:8080/api/entities?limit=50&offset=0' | tee /tmp/entities.json || true
          curl -sS -m 10 'http://127.0.0.1:8080/api/ingest/scoreboard-snapshot?limit=50' | tee /tmp/scoreboard.json || true
      - name: Live autonomy and provenance audit
        if: always()
        run: node scripts/audit-live-bureau.mjs
      - name: Upload live audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-live-audit
          path: |
            /tmp/launch.json
            /tmp/atlas-status.json
            /tmp/entities.json
            /tmp/health.json
            /tmp/scoreboard.json
            /tmp/apex-api.log
          if-no-files-found: ignore
