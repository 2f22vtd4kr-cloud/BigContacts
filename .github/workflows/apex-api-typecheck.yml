name: Apex API Build

# Canonical API build and typecheck gate.
# One-run repair marker: patch remaining strict typecheck defects, then this gate is cleaned by a follow-up commit.
on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/build.mjs"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/tsconfig.json"
      - "scripts/apply-*.mjs"
      - "scripts/check-*.mjs"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/apex-api-typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/build.mjs"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/tsconfig.json"
      - "scripts/apply-*.mjs"
      - "scripts/check-*.mjs"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/apex-api-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply one-run source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts")
          text = p.read_text()
          old = 'findings: [...discovery.findings, ...nextDiscovery.findings], modelFindings: [...discovery.modelFindings, ...nextDiscovery.modelFindings]'
          new = 'findings: [...(discovery.findings ?? []), ...(nextDiscovery.findings ?? [])], modelFindings: [...(discovery.modelFindings ?? []), ...(nextDiscovery.modelFindings ?? [])]'
          if text.count(old) != 1: raise SystemExit(f"canonical match={text.count(old)}")
          p.write_text(text.replace(old, new))

          p = Path("artifacts/api-server/src/src/test/api-auth.test.ts")
          text = p.read_text()
          old = '  const response = {} as TestResponse;\n  response.statusCode = 200;\n  response.jsonBody = undefined;\n  response.status = ((code: number): TestResponse => { response.statusCode = code; return response; }) as unknown as Response["status"];\n  response.json = ((body: unknown): TestResponse => { response.jsonBody = body; return response; }) as unknown as Response["json"];\n'
          new = '  const response = {\n    statusCode: 200,\n    jsonBody: undefined as unknown,\n    status(code: number) { this.statusCode = code; return this; },\n    json(body: unknown) { this.jsonBody = body; return this; },\n  } as unknown as TestResponse;\n'
          if text.count(old) != 1: raise SystemExit(f"auth helper match={text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/test/api-auth.test.ts
          git commit -m "fix: finish strict typecheck source repairs"
          git push origin HEAD:main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pnpm@9.15.9
      - name: Install exactly the committed dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Run complete Apex/Bureau static audit suite
        run: pnpm run check:bureau
      - name: Check production boot safety
        run: node scripts/check-production-boot-safety.mjs
      - name: Check API authentication boundary
        run: node scripts/check-api-auth-boundary.mjs
      - name: Check workflow action pinning
        run: node scripts/check-workflow-action-pins.mjs
      - name: Check search route bounds
        run: node scripts/check-search-route-bounds.mjs
      - name: Check dev-persona boundary
        run: node scripts/check-dev-persona-boundary.mjs
      - name: Check provider gate resource bounds
        run: node scripts/check-provider-gate-resource-bounds.mjs
      - name: Check semantic cache bounds
        run: node scripts/check-semantic-cache-bounds.mjs
      - name: Check search index bounds
        run: node scripts/check-search-index-bounds.mjs
      - name: Check agentic concurrency admission
        run: node scripts/check-agentic-concurrency-admission.mjs
      - name: Check research event payload boundary
        run: node scripts/check-research-event-payload-boundary.mjs
      - name: Check research event lifecycle bounds
        run: node scripts/check-case-event-retention-bounds.mjs
      - name: Check canonical job lock lease
        run: node scripts/check-canonical-job-lock-lease.mjs
      - name: Check atomic active-job release
        run: node scripts/check-active-job-release-atomicity.mjs
      - name: Check job-state Redis fail-closed semantics
        run: node scripts/check-job-state-redis-fail-closed.mjs
      - name: Check durable case-job and promotion fences
        run: node scripts/check-durable-case-job-fence.mjs
      - name: Check canonical discovery case binding
        run: node scripts/check-canonical-discovery-case-binding.mjs
      - name: Check deterministic research strategy
        run: node scripts/check-deterministic-research-strategy.mjs
      - name: Check canonical Atlas cancellation fence
        run: node scripts/check-canonical-atlas-cancellation-fence.mjs
      - name: Check research event identity and replay semantics
        run: node scripts/check-research-event-identity.mjs
      - name: Check canonical target per-act control
        run: node scripts/check-canonical-target-per-act-control.mjs
      - name: Check discovery context control
        run: node scripts/check-discovery-context-control.mjs
      - name: Check Atlas launch input normalization
        run: node scripts/check-atlas-launch-input-normalization.mjs
      - name: Check canonical agentic source parity
        run: node scripts/check-agentic-source-parity.mjs
      - name: Check Apex launch gate
        run: node scripts/check-apex-launch-gate.mjs
      - name: Check research ledger immutability
        run: node scripts/check-research-ledger-immutability.mjs
      - name: Build API
        run: pnpm --dir artifacts/api-server run build
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Run strict provenance and provider-cache regression tests
        run: pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts src/src/test/provider-gate-cache-bounds.test.ts
