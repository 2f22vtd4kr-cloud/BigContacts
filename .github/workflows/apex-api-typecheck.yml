name: Apex API Build

# Canonical API build and typecheck gate.
on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/build.mjs"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/tsconfig.json"
      - "scripts/apply-*.mjs"
      - "scripts/check-*.mjs"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/apex-api-typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/build.mjs"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/tsconfig.json"
      - "scripts/apply-*.mjs"
      - "scripts/check-*.mjs"
      - "lib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/apex-api-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pnpm@9
      - name: Install full workspace for the full typecheck gate
        run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Check source-migration hardener parity
        run: node scripts/check-source-migration-hardener-parity.mjs
      - name: Check provider gate resource bounds
        run: node scripts/check-provider-gate-resource-bounds.mjs
      - name: Check semantic cache bounds
        run: node scripts/check-semantic-cache-bounds.mjs
      - name: Check agentic concurrency admission
        run: node scripts/check-agentic-concurrency-admission.mjs
      - name: Check research event payload boundary
        run: node scripts/check-research-event-payload-boundary.mjs
      - name: Check research event lifecycle bounds
        run: node scripts/check-case-event-retention-bounds.mjs
      - name: Check canonical job lock lease
        run: node scripts/check-canonical-job-lock-lease.mjs
      - name: Check atomic active-job release
        run: node scripts/check-active-job-release-atomicity.mjs
      - name: Check job-state Redis fail-closed semantics
        run: node scripts/check-job-state-redis-fail-closed.mjs
      - name: Check durable case-job and promotion fences
        run: node scripts/check-durable-case-job-fence.mjs
      - name: Check canonical discovery case binding
        run: node scripts/check-canonical-discovery-case-binding.mjs
      - name: Check deterministic research strategy
        run: node scripts/check-deterministic-research-strategy.mjs
      - name: Check canonical Atlas cancellation fence
        run: node scripts/check-canonical-atlas-cancellation-fence.mjs
      - name: Check research event identity and replay semantics
        run: node scripts/check-research-event-identity.mjs
      - name: Check canonical target per-act control
        run: node scripts/check-canonical-target-per-act-control.mjs
      - name: Check discovery context control
        run: node scripts/check-discovery-context-control.mjs
      - name: Check Atlas launch input normalization
        run: node scripts/check-atlas-launch-input-normalization.mjs
      - name: Check canonical agentic source parity
        run: node scripts/check-agentic-source-parity.mjs
      - name: Check Apex launch gate
        run: node scripts/check-apex-launch-gate.mjs
      - name: Check research ledger immutability
        run: node scripts/check-research-ledger-immutability.mjs
      - name: Build API
        run: pnpm --dir artifacts/api-server run build
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Run strict provenance tests
        run: pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts
