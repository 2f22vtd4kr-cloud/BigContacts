# Temporary audit repair; remove after repair.
name: One-time round11 source repair
on:
  push:
    branches: [audit/deep-round11]
    paths:
      - '.github/workflows/one-time-round11-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fabricated Reactor fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/apex-finder/src/pages/reactor.tsx')
          s=p.read_text()
          s=s.replace('return { kind: "log", resultSummary: "Working on this person", timestamp, raw: text };','return { kind: "log", timestamp, raw: text };')
          s=s.replace('resultSummary: cleaned.length > 8 && cleaned.length < 160 ? cleaned : "Working on this person",','...(cleaned.length > 8 && cleaned.length < 160 ? { resultSummary: cleaned } : {}),')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/apex-finder/src/pages/reactor.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(reactor): remove fabricated live-state fallback'
          git push
