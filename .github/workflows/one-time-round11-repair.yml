# Temporary audit repair; remove after repair.
# Triggered on the next workflow-file update.
name: One-time round11 source repair
on:
  push:
    branches: [audit/deep-round11]
    paths:
      - '.github/workflows/one-time-round11-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reactor=Path('artifacts/apex-finder/src/pages/reactor.tsx')
          s=reactor.read_text()
          s=s.replace('return { kind: "log", resultSummary: "Working on this person", timestamp, raw: text };','return { kind: "log", timestamp, raw: text };')
          s=s.replace('resultSummary: cleaned.length > 8 && cleaned.length < 160 ? cleaned : "Working on this person",','...(cleaned.length > 8 && cleaned.length < 160 ? { resultSummary: cleaned } : {}),')
          reactor.write_text(s)

          p=Path('artifacts/api-server/src/src/routes/entities.ts')
          s=p.read_text()
          start='  await Promise.all([\n    // Reassign assets owned by target → primary'; end='  await db.delete(entitiesTable).where(eq(entitiesTable.id, targetId));'
          i=s.find(start); j=s.find(end,i)
          if i<0 or j<0: raise SystemExit('entity merge mutation block not found')
          old=s[i:j+len(end)]
          new=old.replace('  await Promise.all([','  await db.transaction(async (tx) => {\n    await Promise.all([',1)
          new=new.replace('    db.update(assetsTable)','      tx.update(assetsTable)',1).replace('    db.update(relationshipsTable)','      tx.update(relationshipsTable)',1).replace('    db.update(relationshipsTable)','      tx.update(relationshipsTable)',1).replace('    db.update(entitiesTable)','      tx.update(entitiesTable)',1)
          new=new.replace('  ]);\n\n  // Delete target entity','    ]);\n\n    // Delete target entity',1).replace('  await db.delete(entitiesTable).where(eq(entitiesTable.id, targetId));','    await tx.delete(entitiesTable).where(eq(entitiesTable.id, targetId));\n  });',1)
          p.write_text(s[:i]+new+s[j+len(end):])

          p=Path('artifacts/api-server/src/src/lib/bureau-contact-persist-strict.ts')
          s=p.read_text(); old='where(and(eq(entitiesTable.id,entityId),or(isNull(fieldColumn),eq(fieldColumn,""))));'
          new='where(and(eq(entitiesTable.id,entityId),or(isNull(fieldColumn),eq(fieldColumn,"")),sql`EXISTS (SELECT 1 FROM research_cases rc WHERE rc.id = ${provenance.caseId} AND rc.status = \'active\' AND (rc.case_file::jsonb ->> \'atlasJobId\') = ${provenance.runId})`));'
          if old not in s: raise SystemExit('promotion update guard not found')
          p.write_text(s.replace(old,new,1))

          p=Path('artifacts/api-server/src/src/routes/research/canonical-target-continuation.ts')
          s=p.read_text()
          old='const [locked] = await tx.select({ caseFile: researchCasesTable.caseFile, caseType: researchCasesTable.caseType, targetEntityId: researchCasesTable.targetEntityId }).from(researchCasesTable).where(eq(researchCasesTable.id, caseId)).for("update").limit(1);'
          new='const [locked] = await tx.select({ caseFile: researchCasesTable.caseFile, caseType: researchCasesTable.caseType, targetEntityId: researchCasesTable.targetEntityId, status: researchCasesTable.status, currentAction: researchCasesTable.currentAction }).from(researchCasesTable).where(eq(researchCasesTable.id, caseId)).for("update").limit(1);'
          if old not in s: raise SystemExit('target continuation lock select not found')
          s=s.replace(old,new,1)
          marker='if (!locked || locked.caseType !== "target" || locked.targetEntityId !== current.targetEntityId) throw new Error("Target continuation case binding changed before authorization projection.");'
          replacement='if (!locked || locked.caseType !== "target" || locked.targetEntityId !== current.targetEntityId) throw new Error("Target continuation case binding changed before authorization projection.");\n      if (locked.status === "cancelled" || (locked.status === "review" && ["canonical-atlas-cancelled", "canonical-lease-lost"].includes(String(locked.currentAction ?? "")))) throw new Error("Target continuation case is durably cancelled and cannot be resumed.");'
          if marker not in s: raise SystemExit('target continuation cancellation marker not found')
          p.write_text(s.replace(marker,replacement,1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/apex-finder/src/pages/reactor.tsx artifacts/api-server/src/src/routes/entities.ts artifacts/api-server/src/src/lib/bureau-contact-persist-strict.ts artifacts/api-server/src/src/routes/research/canonical-target-continuation.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(audit): fence cancellation races and atomic merge'
          git push
