name: Single Discovery Test

on:
  workflow_dispatch:
    inputs:
      objective:
        description: Discovery objective
        required: false
        default: "Jamison Industries Inc, Taylor MI — recover public contact surface: org email, phone, address, website, related officers. Fail-closed; every contact needs sourceUrls."
      expect_email_domain:
        description: Expected org email domain (bonus / vs Grok)
        required: false
        default: "jamisonind.com"
      motivation:
        description: Motivation string
        required: false
        default: "Holdout vs Grok Agent baseline (info@jamisonind.com)"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PNPM_NETWORK_TIMEOUT: "600000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Force public npm registry
        run: |
          printf 'registry=https://registry.npmjs.org/\nalways-auth=false\n' > .npmrc
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set fetch-timeout 600000
          pnpm config set network-timeout 600000

      - name: Install deps
        env:
          CI: "false"
        run: |
          pnpm install --no-frozen-lockfile --filter @workspace/db --filter @workspace/api-server --filter @workspace/api-zod --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Install esbuild binary
        run: |
          ESBUILD=$(find node_modules -path '*/esbuild/install.js' | head -1)
          node "$ESBUILD" || true

      - name: Setup Postgres and Redis
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start || true
          sudo service redis-server start || true
          redis-server --daemonize yes || true
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true

      - name: Schema and build
        env:
          DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts
          cd ../../artifacts/api-server && node ./build.mjs

      - name: Run single discovery test
        env:
          DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
          REDIS_URL: redis://127.0.0.1:6379
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_1: ${{ secrets.EXA_API_KEY_1 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WHOXY_API_KEY: ${{ secrets.WHOXY_API_KEY }}
          APEX_ROOT: ${{ github.workspace }}
          BROWSER_FETCH_MAX_PER_CASE: "8"
          PORT: "8080"
          ENABLE_AUTO_PIPELINE: "false"
          NODE_ENV: "development"
          OVERNIGHT_POLL_MAX: "48"
          OVERNIGHT_POLL_SLEEP_S: "10"
          TEST_OBJECTIVE: ${{ github.event.inputs.objective }}
          TEST_EXPECT_EMAIL_DOMAIN: ${{ github.event.inputs.expect_email_domain }}
          TEST_MOTIVATION: ${{ github.event.inputs.motivation }}
          TEST_OUT: /tmp/apex-single-discovery-result.json
        run: |
          redis-cli ping || redis-server --daemonize yes || true
          node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            sleep 1
            code=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || echo 000)
            [ "$code" != "000" ] && [ -n "$code" ] && break
          done
          head -30 /tmp/api.log || true
          node scripts/run-single-discovery-test.mjs

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-discovery-result
          path: |
            /tmp/apex-single-discovery-result.json
            /tmp/apex-single-case.json
            /tmp/api.log
          if-no-files-found: ignore
