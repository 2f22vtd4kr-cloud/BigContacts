name: one-time retire deterministic target research (PR 73)
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Retire deterministic MCTS paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/api-server/src/src/lib/atlas-orchestrator.ts')
          s = p.read_text()
          old_import = 'import { runTargetResearch } from "./target-research";\n'
          if old_import not in s:
              raise SystemExit('expected target-research import was not found')
          s = s.replace(old_import, '', 1)

          single = re.compile(
              r'  const skipMcts = digAlreadyReady \|\| process\.env\.APEX_SKIP_MCTS_AFTER_DIG === "1";\n\n'
              r'  if \(opts\.runResearch !== false && !skipMcts\) \{.*?\n  \} else \{\n'
              r'    summary\["Target research"\] = "Skipped \(runResearch=false\)";\n  \}\n\n'
              r'  const \[hotRow, totalRow, contactRow\] = await Promise\.all\(\[',
              re.S,
          )
          single_replacement = '''  // Deterministic MCTS/UCT target research is retired. Target-scoped research judgment
  // belongs to the selected Investigator/oversight loop; this layer only owns lifecycle
  // and integrity bookkeeping.
  summary["Target research"] = opts.runResearch === false
    ? "Skipped (runResearch=false)"
    : "Model-selected target research handled by the Investigator loop.";

  const [hotRow, totalRow, contactRow] = await Promise.all(['''
          s, n = single.subn(single_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected one single-target MCTS block, found {n}')

          phase10 = re.compile(
              r'  // ── Phase 10: MCTS Research on hot leads ───────────────────────────────────\n'
              r'.*?\n  // ── Final count ────────────────────────────────────────────────────────────',
              re.S,
          )
          phase10_replacement = '''  // ── Phase 10: deterministic MCTS retired ───────────────────────────────────
  // Research strategy is model-owned. The Investigator loop performs target-scoped
  // research and reports its real actions; Atlas does not select a fixed research path.
  summary["Phase 10"] = opts.runResearch === false
    ? "Skipped (runResearch=false)"
    : "No deterministic MCTS pass; model-selected Investigator research runs within target journeys.";

  // ── Final count ────────────────────────────────────────────────────────────'''
          s, n = phase10.subn(phase10_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected one Phase 10 MCTS block, found {n}')

          if 'runTargetResearch' in s or 'APEX_SKIP_MCTS_AFTER_DIG' in s or 'UCT / MCTS RESEARCH' in s or 'toolIds: ["graph", "mcts", "prac", "evidence-review"]' in s:
              raise SystemExit('MCTS residue remains in atlas-orchestrator.ts')
          p.write_text(s)
          PY
          git diff --check
          ! grep -n 'runTargetResearch\|APEX_SKIP_MCTS_AFTER_DIG\|UCT / MCTS RESEARCH\|UCT RESEARCH' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          grep -n 'Model-selected target research handled by the Investigator loop\|deterministic MCTS retired' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          git diff --stat
      - name: Commit source change and remove branch runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          git commit -m 'fix: retire deterministic target research from Atlas'
          git rm .github/workflows/apex-one-time-retire-target-research.yml tmp/apex-target-research-runner-trigger.txt || true
          git commit -m 'chore: remove branch target research runner' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
