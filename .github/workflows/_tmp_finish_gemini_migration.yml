name: _tmp_finish_gemini_migration
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, 'finish Gemini Right-hand source cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Apply exact source and workflow cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          p = root / 'artifacts/api-server/src/src/lib/case-bureau.ts'
          s = p.read_text()
          old = '''export {\n  getDeepSeekCaseReasoningStatus,\n  runDeepSeekCaseReasoning,\n  runDeepSeekDiscoveryAdvice,\n  runDeepSeekFreeJson,\n  runDeepSeekFinalReview,\n  DEEPSEEK_CASE_REASONING_MODEL,\n} from "./deepseek-case-reasoning";\nexport type {\n  DeepSeekCaseReasoningResult,\n  DeepSeekCaseReasoningStatus,\n  DeepSeekDiscoveryAdviceResult,\n} from "./deepseek-case-reasoning";\n'''
          new = '''export {\n  getGeminiRightHandStatus,\n  runGeminiRightHandCaseReasoning,\n  runGeminiRightHandDiscoveryAdvice,\n  runGeminiRightHandFreeJson,\n  runGeminiRightHandFinalReview,\n  GEMINI_RIGHT_HAND_MODEL,\n} from "./gemini-right-hand-reasoning";\nexport type {\n  GeminiRightHandCaseReasoningResult,\n  GeminiRightHandStatus,\n  GeminiRightHandDiscoveryAdviceResult,\n} from "./gemini-right-hand-reasoning";\n'''
          if old not in s: raise SystemExit('case-bureau DeepSeek export block not found')
          s = s.replace(old, new, 1)
          s = s.replace('provider: "deepseek";', 'provider: "gemini";')
          s = s.replace('lane: "deepseek-right-hand"', 'lane: "gemini-right-hand"')
          s = s.replace('DeepSeek-V4-Flash-0731 right-hand', 'Gemini 3.8 Flash right-hand')
          if 'deepseek' in s.lower(): raise SystemExit('case-bureau still contains DeepSeek after cleanup')
          p.write_text(s)

          for rel in ['.github/workflows/apex-live-audit.yml', '.github/workflows/apex-single-target-audit.yml']:
              p = root / rel
              s = p.read_text()
              lines = s.splitlines()
              out = []
              skip_probe = False
              for line in lines:
                  if 'DEEPSEEK_API_KEY:' in line or 'DEEPSEEK_MODEL:' in line:
                      continue
                  if "integrate.api.nvidia.com" in line or "deepseek-ai/deepseek" in line or "nvidia-right-hand" in line or "deepseek-right-hand" in line:
                      continue
                  out.append(line)
              s = '\n'.join(out) + ('\n' if s.endswith('\n') else '')
              # Require an explicit Gemini Right-hand generation preflight in the single-target audit.
              if rel.endswith('apex-single-target-audit.yml'):
                  needle = "const keys=[process.env.GEMINI_API_KEY,...Array.from({length:13},(_,i)=>process.env[`GEMINI_API_KEY_${i+1}`])].filter(Boolean); let boss=false;"
                  if needle in s and 'let rightHand=false;' not in s:
                      s = s.replace(needle, needle + " let rightHand=false;", 1)
                      marker = "          console.log(JSON.stringify({digReady:dig,rightHandReady:rh,bossReady:boss}));"
                      # The old rh field was removed with the NVIDIA line; replace the summary/guard with a Gemini 3.8 check.
                      old_guard = "          console.log(JSON.stringify({digReady:dig,rightHandReady:rh,bossReady:boss})); if(!dig || !boss) process.exit(2);"
                      if old_guard in s:
                          pass
                      else:
                          # Insert the explicit right-hand probe immediately before the summary line.
                          summary = "          console.log(JSON.stringify({digReady:dig,bossReady:boss})); if(!dig || !boss) process.exit(2);"
                          probe = "          if(boss){try{const key=keys[0]; const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply READY only.'}]}],generationConfig:{maxOutputTokens:8}}),signal:AbortSignal.timeout(15000)});await r.text();rightHand=r.ok;}catch{rightHand=false}}\n"
                          if summary in s:
                              s = s.replace(summary, probe + "          console.log(JSON.stringify({digReady:dig,rightHandReady:rightHand,bossReady:boss})); if(!dig || !boss || !rightHand) process.exit(2);", 1)
                  # The workflow must not mention obsolete providers at all.
              p.write_text(s)

          # Remove the mutating migration step from the canonical five-green workflow and make the audit read-only.
          p = root / '.github/workflows/audit-five-greens.yml'
          s = p.read_text()
          start = s.find("      - name: Apply Gemini Right-hand migration before audit\n")
          if start >= 0:
              end = s.find("      - uses: actions/setup-node@", start)
              if end < 0: raise SystemExit('five-green migration step end not found')
              s = s[:start] + s[end:]
          s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          p.write_text(s)

          # Architecture checker gets a direct source-level Right-hand contract assertion.
          p = root / 'scripts/check-unified-investigator-architecture.mjs'
          s = p.read_text()
          s = s.replace('  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),', '  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),\n  rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),', 1)
          anchor = 'assert(/investigatorLlm/.test(source.research), "ReAct research runtime does not receive investigatorLlm.");'
          addition = '''assert(/GEMINI_RIGHT_HAND_MODEL\\s*=\\s*["']gemini-3\\.8-flash["']/.test(source.rightHand), "Gemini Right-hand is not pinned to the requested Gemini 3.8 Flash model.");\nassert(/GEMINI_API_KEY/.test(source.rightHand) && !/DEEPSEEK|NVIDIA|integrate\\.api\\.nvidia/i.test(source.rightHand), "Gemini Right-hand source still references the retired DeepSeek/NVIDIA provider path.");\nassert(/case file|case-file/i.test(source.rightHand) && /Never browse|Never.*browse/i.test(source.rightHand), "Gemini Right-hand does not declare case-file-only, no-browse reasoning.");\nassert(/actionId/.test(source.rightHand) && /queued/.test(source.rightHand), "Gemini Right-hand does not preserve the queued-action contract.");\n'''
          if anchor not in s: raise SystemExit('architecture checker anchor not found')
          s = s.replace(anchor, anchor + '\n' + addition, 1)
          p.write_text(s)

          # Architecture documentation must explicitly identify the retired provider boundary.
          p = root / 'docs/BUREAU_REACT_ARCHITECTURE.md'
          s = p.read_text()
          if 'DeepSeek and NVIDIA NIM are no longer part of Apex' not in s:
              raise SystemExit('architecture doc retirement statement missing')
          p.write_text(s)

          # This workflow is one-shot; remove it before committing.
          tmp = root / '.github/workflows/_tmp_finish_gemini_migration.yml'
          tmp.unlink()
          
          # No active Apex runtime/workflow may retain retired provider references.
          scan_roots = [root/'artifacts', root/'.github/workflows', root/'scripts']
          bad = []
          allow = {'scripts/check-unified-investigator-architecture.mjs'}
          for base in scan_roots:
              for f in base.rglob('*'):
                  if not f.is_file() or f.suffix not in {'.ts','.tsx','.js','.mjs','.json','.yml','.yaml','.md'}: continue
                  if str(f.relative_to(root)) in allow: continue
                  try: t=f.read_text().lower()
                  except Exception: continue
                  if any(x in t for x in ('deepseek_api_key','api.deepseek.com','deepseek-ai/','integrate.api.nvidia.com','nvidia_nim_api_key')):
                      bad.append(str(f.relative_to(root)))
          if bad: raise SystemExit('retired DeepSeek/NVIDIA references remain in active Apex files: ' + ', '.join(bad[:30]))
          PY
          git diff --check
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finish Gemini Right-hand source cleanup'
          git push origin audit/genuine-five-green-final
