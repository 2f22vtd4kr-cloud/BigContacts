name: Temporary mobile Reactor source repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Move mobile live activity to shared telemetry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('artifacts/apex-finder/src/components/mobile-reactor-flow.tsx')
          s = p.read_text()
          if 'useReactorLiveTelemetry' not in s:
              s = s.replace('import { useBureauLiveDesk } from "../lib/use-bureau-live";\n', 'import { useBureauLiveDesk } from "../lib/use-bureau-live";\nimport { useReactorLiveTelemetry } from "../lib/reactor-live-store";\n')

          anchor = '  } = props;\n\n  // Job status + recent log heartbeat'
          if anchor not in s:
              raise SystemExit('mobile props anchor not found')
          replacement = '  } = props;\n\n  const telemetry = useReactorLiveTelemetry();\n  const telemetryRunLive = telemetry.runStatus === "running" || telemetry.runStatus === "paused";\n\n  // Job status remains available for terminal/history chrome. Live execution truth comes from shared recentSpans.\n  // Job status + recent log heartbeat'
          s = s.replace(anchor, replacement, 1) if 'const telemetry = useReactorLiveTelemetry();' not in s else s

          live_start = s.index('  const liveEvents = React.useMemo(() => {')
          live_end = s.index('\n\n  // Discrete polite announcements', live_start)
          new_block = '''  const liveEvents = React.useMemo(() => {
    if (showHistory) return filteredDeskEvents;
    if (!telemetryRunLive) return [] as typeof deskEvents;
    // Live mobile scenes use the same normalized recentSpans snapshot as desktop.
    return telemetry.activities
      .filter((activity) => activity.status === "active" || activity.status === "completed" || activity.status === "failed")
      .slice(0, 6)
      .map((activity) => ({
        timestamp: activity.startedAt,
        kind: "tool",
        stage: activity.tool || activity.operation || activity.spanType || "Research activity",
        status: activity.status === "active" ? "active" : activity.status === "failed" ? "error" : "complete",
        targetName: activity.target || atlasState?.atlasTelemetry?.targetName,
        activeToolId: activity.tool,
        toolIds: activity.tool ? [activity.tool] : [],
        inputSummary: activity.inputSummary,
        resultSummary: activity.resultSummary,
        sourceUrls: activity.sourceUrls,
        story: activity.resultSummary || activity.inputSummary || activity.tool || activity.operation || "Observed research activity",
      } as any));
  }, [showHistory, filteredDeskEvents, deskEvents, telemetry.activities, telemetryRunLive, atlasState?.atlasTelemetry?.targetName]);'''
          s = s[:live_start] + new_block + s[live_end:]

          s = s.replace('const atlasRunning =\n    Boolean(atlasState) &&\n    (atlasState!.runStatus === "running" || atlasState!.runStatus === "paused");', 'const atlasRunning = telemetryRunLive;', 1)
          s = s.replace('    atlasRunning && (recentSpanMs === 0 || recentSpanMs != null && recentSpanMs < 90_000 || recentBureauMs == null || recentBureauMs < 90_000),', '    atlasRunning,', 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --filter ./artifacts/apex-finder... --registry=https://registry.npmjs.org/
      - run: node scripts/check-frontend-responsive.mjs
      - run: node scripts/check-reactor-live-integrity.mjs
      - run: pnpm --dir artifacts/apex-finder run build
      - name: Commit verified mobile source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
          git diff --cached --quiet || git commit -m "refactor(reactor): use shared telemetry on mobile"
          git push origin HEAD:${{ github.head_ref }}
