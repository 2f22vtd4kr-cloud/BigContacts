name: One-off Provider Gate Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-provider-gate-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply provider signal compatibility fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/src/lib/provider-gate.ts")
          text = path.read_text()
          old = 'async function acquireConcurrency(provider: ExternalProvider, signal?: AbortSignal): Promise<void>'
          new = 'async function acquireConcurrency(provider: ExternalProvider, signal?: AbortSignal | null): Promise<void>'
          if text.count(old) != 1:
              raise SystemExit(f"signature match count={text.count(old)}")
          text = text.replace(old, new)
          old = 'await acquireConcurrency(provider, init?.signal ?? undefined);'
          new = 'await acquireConcurrency(provider, init?.signal);'
          if text.count(old) != 1:
              raise SystemExit(f"call match count={text.count(old)}")
          text = text.replace(old, new)
          path.write_text(text)
          Path(".github/workflows/one-off-provider-gate-fix.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/provider-gate.ts .github/workflows/one-off-provider-gate-fix.yml
          git commit -m "fix: preserve provider signal boundary contract"
          git push origin HEAD:main
