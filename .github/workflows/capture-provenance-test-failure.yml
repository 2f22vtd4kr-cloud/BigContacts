name: Capture Provenance Test Failure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-provenance-test-failure.yml"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Run strict provenance test
        id: provenance
        run: |
          set +e
          DATABASE_URL=postgres://apex_ci_placeholder:apex_ci_placeholder@127.0.0.1:5432/apex_ci \
            pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts > provenance-test.log 2>&1
          status=$?
          cat provenance-test.log
          exit $status
      - name: Publish provenance failure
        if: failure() && steps.provenance.outcome == 'failure'
        run: |
          mkdir -p ci
          cp provenance-test.log ci/provenance-test-latest.txt
          git config user.name "apex-typecheck-bot"
          git config user.email "apex-typecheck-bot@users.noreply.github.com"
          git checkout --orphan ci-provenance-diagnostics
          git rm -rf .
          git add ci/provenance-test-latest.txt
          git commit -m "ci: capture provenance test failure"
          git push --force origin HEAD:refs/heads/ci-provenance-diagnostics
