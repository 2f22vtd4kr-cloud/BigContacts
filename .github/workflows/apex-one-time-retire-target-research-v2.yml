name: one-time retire deterministic target research v2
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded retirement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/api-server/src/src/lib/atlas-orchestrator.ts')
          s = p.read_text()
          if 'runTargetResearch' not in s:
              raise SystemExit('target research call already absent; refusing ambiguous rewrite')
          s = s.replace('import { runTargetResearch } from "./target-research";\n', '', 1)
          # Remove the single-target MCTS branch, preserving the existing job-progress update.
          pattern = re.compile(r'\n    await setAtlasTelemetry\(atlasJobId, \{\n      stage: "UCT RESEARCH",.*?\n    \}\n  \} else if \(skipMcts\) \{', re.S)
          replacement = '\n    summary["Target research"] = "Model-selected target research handled by the Investigator loop.";\n  } else if (skipMcts) {'
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'single-target MCTS block not matched: {n}')
          # Retire the legacy skip switch and branch: the deterministic path is no longer optional; it is gone.
          s = re.sub(r'\n  const skipMcts = digAlreadyReady \|\| process\.env\.APEX_SKIP_MCTS_AFTER_DIG === "1";\n', '\n', s, count=1)
          s = re.sub(r'\n  \} else if \(skipMcts\) \{.*?\n  \}\n', '\n', s, count=1, flags=re.S)
          # Retire Phase 10's deterministic MCTS block up to Final count.
          p10 = re.compile(r'  // ── Phase 10:.*?\n  // ── Final count', re.S)
          s, n = p10.subn('  // ── Phase 10: model-owned target research ─────────────────────────────────\n  summary["Phase 10"] = opts.runResearch === false\n    ? "Skipped (runResearch=false)"\n    : "Model-selected Investigator research; no deterministic MCTS path.";\n\n  // ── Final count', s, count=1)
          if n != 1:
              raise SystemExit(f'Phase 10 block not matched: {n}')
          if any(x in s for x in ['runTargetResearch', 'APEX_SKIP_MCTS_AFTER_DIG', 'UCT RESEARCH', 'activeToolId: "mcts"', '"mcts", "prac", "evidence-review"']):
              raise SystemExit('MCTS residue remains after rewrite')
          p.write_text(s)
          PY
          git diff --check
          grep -n 'Model-selected target research handled by the Investigator loop\|Phase 10: model-owned target research' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          ! grep -n 'runTargetResearch\|APEX_SKIP_MCTS_AFTER_DIG\|UCT RESEARCH\|activeToolId: "mcts"' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
      - name: Commit and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          git commit -m 'fix: retire deterministic target research from Atlas'
          git rm .github/workflows/apex-one-time-retire-target-research.yml .github/workflows/apex-one-time-retire-target-research-v2.yml tmp/apex-target-research-runner-trigger.txt || true
          git commit -m 'chore: remove target research retirement runners' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
