name: apex-run-discovery-transform

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[skip apex discovery transform]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate transform script
        run: node --check scripts/apply-canonical-discovery-consolidation.mjs
      - name: Apply exact source transform
        run: node scripts/apply-canonical-discovery-consolidation.mjs
      - name: Static invariants
        run: |
          test ! -e scripts/apply-canonical-discovery-consolidation.mjs
          ! grep -q 'runGeminiBossDiscovery' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          ! grep -q 'runDeepSeekFreeJson' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          grep -q 'runCanonicalAtlasPipeline' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          grep -q 'discoveryOnly' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
          grep -q 'discoveryCaseId' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
      - name: Commit source consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          git commit -m 'Consolidate canonical discovery control plane [skip apex discovery transform]'
          git push origin HEAD:main
