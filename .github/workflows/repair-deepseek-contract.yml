name: Repair DeepSeek production contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-deepseek-contract.yml'
      - 'artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact DeepSeek production contract
        shell: bash
        run: |
          set -euo pipefail
          f="artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts"
          grep -Fq 'max_tokens: 4096' "$f"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts')
          s = p.read_text()
          old = 'max_tokens: 4096,'
          new = 'max_tokens: 16384,'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -Fq 'max_tokens: 16384' "$f"
          if grep -Fq 'max_tokens: 4096' "$f"; then
            echo 'stale DeepSeek max_tokens contract remains' >&2
            exit 1
          fi
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          git diff --cached --check
          git commit -m 'fix: enforce DeepSeek production token contract'
          git push origin HEAD:main
      - name: Remove one-shot repair workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          rm -f .github/workflows/repair-deepseek-contract.yml
          git add .github/workflows/repair-deepseek-contract.yml
          git commit -m 'chore: remove one-shot DeepSeek repair workflow'
          git push origin HEAD:main
