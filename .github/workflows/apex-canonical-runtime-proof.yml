name: Apex Canonical Runtime Proof

on:
  push:
    branches: [main]
    paths:
      - "scripts/live-batch-trigger.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-runtime:
    name: Real canonical Boss → Right-hand → Investigator run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_local_dev
          POSTGRES_DB: apex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_URL_1: redis://127.0.0.1:6379
      PORT: 8080
      NODE_ENV: development
      ENABLE_AUTO_PIPELINE: "false"
      ENABLE_REDIS_ON_BOOT: "true"
      GROQ_BOSS_API_KEY: ${{ secrets.GROQ_BOSS_API_KEY || secrets.GROQ_API_KEY }}
      GROQ_BOSS_API_KEY_1: ${{ secrets.GROQ_BOSS_API_KEY_1 || secrets.GROQ_API_KEY_1 }}
      GROQ_BOSS_API_KEY_2: ${{ secrets.GROQ_BOSS_API_KEY_2 || secrets.GROQ_API_KEY_2 }}
      GROQ_BOSS_API_KEY_3: ${{ secrets.GROQ_BOSS_API_KEY_3 || secrets.GROQ_API_KEY_3 }}
      GROQ_BOSS_API_KEY_4: ${{ secrets.GROQ_BOSS_API_KEY_4 || secrets.GROQ_API_KEY_4 }}
      GROQ_BOSS_API_KEY_5: ${{ secrets.GROQ_BOSS_API_KEY_5 || secrets.GROQ_API_KEY_5 }}
      GROQ_BOSS_API_KEY_6: ${{ secrets.GROQ_BOSS_API_KEY_6 || secrets.GROQ_API_KEY_6 }}
      GROQ_BOSS_API_KEY_7: ${{ secrets.GROQ_BOSS_API_KEY_7 || secrets.GROQ_API_KEY_7 }}
      GROQ_BOSS_API_KEY_8: ${{ secrets.GROQ_BOSS_API_KEY_8 || secrets.GROQ_API_KEY_8 }}
      GROQ_BOSS_API_KEY_9: ${{ secrets.GROQ_BOSS_API_KEY_9 || secrets.GROQ_API_KEY_9 }}
      GROQ_BOSS_API_KEY_10: ${{ secrets.GROQ_BOSS_API_KEY_10 || secrets.GROQ_API_KEY_10 }}
      GROQ_RIGHT_HAND_API_KEY: ${{ secrets.GROQ_RIGHT_HAND_API_KEY || secrets.GROQ_API_KEY }}
      GROQ_RIGHT_HAND_API_KEY_1: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_1 || secrets.GROQ_API_KEY_1 || secrets.GROQ_BOSS_API_KEY_1 }}
      GROQ_RIGHT_HAND_API_KEY_2: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_2 || secrets.GROQ_API_KEY_2 }}
      GROQ_RIGHT_HAND_API_KEY_3: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_3 || secrets.GROQ_API_KEY_3 }}
      GROQ_RIGHT_HAND_API_KEY_4: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_4 || secrets.GROQ_API_KEY_4 }}
      GROQ_RIGHT_HAND_API_KEY_5: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_5 || secrets.GROQ_API_KEY_5 }}
      GROQ_INVESTIGATOR_API_KEY: ${{ secrets.GROQ_INVESTIGATOR_API_KEY || secrets.GROQ_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_1: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_1 || secrets.GROQ_API_KEY_1 || secrets.GROQ_RIGHT_HAND_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_2: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_2 || secrets.GROQ_API_KEY_2 || secrets.GROQ_BOSS_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_3: ${{ secrets.GROQ_RIGHT_HAND_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_4: ${{ secrets.GROQ_BOSS_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_5: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_5 || secrets.GROQ_API_KEY_5 || secrets.GROQ_RIGHT_HAND_API_KEY_4 }}
      GROQ_INVESTIGATOR_API_KEY_6: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_6 || secrets.GROQ_API_KEY_6 || secrets.GROQ_BOSS_API_KEY_6 }}
      GROQ_INVESTIGATOR_API_KEY_7: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_7 || secrets.GROQ_API_KEY_7 || secrets.GROQ_BOSS_API_KEY_7 }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      WHOISJSON_API_KEY: ${{ secrets.WHOISJSON_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_DISCOVERY_BATCH_SIZE: "1"
      APEX_SKIP_SEMANTIC: "1"
      APEX_AGENTIC_CONCURRENCY: "1"
      APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=1536
      APEX_CAPTURE_MODEL_PROMPTS: "true"
      APEX_MODEL_AUDIT_FILE: "audits/APEX_ATLAS_MODEL_AUDIT_${{ github.run_id }}.md"
      APEX_MODEL_AUDIT_INCLUDE_CONTACT_DATA: "false"
      APEX_CAPTURE_MODEL_PROMPTS_IN_TEST: "false"
      APEX_MODEL_AUDIT_ALLOW_VISIBLE_FILE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Fail fast when canonical model roles are not configured
        shell: bash
        run: |
          set -euo pipefail
          require_any() {
            for name in "$@"; do
              value="$(printenv "$name" 2>/dev/null || true)"
              if [ -n "$value" ]; then return 0; fi
            done
            return 1
          }
          require_any GROQ_BOSS_API_KEY GROQ_BOSS_API_KEY_1 GROQ_BOSS_API_KEY_2 GROQ_BOSS_API_KEY_3 GROQ_BOSS_API_KEY_4 GROQ_BOSS_API_KEY_5 GROQ_BOSS_API_KEY_6 GROQ_BOSS_API_KEY_7 GROQ_BOSS_API_KEY_8 GROQ_BOSS_API_KEY_9 GROQ_BOSS_API_KEY_10 || { echo "::error::Missing GitHub Actions secret for the Groq Boss role."; exit 1; }
          require_any GROQ_RIGHT_HAND_API_KEY GROQ_RIGHT_HAND_API_KEY_1 GROQ_RIGHT_HAND_API_KEY_2 GROQ_RIGHT_HAND_API_KEY_3 GROQ_RIGHT_HAND_API_KEY_4 GROQ_RIGHT_HAND_API_KEY_5 || { echo "::error::Missing GitHub Actions secret for the Groq Right-hand role."; exit 1; }
          require_any GROQ_INVESTIGATOR_API_KEY GROQ_INVESTIGATOR_API_KEY_1 GROQ_INVESTIGATOR_API_KEY_2 GROQ_INVESTIGATOR_API_KEY_3 GROQ_INVESTIGATOR_API_KEY_4 GROQ_INVESTIGATOR_API_KEY_5 GROQ_INVESTIGATOR_API_KEY_6 GROQ_INVESTIGATOR_API_KEY_7 || { echo "::error::Missing GitHub Actions secret for the Groq Investigator role."; exit 1; }
          require_any SERPER_API_KEY TAVILY_API_KEY EXA_API_KEY EXA_1 || { echo "::error::Missing GitHub Actions search-provider credential."; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Build canonical application
        run: pnpm run build
      - name: Initialize canonical Apex schema
        env:
          APEX_ALLOW_SCHEMA_PUSH: "true"
        run: bash scripts/initialize-apex-schema.sh
      - name: Configure isolated operator authentication
        run: |
          set -euo pipefail
          API_TOKEN="$(openssl rand -hex 32)"
          OPERATOR_PASSWORD="$(openssl rand -hex 24)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$API_TOKEN"
          echo "::add-mask::$OPERATOR_PASSWORD"
          echo "::add-mask::$SESSION_SECRET"
          {
            echo "APEX_API_AUTH_TOKEN=$API_TOKEN"
            echo "APEX_OPERATOR_PASSWORD=$OPERATOR_PASSWORD"
            echo "APEX_SESSION_SECRET=$SESSION_SECRET"
          } >> "$GITHUB_ENV"
      - name: Run canonical API and one discovery-first case
        run: |
          set -euo pipefail
          unset APEX_ALLOW_SCHEMA_PUSH
          rm -f /tmp/apex-api.log /tmp/health.json /tmp/launch.json /tmp/job.json /tmp/job-final.json /tmp/active-atlas-job.json /tmp/atlas-trace.json /tmp/entities.json /tmp/dashboard-research-leads.json
          rm -f "audits/APEX_ATLAS_MODEL_AUDIT_${GITHUB_RUN_ID}.md"
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          API_PID=$!
          echo "$API_PID" > /tmp/apex-api.pid
          collect_evidence() {
            JOB_ID="$(node -p 'try{require("/tmp/launch.json").jobId||""}catch{""}')"
            if [ -n "$JOB_ID" ]; then
              curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" | tee /tmp/job-final.json || true
              curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/atlas-trace/$JOB_ID" | tee /tmp/atlas-trace.json || true
              curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/entities?limit=50&offset=0" | tee /tmp/entities.json || true
              curl -sS -m 20 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/dashboard/research-leads?limit=8" | tee /tmp/dashboard-research-leads.json || true
              # A terminal job may briefly remain under the active key while finally releases its lease.
              # Require the strict lane probe to show an actually empty key, not only active=false.
              for i in $(seq 1 15); do
                if curl -fsS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/active/atlas-run" -o /tmp/active-atlas-job.json; then
                  if node -e 'const x=require("/tmp/active-atlas-job.json"); process.exit(x?.type==="atlas-run"&&x.jobId===null&&x.job===null&&x.active===false?0:1)'; then break; fi
                fi
                sleep 1
              done
            fi
            cat /tmp/apex-api.log || true
            if kill -0 "$API_PID" 2>/dev/null; then kill "$API_PID" 2>/dev/null || true; fi
            wait "$API_PID" 2>/dev/null || true
            rm -f /tmp/apex-api.pid
          }
          trap collect_evidence EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS -m 2 http://127.0.0.1:8080/api/healthz >/tmp/health.json; then READY=1; break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/apex-api.log; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/apex-api.log; exit 1; fi
          curl -sS -m 20 -X POST http://127.0.0.1:8080/api/ingest/atlas-run \
            -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"targetCount":1,"researchDepth":"standard","targetTimeoutMs":420000,"discoveryContext":"Operator objective: identify a real casino operator/business in Slovenia. Choose the source/provider with the highest information gain; ordinary web search is a sensible option. Companies House is not relevant unless evidence points to a UK entity. A company name explicitly present in a successful search result and its real result URL is enough for a low-confidence review-only Corporation card. Do not infer ownership, wealth, relationships, or private contact details."}' | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json");if(!x.jobId)process.exit(1);console.log("job",x.jobId)'
          JOB_ID="$(node -p 'require("/tmp/launch.json").jobId')"
          for i in $(seq 1 300); do
            sleep 5
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" > /tmp/job.json || true
            STATUS="$(node -p 'try{require("/tmp/job.json").status||require("/tmp/job.json").job?.status||""}catch{""}')"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then
              echo "Terminal job status=$STATUS; source-backed card acceptance is evaluated in the next step."
              cat /tmp/job.json
              exit 0
            fi
            if [ "$STATUS" = "cancelled" ]; then cat /tmp/job.json; exit 2; fi
          done
          cat /tmp/job.json
          exit 1
      - name: Require a persisted source-backed candidate card in both API projections
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const job = readJson("/tmp/job-final.json");
          const entitiesPayload = readJson("/tmp/entities.json");
          const dashboard = readJson("/tmp/dashboard-research-leads.json");
          const activeAtlasLane = readJson("/tmp/active-atlas-job.json");
          if (activeAtlasLane?.type !== "atlas-run" || activeAtlasLane?.active !== false ||
              activeAtlasLane?.jobId !== null || activeAtlasLane?.job !== null) {
            throw new Error(
              "Canonical job terminalized but active Atlas lock was not proven released: " +
              JSON.stringify({ type: activeAtlasLane?.type, jobId: activeAtlasLane?.jobId,
                active: activeAtlasLane?.active, jobStatus: activeAtlasLane?.job?.status ?? null })
            );
          }
          const entities = Array.isArray(entitiesPayload) ? entitiesPayload
            : Array.isArray(entitiesPayload?.entities) ? entitiesPayload.entities : [];
          const leads = Array.isArray(dashboard?.leads) ? dashboard.leads : [];
          const jobStatus = String(job.status ?? "");
          if (!["done", "completed", "failed"].includes(jobStatus)) {
            throw new Error("Canonical job is not terminal (done/completed/failed): " + (jobStatus || "missing"));
          }
          const sourceBackedReviewLeads = leads.filter((lead) =>
            lead?.stage === "partial_review" &&
            lead?.entityType === "Corporation" &&
            Number.isSafeInteger(Number(lead.entityId)) &&
            Array.isArray(lead.sourceUrls) &&
            lead.sourceUrls.some((url) => typeof url === "string" && /^https:\/\//i.test(url))
          );
          const accepted = sourceBackedReviewLeads.find((lead) => entities.some((entity) =>
            String(entity?.id) === String(lead.entityId) &&
            entity?.name === lead.entityName &&
            entity?.type === "Corporation" &&
            lead?.entityType === "Corporation" &&
            lead?.stage === "partial_review"
          ));
          if (!accepted) {
            throw new Error(
              "No source-backed partial_review Corporation card was found in /api/dashboard/research-leads " +
              "and matched to the same Corporation in /api/entities. " +
              "entities=" + entities.length + ", dashboardLeads=" + leads.length +
              ", sourceBackedReviewLeads=" + sourceBackedReviewLeads.length +
              ", terminalJobStatus=" + jobStatus
            );
          }
          console.log(JSON.stringify({
            acceptance: "PASS",
            jobId: job.jobId,
            terminalJobStatus: jobStatus,
            entityId: accepted.entityId,
            entityName: accepted.entityName,
            entityType: accepted.entityType,
            stage: accepted.stage,
            sourceUrls: accepted.sourceUrls,
            verificationLevel: accepted.verificationLevel ?? "see entity metadata",
            entityProjection: "matched",
            dashboardProjection: "matched",
            activeAtlasLock: "released",
            acceptedAfterControlFailure: jobStatus === "failed",
          }, null, 2));
          NODE
      - name: Preserve canonical runtime evidence
        if: always()
        run: |
          # The API step captures final state before shutting down the server.
          if [ ! -s /tmp/job-final.json ] && [ -s /tmp/job.json ]; then cp /tmp/job.json /tmp/job-final.json; fi
      - name: Upload canonical runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-canonical-runtime-proof
          path: |
            /tmp/launch.json
            /tmp/job.json
            /tmp/job-final.json
            /tmp/active-atlas-job.json
            /tmp/atlas-trace.json
            /tmp/entities.json
            /tmp/dashboard-research-leads.json
            /tmp/health.json
            /tmp/apex-api.log
            audits/APEX_ATLAS_MODEL_AUDIT_*.md
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Stop canonical API
        if: always()
        run: |
          if [ -f /tmp/apex-api.pid ]; then kill "$(cat /tmp/apex-api.pid)" 2>/dev/null || true; fi
