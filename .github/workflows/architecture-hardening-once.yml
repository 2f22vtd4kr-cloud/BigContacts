name: One-time architecture hardening
on:
  push:
    branches: [apex/architecture-hardening-2026-09-08]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted architecture hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/architecture-hardening-once.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/ai-extractor.ts artifacts/api-server/src/src/lib/bureau-contact-persist.ts artifacts/api-server/src/src/routes/entities.ts artifacts/api-server/src/src/routes/research/cases.ts artifacts/api-server/src/src/lib/atlas-orchestrator.ts scripts/check-canonical-promotion-boundary.mjs
          if git diff --cached --quiet; then echo "No source changes"; exit 0; fi
          git commit -m "fix: close legacy evidence-to-card and provider-role bypasses"
          git push
