name: apply-p0-incremental-admit
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-p0-incremental-admit.mjs"
      - ".github/workflows/apply-p0-incremental-admit.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P0 patches
        run: |
          set -euo pipefail
          node scripts/apply-p0-incremental-admit.mjs
          grep -q 'onCandidate' artifacts/api-server/src/src/lib/discovery-agent.ts
          grep -q 'onCandidate: async' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          grep -q 'APEX_DISCOVERY_DEFAULT_BATCH' artifacts/api-server/src/src/lib/discovery-agent.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/discovery-agent.ts artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          if git diff --cached --quiet; then echo no-source-changes; else
            git commit -m "fix(discovery): incremental admit, batch default 3, softer person scope gate"
            git push
          fi
