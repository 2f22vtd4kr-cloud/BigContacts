name: apply mobile Reactor telemetry source

on:
  push:
    branches: [apex/mobile-reactor-telemetry-source]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile live source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/apex-finder/src/components/mobile-reactor-flow.tsx')
          s = p.read_text()
          imp = 'import { useReactorLiveTelemetry } from "../lib/reactor-live-store";'
          if imp not in s:
              anchor = 'import { useBureauLiveDesk } from "../lib/use-bureau-live";'
              if anchor not in s:
                  raise SystemExit('mobile import anchor missing')
              s = s.replace(anchor, anchor + '\n' + imp, 1)
          start = s.index('  // Job status + recent log heartbeat')
          end = s.index('  const [showHistory, setShowHistory] = React.useState(false);', start)
          s = s[:start] + '  const { runStatus: telemetryRunStatus, activities: telemetryActivities } = useReactorLiveTelemetry();\n  const isLive = telemetryRunStatus === "running" || telemetryRunStatus === "paused";\n' + s[end:]
          start = s.index('  // Live desk: current target only; drop stale "done" windows; inject telemetry when bureau tail is old')
          end = s.index('  // Discrete polite announcements:', start)
          replacement = '''  // Live desk is telemetry-authoritative. Historical bureau narration remains an archive only.\n  const liveEvents = React.useMemo(() => {\n    if (showHistory) return filteredDeskEvents;\n    if (!isLive) return [] as typeof deskEvents;\n    return telemetryActivities\n      .map((activity) => ({\n        timestamp: activity.startedAt || activity.endedAt,\n        kind: "telemetry",\n        stage: activity.operation || activity.tool || activity.spanType || "research",\n        status: activity.status === "active" ? "active" : activity.status === "failed" ? "error" : "complete",\n        targetName: activity.target,\n        activeToolId: activity.tool,\n        toolIds: activity.tool ? [activity.tool] : [],\n        inputSummary: activity.inputSummary,\n        resultSummary: activity.resultSummary,\n        story: activity.resultSummary || activity.inputSummary,\n        sourceUrls: activity.sourceUrls,\n      }))\n      .filter((event) => Boolean(event.story || event.inputSummary || event.resultSummary));\n  }, [showHistory, filteredDeskEvents, deskEvents, telemetryActivities, isLive]);\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          git diff --check
          git diff -- artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
          git rm .github/workflows/apply-mobile-reactor-telemetry-source.yml
          git commit -m 'fix: make mobile Reactor telemetry authoritative'
          git push