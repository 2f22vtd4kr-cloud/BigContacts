name: apex-consolidate-discovery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[skip apex discovery consolidation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Consolidate discovery control plane
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          atlas_path = root / 'artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts'
          atlas = atlas_path.read_text()

          old_options = 'export type CanonicalAtlasOptions = { targetCount?: number; researchDepth?: "fast" | "standard" | "deep"; targetTimeoutMs?: number };'
          new_options = '''export type CanonicalAtlasOptions = {
            targetCount?: number;
            researchDepth?: "fast" | "standard" | "deep";
            targetTimeoutMs?: number;
            discoveryCaseId?: number;
            discoveryOnly?: boolean;
            objective?: string;
            motivation?: string;
            geography?: string;
            exclusions?: string[];
            lockKey?: "atlas-run" | "case-bureau-discovery";
          };'''
          if atlas.count(old_options) != 1:
              raise SystemExit('CanonicalAtlasOptions anchor changed; refusing ambiguous mutation')
          atlas = atlas.replace(old_options, new_options, 1)

          import_line = 'import { persistSourceBackedBureauContactsForEntity } from "./bureau-contact-persist-strict";\n'
          if atlas.count(import_line) != 1:
              raise SystemExit('strict contact persistence import anchor changed')
          atlas = atlas.replace(import_line, '', 1)

          start = atlas.index('async function materializeAtlasAdmissions(')
          end = atlas.index('\n\nexport async function runCanonicalAtlasPipeline', start)
          new_materialize = '''async function materializeAtlasAdmissions(input: {
            findings: Array<{
              promotionDecision?: "promote" | "reject";
              scope: "organization" | "candidate" | "unknown";
              personName: string | null;
              role: string | null;
              sourceUrls: string[];
            }>;
            atlasJobId: string;
            discoveryCaseId: number;
            maxCandidates: number;
          }): Promise<{ names: string[]; materialized: number; evidenceRows: number }> {
            const admitted = uniqueNames(
              input.findings
                .filter((f) => f.promotionDecision === "promote")
                .filter((f) => f.scope === "candidate")
                .filter((f) => typeof f.personName === "string" && f.personName.trim().length >= 3)
                .filter((f) => Array.isArray(f.sourceUrls) && f.sourceUrls.some(isObservedHttpSource))
                .map((f) => f.personName as string),
            );
            if (admitted.length > input.maxCandidates) {
              throw new Error(`Discovery admission safety cap exceeded (${admitted.length} > ${input.maxCandidates}); refusing to deterministically select candidates.`);
            }
            let materialized = 0;
            for (const name of admitted) {
              const finding = input.findings.find(
                (candidate) => candidate.personName?.trim().toLowerCase() === name.toLowerCase()
                  && candidate.promotionDecision === "promote"
                  && candidate.scope === "candidate"
                  && Array.isArray(candidate.sourceUrls)
                  && candidate.sourceUrls.some(isObservedHttpSource),
              );
              const sourceUrl = finding?.sourceUrls?.find(isObservedHttpSource) ?? null;
              if (!sourceUrl) continue;
              const existingRows = await db
                .select({ id: entitiesTable.id })
                .from(entitiesTable)
                .where(and(eq(entitiesTable.name, name), inArray(entitiesTable.type, ["HNWI", "Gatekeeper"])))
                .limit(1);
              const existing = existingRows[0];
              let entityId = existing?.id ?? null;
              if (!entityId) {
                const [created] = await db.insert(entitiesTable).values({
                  name,
                  type: "HNWI",
                  bayesianScore: 0.05,
                  contactConfidence: 0,
                  contactOutcome: "evidence_only",
                  isHot: false,
                  isStarred: false,
                  isHidden: false,
                  sourceRegistries: JSON.stringify(["canonical-agentic-discovery"]),
                  notes: "Model-selected discovery candidate; target-scoped Investigator research required before contact promotion.",
                  metadata: JSON.stringify({ reviewOnly: true, admission: "investigator-explicit-promotion", sourceUrl, discoveryCaseId: input.discoveryCaseId }),
                }).returning({ id: entitiesTable.id });
                entityId = created?.id ?? null;
                if (entityId) materialized += 1;
              }
            }
            // Person identity is not a contact vector. Contact evidence is promoted only by the
            // target-scoped Investigator evidence boundary; discovery admission is represented in the case event.
            return { names: admitted, materialized, evidenceRows: 0 };
          }'''
          atlas = atlas[:start] + new_materialize + atlas[end:]

          marker = 'export async function runCanonicalAtlasPipeline(atlasJobId: string, opts: CanonicalAtlasOptions = {}): Promise<CanonicalAtlasResult> {'
          if atlas.count(marker) != 1:
              raise SystemExit('pipeline declaration anchor changed')

          old_head = '  const startedAt = Date.now(); const depth = resolveResearchDepth({ explicit: opts.researchDepth }); const targetCount = Math.max(1, Math.min(20, Math.trunc(opts.targetCount ?? 3))); const phaseSummary: Record<string, string> = {};'
          new_head = '''  const startedAt = Date.now();
  const depth = resolveResearchDepth({ explicit: opts.researchDepth });
  const targetCount = Math.max(1, Math.min(20, Math.trunc(opts.targetCount ?? 3)));
  const discoveryOnly = opts.discoveryOnly === true;
  const lockKey = opts.lockKey ?? "atlas-run";
  const phaseSummary: Record<string, string> = {};
  const discoveryObjective = (opts.objective?.trim() || "Discover real named people for subsequent target-scoped public-contact research. Choose every search, page visit, registry/domain/OSINT action and stopping point yourself. Emit a person only when you can attribute the observed source to that person; use promotionDecision=promote only for an exact named-person admission candidate. Never invent a person, contact, or URL.").slice(0, 10000);'''
          if atlas.count(old_head) != 1:
              raise SystemExit('pipeline head anchor changed')
          atlas = atlas.replace(old_head, new_head, 1)

          old_update = '  await updateJob(atlasJobId, { status: "running", progress: 0, total: 4, atlasPhase: 0, atlasPhaseTotal: 4, message: "Gemini Boss + DeepSeek Right-hand opening model-owned discovery…" });'
          new_update = '  await updateJob(atlasJobId, { status: "running", progress: 0, total: discoveryOnly ? 1 : 4, atlasPhase: 0, atlasPhaseTotal: discoveryOnly ? 1 : 4, message: "Gemini Boss + DeepSeek Right-hand opening model-owned discovery…" });'
          if atlas.count(old_update) != 1:
              raise SystemExit('initial job update anchor changed')
          atlas = atlas.replace(old_update, new_update, 1)

          old_rh = '    const rightHandRaw = await import("./deepseek-case-reasoning").then(({ runDeepSeekFreeJson }) => runDeepSeekFreeJson("Review the Apex Atlas discovery mission before Gemini assigns its Investigator. Return concise research priorities only. Do not browse, do not choose contacts, and do not invent people. Return JSON with decision, reason, focusLanes, confidence.", "You are the DeepSeek/NVIDIA Right-hand. Advise the Boss only. Never act as Investigator and never browse. Reply with ONE JSON object.")).catch((error) => ({ status: "unavailable" as const, model: "none", raw: null, error: error instanceof Error ? error.message : "Right-hand unavailable" }));'
          new_rh = '    const rightHandRaw = await import("./deepseek-case-reasoning").then(({ runDeepSeekFreeJson }) => runDeepSeekFreeJson(`Review this discovery mission before Gemini assigns its Investigator. Objective: ${discoveryObjective}. Return concise research priorities only. Do not browse, do not choose contacts, and do not invent people. Return JSON with decision, reason, focusLanes, confidence.`, "You are the DeepSeek/NVIDIA Right-hand. Advise the Boss only. Never act as Investigator and never browse. Reply with ONE JSON object.")).catch((error) => ({ status: "unavailable" as const, model: "none", raw: null, error: error instanceof Error ? error.message : "Right-hand unavailable" }));'
          if atlas.count(old_rh) != 1:
              raise SystemExit('Right-hand prompt anchor changed')
          atlas = atlas.replace(old_rh, new_rh, 1)

          old_boss = '    const boss = await runGeminiBossDiscovery({ objective: "Discover real named people who may be worth a target-scoped public-contact investigation. Favor attributable operating-company, filing, leadership, foundation, transaction, and other primary-source paths. Do not invent people or contacts.", motivation: "Find a small set of real people for deep target-scoped investigation.", geography: "Public web; geography selected by the research objective", exclusions: ["Do not browse as Boss.", "Do not prescribe a fixed tool or search sequence.", "Do not invent people, contacts, relationships, or URLs.", "Select only groq or mistral as Investigator."], rightHandAdvice: rightHand, startingLane: "model-selected discovery" });'
          new_boss = '    const boss = await runGeminiBossDiscovery({ objective: discoveryObjective, motivation: (opts.motivation || "Find a small set of real people for deep target-scoped investigation.").slice(0, 3000), geography: (opts.geography || "Public web; geography selected by the research objective").slice(0, 1200), exclusions: opts.exclusions ?? ["Do not browse as Boss.", "Do not prescribe a fixed tool or search sequence.", "Do not invent people, contacts, relationships, or URLs.", "Select only groq or mistral as Investigator."], rightHandAdvice: rightHand, startingLane: "model-selected discovery" });'
          if atlas.count(old_boss) != 1:
              raise SystemExit('Boss assignment anchor changed')
          atlas = atlas.replace(old_boss, new_boss, 1)

          old_no_inv = '    if (!boss.investigatorLlm) { phaseSummary.assignment = "No usable Gemini-selected Investigator; fail closed."; await updateJob(atlasJobId, { status: "failed", progress: 1, atlasPhase: 1, outcome: "incomplete", message: "Gemini Boss did not select a Groq/Mistral Investigator; no fallback was attempted.", result: JSON.stringify({ rightHand, boss }), finishedAt: new Date().toISOString() }); await clearActiveJobIfOwned("atlas-run", atlasJobId); return { phase: 1, ingested: 0, enriched: 0, contactsFound: 0, hotLeads: 0, durationMs: Date.now() - startedAt, phaseSummary }; }'
          new_no_inv = '    if (!boss.investigatorLlm) { phaseSummary.assignment = "No usable Gemini-selected Investigator; fail closed."; await updateJob(atlasJobId, { status: "failed", progress: 1, atlasPhase: 1, outcome: "incomplete", message: "Gemini Boss did not select a Groq/Mistral Investigator; no fallback was attempted.", result: JSON.stringify({ rightHand, boss }), finishedAt: new Date().toISOString() }); await clearActiveJobIfOwned(lockKey, atlasJobId); return { phase: 1, ingested: 0, enriched: 0, contactsFound: 0, hotLeads: 0, durationMs: Date.now() - startedAt, phaseSummary }; }'
          if atlas.count(old_no_inv) != 1:
              raise SystemExit('no-investigator branch anchor changed')
          atlas = atlas.replace(old_no_inv, new_no_inv, 1)

          old_obj = '    const discoveryObjective = "Discover real named people for subsequent target-scoped public-contact research. Choose every search, page visit, registry/domain/OSINT action and stopping point yourself. Emit a person only when you can attribute the observed source to that person; use promotionDecision=promote only for an exact named-person admission candidate. Never invent a person, contact, or URL.";\n'
          if atlas.count(old_obj) != 1:
              raise SystemExit('hardcoded discovery objective anchor changed')
          atlas = atlas.replace(old_obj, '', 1)

          old_case = '    const discoveryCaseId = await createAtlasDiscoveryCase({ atlasJobId, objective: discoveryObjective, investigatorLlm: boss.investigatorLlm });'
          new_case = '    const discoveryCaseId = opts.discoveryCaseId ?? await createAtlasDiscoveryCase({ atlasJobId, objective: discoveryObjective, investigatorLlm: boss.investigatorLlm });'
          if atlas.count(old_case) != 1:
              raise SystemExit('discovery case creation anchor changed')
          atlas = atlas.replace(old_case, new_case, 1)

          old_phase = '    phaseSummary.assignment = `${boss.investigatorLlm} selected by Gemini; discovery completed=${discovery.status}; durableCase=${discoveryCaseId}.`; phaseSummary.discovery = `admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;'
          new_phase = '    phaseSummary.assignment = `${boss.investigatorLlm} selected by Gemini; discovery completed=${discovery.status}; durableCase=${discoveryCaseId}.`; phaseSummary.discovery = `admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;'
          if atlas.count(old_phase) != 1:
              raise SystemExit('discovery phase summary anchor changed')

          snapshot_fn = '''

async function persistCanonicalDiscoverySnapshot(input: {
  atlasJobId: string;
  discoveryCaseId: number;
  discovery: Awaited<ReturnType<typeof runBureauAgenticWebPass>>;
  rightHand: Record<string, unknown>;
  boss: Record<string, unknown>;
  admitted: string[];
  materialized: number;
}): Promise<void> {
  const [current] = await db.select({ caseFile: researchCasesTable.caseFile, iteration: researchCasesTable.iteration })
    .from(researchCasesTable).where(eq(researchCasesTable.id, input.discoveryCaseId)).limit(1);
  let file: Record<string, any> = {};
  try { const parsed = current?.caseFile ? JSON.parse(current.caseFile) : {}; if (parsed && typeof parsed === "object") file = parsed; } catch { file = {}; }
  const candidates = input.admitted.map((name) => {
    const finding = input.discovery.findings.find((item) => item.personName?.trim().toLowerCase() === name.toLowerCase() && item.promotionDecision === "promote" && item.scope === "candidate");
    return { name, type: "review_candidate", relevance: "Explicit Investigator discovery admission candidate", reachability: "Requires target-scoped Investigator research", sourceUrls: finding?.sourceUrls ?? [], contactEvidence: [], state: "review_only", admittedEntityId: null };
  });
  const report = {
    id: `canonical-${input.atlasJobId}`,
    lane: "broad-web",
    provider: `Agentic-ReAct ${input.discovery.model}`,
    status: input.discovery.status === "completed" ? "completed" : input.discovery.status === "unavailable" ? "unavailable" : "failed",
    iteration: Number(current?.iteration ?? 0) + 1,
    summary: `Canonical Investigator discovery: ${input.discovery.findings.length} source-backed finding(s); ${input.admitted.length} explicit admission candidate(s).`,
    findings: input.discovery.trajectory.slice(-12),
    candidateNames: input.admitted,
    sourceUrls: input.discovery.findings.flatMap((finding) => finding.sourceUrls).slice(0, 20),
    nextQuestions: [],
    contactEvidence: input.discovery.contactEvidence,
    error: input.discovery.error ?? null,
    createdAt: new Date().toISOString(),
  };
  const nextFile = {
    ...file,
    investigatorReports: [...(Array.isArray(file.investigatorReports) ? file.investigatorReports : []), report],
    discoveredCandidates: [...(Array.isArray(file.discoveredCandidates) ? file.discoveredCandidates : []), ...candidates],
    currentProgress: { ...(file.currentProgress ?? {}), reportCount: Number(file.currentProgress?.reportCount ?? 0) + 1, completedLanes: [...new Set([...(file.currentProgress?.completedLanes ?? []), "broad-web"])], openQuestions: [], lastReviewedBy: "gemini-boss", refreshedAt: new Date().toISOString() },
    nextInvestigation: { rightHand: input.rightHand, boss: input.boss },
  };
  await db.update(researchCasesTable).set({ caseFile: JSON.stringify(nextFile), currentAction: input.admitted.length ? "target-scoped-investigator-research" : "review", iteration: Number(current?.iteration ?? 0) + 1, updatedAt: new Date() }).where(eq(researchCasesTable.id, input.discoveryCaseId));
  await db.insert(researchCaseEventsTable).values({ caseId: input.discoveryCaseId, iteration: Number(current?.iteration ?? 0) + 1, actorRole: "specialist", eventType: "observation", summary: `Canonical Investigator discovery completed; ${input.admitted.length} admission candidate(s), ${input.materialized} review entities.`, payload: JSON.stringify({ jobId: input.atlasJobId, investigatorLlm: input.discovery.model, admitted: input.admitted, searches: input.discovery.searches, visits: input.discovery.visits, trajectoryEntries: input.discovery.trajectory.length }) });
}
'''
          insert_at = atlas.index('\nexport async function runCanonicalAtlasPipeline')
          atlas = atlas[:insert_at] + snapshot_fn + atlas[insert_at:]

          # Stop after the shared discovery/admission path for the HTTP discovery endpoint.
          anchor = '    phaseSummary.assignment = `${boss.investigatorLlm} selected by Gemini; discovery completed=${discovery.status}; durableCase=${discoveryCaseId}.`; phaseSummary.discovery = `admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;'
          discovery_only = '''    phaseSummary.assignment = `${boss.investigatorLlm} selected by Gemini; discovery completed=${discovery.status}; durableCase=${discoveryCaseId}.`;
    phaseSummary.discovery = `admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;
    if (discoveryOnly) {
      await persistCanonicalDiscoverySnapshot({ atlasJobId, discoveryCaseId, discovery, rightHand, boss: { status: boss.status, model: boss.model, investigatorLlm: boss.investigatorLlm }, admitted, materialized });
      await updateJob(atlasJobId, { status: "done", progress: 1, total: 1, atlasPhase: 1, atlasPhaseTotal: 1, outcome: "complete", message: `Canonical discovery complete: ${admitted.length} exact named candidate(s) admitted for review.`, result: JSON.stringify({ rightHand, boss, discovery: { status: discovery.status, findings: discovery.findings.length, searches: discovery.searches, visits: discovery.visits, caseId: discoveryCaseId, trajectoryEntries: discovery.trajectory.length, trajectoryRecords: discovery.trajectoryRecords?.slice(-100) ?? [] } }), finishedAt: new Date().toISOString() });
      await clearActiveJobIfOwned(lockKey, atlasJobId);
      return { phase: 1, ingested: 0, enriched: materialized, contactsFound: 0, hotLeads: admitted.length, durationMs: Date.now() - startedAt, phaseSummary };
    }'''
          if atlas.count(anchor) != 1:
              raise SystemExit('discovery phase insertion anchor changed')
          atlas = atlas.replace(anchor, discovery_only, 1)

          # Persist the final shared discovery snapshot once the Boss control loop completes.
          loop_end = '    }\n    phaseSummary.discovery = `runs=${discoveryRuns}; admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;'
          replacement = '    }\n    await persistCanonicalDiscoverySnapshot({ atlasJobId, discoveryCaseId, discovery, rightHand, boss: { status: boss.status, model: boss.model, investigatorLlm: boss.investigatorLlm }, admitted, materialized });\n    phaseSummary.discovery = `runs=${discoveryRuns}; admitted=${admitted.length}; materialized=${materialized}; evidenceRows=${evidenceRows}; searches=${discovery.searches}; visits=${discovery.visits}; trajectory=${discovery.trajectory.length}; structuredTurns=${discovery.trajectoryRecords?.length ?? 0}`;'
          if atlas.count(loop_end) != 1:
              raise SystemExit('control-loop tail anchor changed')
          atlas = atlas.replace(loop_end, replacement, 1)

          old_catch = '  } catch (error) { const message = error instanceof Error ? error.message : "Canonical Atlas discovery failed."; await updateJob(atlasJobId, { status: "failed", outcome: "incomplete", message, finishedAt: new Date().toISOString() }); await clearActiveJobIfOwned("atlas-run", atlasJobId); throw error; }'
          new_catch = '  } catch (error) { const message = error instanceof Error ? error.message : "Canonical Atlas discovery failed."; await updateJob(atlasJobId, { status: "failed", outcome: "incomplete", message, finishedAt: new Date().toISOString() }); await clearActiveJobIfOwned(lockKey, atlasJobId); throw error; }'
          if atlas.count(old_catch) != 1:
              raise SystemExit('catch cleanup anchor changed')
          atlas = atlas.replace(old_catch, new_catch, 1)

          atlas_path.write_text(atlas)

          route_path = root / 'artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts'
          route = route_path.read_text()
          new_route = '''import { Router } from "express";
import { eq } from "drizzle-orm";
import { db, researchCasesTable } from "@workspace/db";
import { createJob, getActiveJob, getJob, setActiveJob, clearActiveJobIfOwned } from "../../lib/job-queue";
import { runCanonicalAtlasPipeline } from "../../lib/canonical-atlas-discovery";
import { resolveResearchDepth } from "../../lib/research-depth";

const router = Router();
function parseFile(raw: string | null): Record<string, any> | null { try { const value = raw ? JSON.parse(raw) : null; return value && typeof value === "object" ? value : null; } catch { return null; } }

router.post("/research/bureau/cases/:caseId/run-discovery", async (req, res): Promise<void> => {
  const caseId = Number(req.params.caseId);
  if (!Number.isInteger(caseId) || caseId <= 0) { res.status(400).json({ error: "Invalid bureau case ID" }); return; }
  const [current] = await db.select().from(researchCasesTable).where(eq(researchCasesTable.id, caseId)).limit(1);
  if (!current) { res.status(404).json({ error: "Bureau case not found" }); return; }
  const file = parseFile(current.caseFile);
  if (!file || file.caseType !== "discovery") { res.status(409).json({ error: "Only a discovery case can run the canonical discovery investigation" }); return; }
  const existingJobId = await getActiveJob("case-bureau-discovery");
  if (existingJobId) { const existing = await getJob(existingJobId); if (existing?.status === "running" || existing?.status === "queued") { res.status(409).json({ error: "A bureau discovery investigation is already running.", jobId: existingJobId }); return; } }
  const jobId = await createJob("case-bureau-discovery");
  await setActiveJob("case-bureau-discovery", jobId);
  const depth = resolveResearchDepth({ explicit: typeof file.researchDepth === "string" ? file.researchDepth : undefined });
  const objective = [String(file.humanBrief?.objective ?? ""), String(file.humanBrief?.motivation ?? ""), file.humanBrief?.geography ? `Geography: ${file.humanBrief.geography}` : "", "Discover exact named people only when the observed public source supports the identity. You own every search/tool choice and stopping point. Emit promotionDecision=promote only for an exact named-person admission candidate. Never invent."] .filter(Boolean).join("\n");
  void (async () => {
    try {
      await runCanonicalAtlasPipeline(jobId, {
        targetCount: 20,
        researchDepth: depth.researchDepth,
        targetTimeoutMs: depth.agenticHardTimeoutMs,
        discoveryCaseId: caseId,
        discoveryOnly: true,
        objective,
        motivation: String(file.humanBrief?.motivation ?? "").slice(0, 3000),
        geography: String(file.humanBrief?.geography ?? "").slice(0, 1200),
        exclusions: Array.isArray(file.humanBrief?.exclusions) ? file.humanBrief.exclusions : [],
        lockKey: "case-bureau-discovery",
      });
    } catch (error) {
      const message = error instanceof Error ? error.message : "Canonical case discovery failed.";
      await clearActiveJobIfOwned("case-bureau-discovery", jobId);
    }
  })();
  res.status(202).json({ jobId, caseId, status: "running", mode: "canonical-model-owned-discovery" });
});

export default router;
'''
          if 'persistSourceBackedBureauContactsForEntity' not in route or 'runGeminiBossDiscovery' not in route:
              raise SystemExit('expected pre-consolidation discovery route markers are missing; refusing replacement')
          route_path.write_text(new_route)
          PY
      - name: Verify consolidation invariants
        run: |
          ! grep -q 'persistSourceBackedBureauContactsForEntity' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          ! grep -q 'runGeminiBossDiscovery' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          grep -q 'runCanonicalAtlasPipeline' artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          grep -q 'discoveryOnly' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
          grep -q 'discoveryCaseId' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
          ! grep -q 'person:${name}' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
          grep -q 'persistCanonicalDiscoverySnapshot' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
          grep -q 'mode: "discovery"' artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/routes/research/canonical-case-discovery.ts
          git commit -m 'Consolidate canonical discovery control plane [skip apex discovery consolidation]'
          git push origin HEAD:main
