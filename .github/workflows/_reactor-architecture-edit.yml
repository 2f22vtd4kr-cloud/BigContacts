name: Reactor architecture edit
on:
  push:
    branches: [apex/reactor-live-source-truth]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apex/reactor-live-source-truth
          fetch-depth: 0
      - name: Apply targeted architecture edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/apex-finder/src/pages/reactor.tsx')
          s = p.read_text()
          old = '''  // Live semantic feed is built from actual Bureau events plus actual Dig spans.\n  // Spans are authoritative for tool/model activity; event logs are supplemental.\n  const reactorLiveEvents = useMemo(() => {'''
          start = s.find(old)
          if start < 0: raise SystemExit('reactorLiveEvents start not found')
          end_marker = '''  }, [deskEvents, atlasState?.recentSpans]);\n'''
          end = s.find(end_marker, start)
          if end < 0: raise SystemExit('reactorLiveEvents end not found')
          s = s[:start] + s[end + len(end_marker):]
          old_render = '''            {isLive && reactorLiveEvents.length > 0 && (\n              <div className="mb-3" data-testid="reactor-live-semantic-layer">\n                <ReactorLiveSurface\n                  events={reactorLiveEvents as any}\n                  targetName={atlasState?.currentEntities?.[0] || atlasState?.atlasTelemetry?.targetName}\n                  compact\n                />\n              </div>\n            )}'''
          new_render = '''            {isLive && (\n              <div className="mb-3" data-testid="reactor-live-semantic-layer">\n                <ReactorLiveSurface\n                  events={[]}\n                  targetName={atlasState?.currentEntities?.[0] || atlasState?.atlasTelemetry?.targetName}\n                  compact\n                />\n              </div>\n            )}'''
          if old_render not in s: raise SystemExit('reactor live surface render block not found')
          s = s.replace(old_render, new_render, 1)
          marker = '''        {/* Scheme canvas — horizontal + vertical pan via scroll (nodes extend past viewport) */}'''
          if s.count(marker) != 1: raise SystemExit('scheme canvas marker count mismatch')
          s = s.replace(marker, '''        {!isLive && (\n          <div data-testid="reactor-standby-scheme">\n        {/* Scheme canvas — standby/explanatory only; live mode uses telemetry activity above */}''', 1)
          close_marker = '''      </div>{/* main column: desk above scheme */}'''
          if s.count(close_marker) != 1: raise SystemExit('main column close marker mismatch')
          s = s.replace(close_marker, '''          </div>{/* reactor-standby-scheme */}\n        )}\n      </div>{/* main column: desk above scheme */}''', 1)
          p.write_text(s)

          p = Path('artifacts/api-server/src/src/routes/atlas.ts')
          s = p.read_text()
          old = '''router.get("/ingest/atlas-status", async (_req: Request, res: Response): Promise<void> => {\n  if (_atlasStatusCache && Date.now() - _atlasStatusCache.at < ATLAS_STATUS_CACHE_MS) {\n    res.json(_atlasStatusCache.body);\n    return;\n  }'''
          new = '''router.get("/ingest/atlas-status", async (_req: Request, res: Response): Promise<void> => {\n  // Never serve the 15s terminal/standby cache while an Atlas job is active.\n  // Live Reactor telemetry is polled from this endpoint, so active spans must\n  // cross the status boundary without an artificial cache delay.\n  const activeJobForCache = await withBudget(getActiveJob("atlas-run"), null);\n  if (!activeJobForCache && _atlasStatusCache && Date.now() - _atlasStatusCache.at < ATLAS_STATUS_CACHE_MS) {\n    res.json(_atlasStatusCache.body);\n    return;\n  }'''
          if old not in s: raise SystemExit('atlas cache guard not found')
          s = s.replace(old, new, 1)
          old2 = '''  const jobId = await withBudget(getActiveJob("atlas-run"), null);'''
          if old2 not in s: raise SystemExit('atlas job lookup not found')
          s = s.replace(old2, '''  const jobId = activeJobForCache;''', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff --stat
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/apex-finder/src/pages/reactor.tsx artifacts/api-server/src/src/routes/atlas.ts
          git diff --cached --check
          git commit -m "refactor(reactor): make live desk and status plane authoritative"
          git push origin HEAD:apex/reactor-live-source-truth
