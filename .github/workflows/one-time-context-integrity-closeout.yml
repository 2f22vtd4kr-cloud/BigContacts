name: One-time context integrity closeout

on:
  push:
    branches:
      - audit/genuine-five-green-final

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Apply context integrity closeout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax and remove remaining hard data clipping
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('artifacts/api-server/src/src/lib/bureau-agentic-pass.ts')
          text = p.read_text()
          fixed, count = re.subn(r'runIds:\[\.\.\.new Set\(\[\.\.\.\(Array\.isArray\(current\.runIds\)\?current\.runIds:\[\]\),input\.runId\]\)\]\),', 'runIds:[...new Set([...(Array.isArray(current.runIds)?current.runIds:[]),input.runId])],', text)
          if count != 1:
              raise SystemExit(f'bureau-agentic-pass.ts: expected one malformed runIds expression, found {count}')
          p.write_text(fixed)

          for path in [
              'artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts',
              'artifacts/api-server/src/src/lib/target-control-decision.ts',
              'artifacts/api-server/src/src/lib/atlas-control-decision.ts',
              'artifacts/api-server/src/src/lib/final-target-review.ts',
          ]:
              p = Path(path)
              text = p.read_text()
              text = re.sub(r'\.slice\(-\d+\)', '', text)
              text = re.sub(r'\.slice\(\d+\s*,\s*\d+\)', '', text)
              p.write_text(text)

          p = Path('artifacts/api-server/src/src/lib/agentic-web-research-core.ts')
          text = p.read_text()
          old = 'const body = await response.text(); return body.slice(0, MAX_NETWORK_RESPONSE_BYTES);'
          new = 'const body = await response.text(); if (Buffer.byteLength(body, "utf8") > MAX_NETWORK_RESPONSE_BYTES) throw new Error(`Network response exceeds the configured memory safety bound (${MAX_NETWORK_RESPONSE_BYTES} bytes); response was rejected, not truncated.`); return body;'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'response was rejected, not truncated' not in text:
              raise SystemExit('agentic-web-research-core.ts: network response cap pattern not found')
          p.write_text(text)

          p = Path('artifacts/api-server/src/src/lib/case-bureau.ts')
          text = p.read_text()
          for old, new in [('.slice(0, 8)', ''), ('.slice(0, 12)', ''), ('.slice(0, 20)', ''), ('.slice(0, 30)', ''), ('.slice(0, 40)', ''), ('.slice(-100)', ''), ('.slice(-50)', ''), ('.slice(-30)', ''), ('.slice(-20)', ''), ('.slice(0, 100_000)', '')]:
              text = text.replace(old, new)
          text = re.sub(r'return \[\.\.\.new Set\(strings\)\]\.slice\(0, limit\);', 'return [...new Set(strings)];', text)
          marker = '"Gemini Boss text-generation capacity busy; stopping this Boss attempt (not a web-search failure)"'
          if marker in text:
              text = text.replace(marker, '"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"', 1)
              pos = text.index('"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"')
              ret = text.find('          return { model, raw: null, error: lastError };', pos)
              if ret < 0:
                  raise SystemExit('case-bureau.ts: transient return not found')
              text = text[:ret] + '          continue;' + text[ret + len('          return { model, raw: null, error: lastError };'):]
          elif 'Gemini Boss text-generation capacity busy; trying the next compatible Gemini model' not in text:
              raise SystemExit('case-bureau.ts: Gemini Boss transient block not found')
          p.write_text(text)

      - name: Add durable context integrity guard to canonical five-green audit
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/audit-five-greens.yml')
          text = p.read_text()
          if 'Context integrity — no hard prompt/data clipping' not in text:
              needle = '      - name: Assert unified investigator architecture\n        run: node scripts/check-unified-investigator-architecture.mjs\n'
              guard = '''      - name: Context integrity — no hard prompt/data clipping\n        shell: bash\n        run: |\n          set -euo pipefail\n          ! git grep -n -E 'slice\\(-[0-9]+\\)|slice\\([0-9]+, *[0-9]+\\)|MAX_TRAJECTORY_RECORDS = 100|MAX_OBS = 5_000' -- artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/case-bureau.ts\n          grep -q 'trajectoryRecords' artifacts/api-server/src/src/lib/agentic-web-research-core.ts\n          grep -q 'trying the next compatible Gemini model' artifacts/api-server/src/src/lib/case-bureau.ts\n'''
              if needle not in text:
                  raise SystemExit('five-green insertion point not found')
              text = text.replace(needle, needle + guard, 1)
          p.write_text(text)

      - name: Commit closeout and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-context-integrity-closeout.yml
          git add artifacts/api-server/src/src/lib/bureau-agentic-pass.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/case-bureau.ts .github/workflows/audit-five-greens.yml
          git commit -m 'Close out context integrity and Gemini fallback audit'
          git push
