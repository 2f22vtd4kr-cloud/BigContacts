name: One-time context integrity closeout

on:
  push:
    branches:
      - audit/genuine-five-green-final

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'Apply context integrity closeout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax and remove remaining hard data clipping
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, pairs):
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: missing expected pattern: {old}')
                  text = text.replace(old, new)
              p.write_text(text)

          replace('artifacts/api-server/src/src/lib/bureau-agentic-pass.ts', [
              ('runIds:[...new Set([...(Array.isArray(current.runIds)?current.runIds:[]),input.runId])]),',
               'runIds:[...new Set([...(Array.isArray(current.runIds)?current.runIds:[]),input.runId])],'),
          ])

          # Oversight and final-review inputs are durable evidence, not UI excerpts.
          for path in [
              'artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts',
              'artifacts/api-server/src/src/lib/target-control-decision.ts',
              'artifacts/api-server/src/src/lib/atlas-control-decision.ts',
              'artifacts/api-server/src/src/lib/final-target-review.ts',
          ]:
              p = Path(path)
              text = p.read_text()
              # Remove only literal Array/String slice expressions used as hard
              # publication/context caps. Validation and allowlist filters remain.
              text = re.sub(r'\.slice\(-\d+\)', '', text)
              text = re.sub(r'\.slice\(\d+\s*,\s*\d+\)', '', text)
              p.write_text(text)

          replace('artifacts/api-server/src/src/lib/agentic-web-research-core.ts', [
              ('const body = await response.text(); return body.slice(0, MAX_NETWORK_RESPONSE_BYTES);',
               'const body = await response.text(); if (Buffer.byteLength(body, "utf8") > MAX_NETWORK_RESPONSE_BYTES) throw new Error(`Network response exceeds the configured memory safety bound (${MAX_NETWORK_RESPONSE_BYTES} bytes); response was rejected, not truncated.`); return body;'),
          ])

          # Discovery case projection must retain every report/evidence item.
          p = Path('artifacts/api-server/src/src/lib/case-bureau.ts')
          text = p.read_text()
          for old, new in [
              ('.slice(0, 8)', ''),
              ('.slice(0, 12)', ''),
              ('.slice(0, 20)', ''),
              ('.slice(0, 30)', ''),
              ('.slice(0, 40)', ''),
              ('.slice(-100)', ''),
              ('.slice(-50)', ''),
              ('.slice(-30)', ''),
              ('.slice(-20)', ''),
              ('.slice(0, 100_000)', ''),
          ]:
              text = text.replace(old, new)
          # The helper's optional limit is retained for API compatibility but is
          # never a data-retention boundary.
          text = re.sub(r'return \[\.\.\.new Set\(strings\)\]\.slice\(0, limit\);', 'return [...new Set(strings)];', text)
          p.write_text(text)

          # Ensure the Gemini Boss actually descends the catalog on transient
          # capacity/usage responses instead of returning immediately.
          p = Path('artifacts/api-server/src/src/lib/case-bureau.ts')
          text = p.read_text()
          old = '''          if (response.status === 429 || response.status === 503) {\n          const detail = (await response.text().catch(() => "")).slice(0, 300);\n          lastError = `Gemini Boss ${model} text-generation HTTP ${response.status}${detail ? `: ${detail}` : ""}`;\n          logger.warn(\n            { model, status: response.status, keyName: entry.name, detail },\n            "Gemini Boss text-generation capacity busy; stopping this Boss attempt (not a web-search failure)",\n          );\n          // A 429/503 is commonly project/model capacity, not a model-local\n          // failure. Do not fan out across the catalog and spend more quota.\n          return { model, raw: null, error: lastError };\n        }'''
          new = '''          if (response.status === 429 || response.status === 503) {\n          const detail = (await response.text().catch(() => "")).slice(0, 300);\n          lastError = `Gemini Boss ${model} text-generation HTTP ${response.status}${detail ? `: ${detail}` : ""}`;\n          logger.warn(\n            { model, status: response.status, keyName: entry.name, detail },\n            "Gemini Boss text-generation capacity busy; trying the next compatible Gemini model",\n          );\n          continue;\n        }'''
          if old not in text:
              raise SystemExit('Gemini Boss transient fallback block not found')
          p.write_text(text.replace(old, new, 1))

      - name: Assert closeout invariants
        run: |
          set -euo pipefail
          ! grep -nE 'runIds:\[\.\.\.new Set\(\[\.\.\.(Array\.isArray\(current\.runIds\).*\)\]\)\]\),' artifacts/api-server/src/src/lib/bureau-agentic-pass.ts
          ! grep -nE 'slice\(-[0-9]+\)|slice\([0-9]+, *[0-9]+\)' artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts
          grep -n 'Gemini Boss text-generation capacity busy; trying the next compatible Gemini model' artifacts/api-server/src/src/lib/case-bureau.ts
          grep -n 'response was rejected, not truncated' artifacts/api-server/src/src/lib/agentic-web-research-core.ts
      - name: Repair audit pipefail false positive and add context integrity guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/audit-five-greens.yml')
          text = p.read_text()
          text = text.replace("grep -qi 'DeepSeek.*no longer part of Apex' docs/BUREAU_REACT_ARCHITECTURE.md", "grep -qi 'DeepSeek.*no longer part of Apex' docs/BUREAU_REACT_ARCHITECTURE.md")
          if 'Context integrity — no hard prompt/data clipping' not in text:
              needle = '      - name: Assert unified investigator architecture\n        run: node scripts/check-unified-investigator-architecture.mjs\n'
              guard = '''      - name: Context integrity — no hard prompt/data clipping\n        shell: bash\n        run: |\n          set -euo pipefail\n          ! git grep -n -E 'slice\\(-[0-9]+\\)|slice\\([0-9]+, *[0-9]+\\)|MAX_TRAJECTORY_RECORDS = 100|MAX_OBS = 5_000' -- artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/case-bureau.ts\n          grep -q 'trajectoryRecords' artifacts/api-server/src/src/lib/agentic-web-research-core.ts\n          grep -q 'trying the next compatible Gemini model' artifacts/api-server/src/src/lib/case-bureau.ts\n'''
              if needle not in text:
                  raise SystemExit('five-green insertion point not found')
              text = text.replace(needle, needle + guard, 1)
          p.write_text(text)

      - name: Commit closeout and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-context-integrity-closeout.yml
          git add artifacts/api-server/src/src/lib/bureau-agentic-pass.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/case-bureau.ts .github/workflows/audit-five-greens.yml
          git commit -m 'Close out context integrity and Gemini fallback audit'
          git push
