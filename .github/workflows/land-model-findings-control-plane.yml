name: land-model-findings-control-plane
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/land-model-findings-control-plane.yml"
      - "scripts/apply-model-findings-control-plane.py"
jobs:
  land:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify whole sources and apply deterministic control-plane patch
        run: |
          set -euo pipefail
          A=artifacts/api-server/src/src/lib/agentic-web-research.ts
          D=artifacts/api-server/src/src/lib/discovery-agent.ts
          test "$(wc -l < "$A")" -ge 2000
          test "$(wc -l < "$D")" -ge 280
          ! grep -q PLACEHOLDER "$A" "$D"
          python3 scripts/apply-model-findings-control-plane.py
          test "$(wc -l < "$A")" -ge 2000
          test "$(wc -l < "$D")" -ge 280
          grep -q "modelFindings: AgenticFinding\[\]" "$A"
          grep -q "const admissionFindings = result.modelFindings" "$D"
          ! grep -q PLACEHOLDER "$A" "$D" scripts/apply-model-findings-control-plane.py
          git diff --check
          if git diff --quiet -- "$A" "$D"; then
            echo "No source changes required (already patched)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$A" "$D"
          git commit -m "fix(research): enforce model-owned discovery admission boundary"
          git push origin HEAD:main
