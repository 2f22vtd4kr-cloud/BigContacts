name: one-time remove Groq final review
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove Groq final-review fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/api-server/src/lib/ai-extractor.ts')
          s = p.read_text()
          block = re.compile(r'\n  // 3\) Groq capacity fallback \(multi-model\).*?\n  return adjudicateFinalTargetReview\(input, \{\}, "unavailable-final-review"\);\n\}', re.S)
          replacement = '''\n  // Only the two oversight roles may adjudicate final card publication:\n  // Gemini Boss first, then NVIDIA/DeepSeek right-hand. Investigator models\n  // such as Groq/Mistral are never promoted into the final-review role.\n  return adjudicateFinalTargetReview(input, {}, "unavailable-final-review");\n}'''
          s, n = block.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one Groq final-review fallback block, found {n}')
          p.write_text(s)
          PY
          git diff --check
          if grep -n "groq-final-review-fallback\|covering final card review" artifacts/api-server/src/lib/ai-extractor.ts; then exit 1; fi
          git diff --stat
      - name: Verify architecture guard
        run: |
          node scripts/check-unified-investigator-architecture.mjs
      - name: Commit source change and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/ai-extractor.ts
          git commit -m 'fix: keep final review within oversight roles'
          git rm .github/workflows/apex-one-time-remove-groq-final-review.yml
          git commit -m 'chore: remove one-time final-review role runner'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
