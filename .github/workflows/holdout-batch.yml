name: Holdout Batch vs Grok

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "How many default-batch targets (1-5)"
        required: false
        default: "5"

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PNPM_NETWORK_TIMEOUT: "600000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org/

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Force public npm registry
        run: |
          printf 'registry=https://registry.npmjs.org/\nalways-auth=false\n' > .npmrc
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set fetch-timeout 600000
          pnpm config set network-timeout 600000

      - name: Install deps
        env:
          CI: "false"
        run: |
          pnpm install --no-frozen-lockfile --filter @workspace/db --filter @workspace/api-server --filter @workspace/api-zod --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Install esbuild binary
        run: |
          ESBUILD=$(find node_modules -path '*/esbuild/install.js' | head -1)
          node "$ESBUILD" || true

      - name: Setup Postgres and Redis
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql redis-server > /dev/null
          sudo service postgresql start || true
          sudo service redis-server start || true
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          redis-cli ping

      - name: Schema and build
        env:
          DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
        run: |
          pnpm --filter @workspace/db exec drizzle-kit push --force || true
          pnpm --filter @workspace/api-server build

      - name: Run holdout batch
        env:
          DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
          REDIS_URL: redis://127.0.0.1:6379
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_1: ${{ secrets.EXA_API_KEY_1 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WHOXY_API_KEY: ${{ secrets.WHOXY_API_KEY }}
          APEX_ROOT: ${{ github.workspace }}
          BROWSER_FETCH_MAX_PER_CASE: "10"
          APEX_SKIP_SEMANTIC: "1"
          PORT: "8080"
          ENABLE_AUTO_PIPELINE: "false"
          NODE_ENV: "development"
          OVERNIGHT_POLL_MAX: "40"
          OVERNIGHT_POLL_SLEEP_S: "8"
          TEST_OUT_DIR: /tmp/apex-holdout-batch
        run: |
          redis-cli ping || redis-server --daemonize yes || true
          mkdir -p /tmp/apex-holdout-batch
          node scripts/run-holdout-batch.mjs

      - name: Upload holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holdout-batch-results
          path: |
            /tmp/apex-holdout-batch/
            /tmp/api.log
          if-no-files-found: ignore
