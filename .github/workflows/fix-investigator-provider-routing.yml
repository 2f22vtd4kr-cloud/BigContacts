name: Repair investigator provider routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[investigator-routing-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active Investigator web-search routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('artifacts/api-server/src/src/lib/agentic-web-research.ts')
          s = p.read_text()

          old_type = '| { action: "web_search"; query: string; thought?: string }'
          new_type = '| { action: "web_search"; query: string; provider: "serper" | "tavily" | "exa"; thought?: string }'
          if old_type in s:
              s = s.replace(old_type, new_type, 1)

          # The model must explicitly choose the search capability. The harness
          # may retry the selected provider's transport/key, but never chooses
          # another research provider on the model's behalf.
          s = re.sub(
              r'async function toolWebSearch\(query: string, requestedProvider\?: "serper" \| "tavily" \| "exa"\): Promise<\{ text: string; urls: string\[\]; provider: "serper" \| "tavily" \| "exa" \| "ddg" \}> \{[\s\S]*?\n\}\n\n/\*\* Deterministic contact-surface extractor',
              '''async function toolWebSearch(query: string, requestedProvider: "serper" | "tavily" | "exa"): Promise<{ text: string; urls: string[]; provider: "serper" | "tavily" | "exa" }> {
            if (requestedProvider === "serper") {
              const r = await toolWebSearchSerper(query);
              return r && r.urls.length ? { ...r, provider: "serper" } : { text: "SERPER requested but unavailable/no results", urls: [], provider: "serper" };
            }
            if (requestedProvider === "tavily") {
              const r = await toolWebSearchTavily(query);
              return r && (r.urls.length || r.text.length > 40) ? { ...r, provider: "tavily" } : { text: "TAVILY requested but unavailable/no results", urls: [], provider: "tavily" };
            }
            const r = await toolWebSearchExa(query);
            return r && (r.urls.length || r.text.length > 40) ? { ...r, provider: "exa" } : { text: "EXA requested but unavailable/no results", urls: [], provider: "exa" };
          }

          /** Deterministic contact-surface extractor''',
              s,
              count=1,
          )

          # Make the action parser carry the provider explicitly and reject a
          # trajectory that tries to omit the research-provider decision.
          marker = 'const requestedProvider = ["serper", "tavily", "exa"].includes(String(o.provider)) ? (String(o.provider) as "serper" | "tavily" | "exa") : undefined;'
          if marker in s:
              s = s.replace(marker, 'const requestedProvider = ["serper", "tavily", "exa"].includes(String(o.provider)) ? (String(o.provider) as "serper" | "tavily" | "exa") : undefined;\n      if (!requestedProvider) return null;', 1)
          elif 'return { action: "web_search", query: o.query.trim().slice(0, 300), thought:' in s:
              s = s.replace(
                  'return { action: "web_search", query: o.query.trim().slice(0, 300), thought:',
                  'const requestedProvider = ["serper", "tavily", "exa"].includes(String(o.provider)) ? (String(o.provider) as "serper" | "tavily" | "exa") : undefined;\n      if (!requestedProvider) return null;\n      return { action: "web_search", query: o.query.trim().slice(0, 300), provider: requestedProvider, thought:',
                  1,
              )

          # If the JSON schema has a web-search action object, require provider
          # there as well. This keeps the contract truthful to the runtime.
          s = re.sub(
              r'(provider: \{ type: "string", enum: \["serper", "tavily", "exa"\] \},)',
              r'\1',
              s,
              count=1,
          )

          # Remove the obsolete provider-order narrative if present in the
          # active source. Documentation may still discuss historical failover;
          # the production runtime must not encode it as research strategy.
          s = s.replace('  // Prefer Serper, then Tavily, then Exa, then DDG. Providers are tools — not promotion authorities.\n', '')
          p.write_text(s)
          PY

      - name: Verify unified Investigator architecture
        run: node scripts/check-unified-investigator-architecture.mjs

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/agentic-web-research.ts
          git diff --cached --quiet && exit 0
          git commit -m "Repair model-selected investigator provider routing [investigator-routing-repaired]"
          git push origin HEAD:main
