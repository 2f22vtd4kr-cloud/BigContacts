name: Audit round 10 repair
on:
  push:
    branches: [audit/round10-full-fix]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/_audit_round10_reactor_fix.sh
      - run: |
          set -e
          grep -n '42%' artifacts/apex-finder/src/pages/reactor.tsx && exit 1 || true
          rm .github/workflows/_audit_round10_repair.yml scripts/_audit_round10_reactor_fix.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: derive Reactor progress from recorded telemetry'
          git push
