name: API Server CI

on:
  push:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-server-ci.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-server-ci.yml"

permissions:
  contents: read

jobs:
  identity-provenance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --filter @workspace/db... --filter @workspace/api-server... --filter @workspace/api-zod... --filter apex-finder-local...
      - name: Run identity/provenance regression tests
        run: pnpm --dir artifacts/api-server exec vitest run src/src/test/agentic-scope-boundary.test.ts src/src/test/agentic-source-provenance.test.ts src/src/test/discovery-agent-parse.test.ts
