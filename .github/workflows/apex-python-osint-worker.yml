name: Apex Python OSINT Worker

on:
  push:
    branches: [main]
    paths:
      - "services/apex-python-osint-worker/**"
      - "deployment/apex-python-osint-worker/**"
      - "scripts/attest-python-osint-worker.py"
      - "scripts/check-agentic-osint-capability-boundary.mjs"
      - "scripts/check-python-osint-egress-boundary.mjs"
      - ".github/workflows/apex-python-osint-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/apex-python-osint-worker/**"
      - "deployment/apex-python-osint-worker/**"
      - "scripts/attest-python-osint-worker.py"
      - "scripts/check-agentic-osint-capability-boundary.mjs"
      - "scripts/check-python-osint-egress-boundary.mjs"
      - ".github/workflows/apex-python-osint-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/apex-python-osint-worker/requirements.txt
      - name: Install worker contract dependencies
        run: python -m pip install -r services/apex-python-osint-worker/requirements.txt pyyaml
      - name: Compile worker and attestation sources
        run: |
          python -m py_compile services/apex-python-osint-worker/app.py
          python -m py_compile services/apex-python-osint-worker/tool_runner.py
          python -m py_compile scripts/attest-python-osint-worker.py
      - name: Test worker argument, isolation proof, and process contracts
        run: python -m unittest discover -s services/apex-python-osint-worker/tests -v
      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("deployment/apex-python-osint-worker")
          docs = 0
          for path in sorted(root.glob("*.yaml")):
              loaded = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              if not loaded or any(not isinstance(item, dict) for item in loaded):
                  raise SystemExit(f"{path}: empty or invalid Kubernetes document")
              docs += len(loaded)
          print(f"validated {docs} Kubernetes documents across {len(list(root.glob('*.yaml')))} files")
          PY
      - name: Verify canonical capability and sandbox boundaries
        run: |
          node scripts/check-agentic-osint-capability-boundary.mjs
          node scripts/check-python-osint-egress-boundary.mjs
          node scripts/check-workflow-action-pins.mjs

  node-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm --dir artifacts/api-server run typecheck
      - name: Worker client, tool adapters, and sandbox contracts
        run: pnpm --dir artifacts/api-server exec vitest run src/src/lib/python-osint-worker-client.test.ts src/src/lib/python-tools.test.ts src/src/test/python-sandbox-contract.test.ts

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated worker image
        run: docker build --pull -f services/apex-python-osint-worker/Dockerfile -t apex-python-osint-worker:ci .
      - name: Build public-egress proxy image
        run: docker build --pull -f services/apex-python-osint-worker/proxy.Dockerfile -t apex-osint-egress-proxy:ci .
      - name: Smoke-check executor help contracts
        run: |
          docker run --rm --entrypoint /bin/sh apex-python-osint-worker:ci -ec '
            /opt/venvs/holehe/bin/python -c "import holehe.core, trio, httpx"
            /opt/venvs/maigret/bin/maigret --help >/dev/null
            /opt/venvs/sherlock/bin/sherlock --help >/dev/null
            /opt/venvs/theharvester/bin/theHarvester --help >/dev/null
            /opt/venvs/spiderfoot/bin/python -c "import sf"
          '
