name: Apex Python OSINT Worker

on:
  push:
    branches: [main]
    paths:
      - "services/apex-python-osint-worker/**"
      - "artifacts/api-server/src/src/lib/agentic-web-research-core.ts"
      - "artifacts/api-server/src/src/lib/python-osint-worker-client.ts"
      - "artifacts/api-server/src/src/lib/python-tools.ts"
      - "artifacts/api-server/src/src/lib/python-sandbox-contract.ts"
      - "artifacts/api-server/src/src/lib/python-osint-worker-client.test.ts"
      - "artifacts/api-server/src/src/lib/python-tools.test.ts"
      - "artifacts/api-server/src/src/lib/python-osint-execution-metadata.test.ts"
      - "deployment/apex-python-osint-worker/**"
      - "scripts/attest-python-osint-worker.py"
      - "scripts/generate-python-osint-attestation-keys.py"
      - "scripts/check-agentic-osint-capability-boundary.mjs"
      - "scripts/check-python-osint-egress-boundary.mjs"
      - ".github/workflows/apex-python-osint-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/apex-python-osint-worker/**"
      - "artifacts/api-server/src/src/lib/agentic-web-research-core.ts"
      - "artifacts/api-server/src/src/lib/python-osint-worker-client.ts"
      - "artifacts/api-server/src/src/lib/python-tools.ts"
      - "artifacts/api-server/src/src/lib/python-sandbox-contract.ts"
      - "artifacts/api-server/src/src/lib/python-osint-worker-client.test.ts"
      - "artifacts/api-server/src/src/lib/python-tools.test.ts"
      - "artifacts/api-server/src/src/lib/python-osint-execution-metadata.test.ts"
      - "deployment/apex-python-osint-worker/**"
      - "scripts/attest-python-osint-worker.py"
      - "scripts/check-agentic-osint-capability-boundary.mjs"
      - "scripts/check-python-osint-egress-boundary.mjs"
      - ".github/workflows/apex-python-osint-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/apex-python-osint-worker/requirements.txt
      - name: Install worker contract dependencies
        run: python -m pip install -r services/apex-python-osint-worker/requirements.txt pyyaml
      - name: Compile worker and attestation sources
        run: |
          python -m py_compile services/apex-python-osint-worker/app.py
          python -m py_compile services/apex-python-osint-worker/tool_runner.py
          python -m py_compile scripts/attest-python-osint-worker.py
          python -m py_compile scripts/generate-python-osint-attestation-keys.py
      - name: Test worker argument, isolation proof, and process contracts
        run: python -m unittest discover -s services/apex-python-osint-worker/tests -v
      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path("deployment/apex-python-osint-worker")
          docs = 0
          for path in sorted(root.glob("*.yaml")):
              loaded = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              if not loaded or any(not isinstance(item, dict) for item in loaded):
                  raise SystemExit(f"{path}: empty or invalid Kubernetes document")
              docs += len(loaded)
          print(f"validated {docs} Kubernetes documents across {len(list(root.glob('*.yaml')))} files")

          import re
          def deployment(path, name):
              matches = [item for item in yaml.safe_load_all(path.read_text(encoding="utf-8"))
                         if isinstance(item, dict) and item.get("kind") == "Deployment"
                         and item.get("metadata", {}).get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected exactly one Deployment named {name}")
              return matches[0]

          worker = deployment(root / "worker-deployment.yaml", "apex-python-osint-worker")
          proxy = deployment(root / "proxy-deployment.yaml", "apex-osint-egress-proxy")
          worker_container = next((c for c in worker["spec"]["template"]["spec"]["containers"] if c.get("name") == "worker"), None)
          proxy_container = next((c for c in proxy["spec"]["template"]["spec"]["containers"] if c.get("name") == "squid"), None)
          if worker_container is None or proxy_container is None:
              raise SystemExit("worker/proxy deployment container is missing")
          digest_pattern = re.compile(r"^sha256:[0-9a-f]{64}$")
          worker_image = worker_container.get("image", "")
          proxy_image = proxy_container.get("image", "")
          worker_digest = worker_image.rsplit("@", 1)[-1] if "@" in worker_image else ""
          proxy_digest = proxy_image.rsplit("@", 1)[-1] if "@" in proxy_image else ""
          if not worker_digest or not digest_pattern.fullmatch(worker_digest):
              raise SystemExit("worker image must be pinned to an immutable sha256 digest")
          if not proxy_digest or not digest_pattern.fullmatch(proxy_digest):
              raise SystemExit("proxy image must be pinned to an immutable sha256 digest")
          worker_env = {item.get("name"): item.get("value") for item in worker_container.get("env", [])}
          if worker_env.get("APEX_PYTHON_WORKER_IMAGE_DIGEST") != worker_digest:
              raise SystemExit("worker deployment digest env does not match its immutable image reference")
          if worker_env.get("APEX_PYTHON_EGRESS_PROXY_IMAGE_DIGEST") != proxy_digest:
              raise SystemExit("worker deployment proxy digest env does not match the immutable proxy image reference")
          if worker["spec"]["template"]["spec"].get("nodeSelector", {}).get("kubernetes.io/arch") != "amd64":
              raise SystemExit("worker deployment must target the linux/amd64 image architecture")
          if proxy["spec"]["template"]["spec"].get("nodeSelector", {}).get("kubernetes.io/arch") != "amd64":
              raise SystemExit("proxy deployment must target the linux/amd64 image architecture")
          print("worker/proxy images are digest-pinned, digest env values match, and scheduling targets linux/amd64")
          PY
      - name: Verify canonical capability and sandbox boundaries
        run: |
          node scripts/check-agentic-osint-capability-boundary.mjs
          node scripts/check-python-osint-egress-boundary.mjs
          node scripts/check-workflow-action-pins.mjs

  node-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm run typecheck:libs && pnpm --dir artifacts/api-server run typecheck
      - name: Worker client, tool adapters, and sandbox contracts
        run: pnpm --dir artifacts/api-server exec vitest run src/src/lib/python-osint-worker-client.test.ts src/src/lib/python-tools.test.ts src/src/lib/python-osint-execution-metadata.test.ts src/src/test/python-sandbox-contract.test.ts

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated worker image
        run: docker build --pull -f services/apex-python-osint-worker/Dockerfile -t apex-python-osint-worker:ci .
      - name: Build public-egress proxy image
        run: docker build --pull -f services/apex-python-osint-worker/proxy.Dockerfile -t apex-osint-egress-proxy:ci .
      - name: Smoke-check executor help contracts
        run: |
          docker run --rm --entrypoint /bin/sh apex-python-osint-worker:ci -ec '
            /opt/venvs/holehe/bin/python -c "import holehe.core, trio, httpx"
            /opt/venvs/maigret/bin/maigret --help >/dev/null
            /opt/venvs/sherlock/bin/sherlock --help >/dev/null
            /opt/venvs/theharvester/bin/theHarvester --help >/dev/null
            cd /opt/tools/spiderfoot && /opt/venvs/spiderfoot/bin/python -c "import sf"
          '

  publish-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [contract-tests, node-contract-tests, container-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm Buildx is available
        run: docker buildx version
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish isolated OSINT worker image
        id: worker
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apex-python-osint-worker"
          docker buildx build --platform linux/amd64 --pull --push \
            --tag "$image:$GITHUB_SHA" \
            --metadata-file /tmp/apex-worker-metadata.json \
            -f services/apex-python-osint-worker/Dockerfile .
          digest="$(jq -r '."containerimage.digest"' /tmp/apex-worker-metadata.json)"
          test "$digest" != "null" && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Apex OSINT worker image::$image@$digest"
      - name: Publish restricted-egress proxy image
        id: proxy
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apex-osint-egress-proxy"
          docker buildx build --platform linux/amd64 --pull --push \
            --tag "$image:$GITHUB_SHA" \
            --metadata-file /tmp/apex-proxy-metadata.json \
            -f services/apex-python-osint-worker/proxy.Dockerfile .
          digest="$(jq -r '."containerimage.digest"' /tmp/apex-proxy-metadata.json)"
          test "$digest" != "null" && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Apex OSINT proxy image::$image@$digest"
      - name: Publish immutable deployment references
        run: |
          {
            echo "APEX_PYTHON_OSINT_WORKER_IMAGE=${{ steps.worker.outputs.image }}@${{ steps.worker.outputs.digest }}"
            echo "APEX_PYTHON_OSINT_PROXY_IMAGE=${{ steps.proxy.outputs.image }}@${{ steps.proxy.outputs.digest }}"
            echo "APEX_PYTHON_OSINT_EXPECTED_WORKER_IMAGE_DIGEST=${{ steps.worker.outputs.digest }}"
            echo "APEX_PYTHON_OSINT_EXPECTED_PROXY_IMAGE_DIGEST=${{ steps.proxy.outputs.digest }}"
          } | tee apex-python-osint-image-digests.env
