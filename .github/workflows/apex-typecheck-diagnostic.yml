name: Apex typecheck diagnostic
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  diagnose:
    if: startsWith(github.event.head_commit.message, 'audit: diagnostic typecheck')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          pnpm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cp /tmp/typecheck.log TYPECHECK_DIAGNOSTIC.txt
          cat /tmp/typecheck.log
          echo "$status" > /tmp/status
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TYPECHECK_DIAGNOSTIC.txt
          git commit -m 'audit: record typecheck diagnostic'
          git push
