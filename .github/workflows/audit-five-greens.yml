# Canonical five-green gate: five consecutive fresh full-codebase audits.
name: Five Green Complete Codebase Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-green-complete-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9

jobs:
  audit-1:
    name: Audit 1 — complete codebase
    runs-on: ubuntu-latest
    steps: &audit_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - run: pnpm run check:bureau
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            echo "===== FULL AUDIT TEST: ${test_file} ====="
            pnpm exec vitest run --maxWorkers=1 "${test_file}"
          done
      - run: git diff --exit-code

  audit-2:
    name: Audit 2 — complete codebase
    needs: audit-1
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-3:
    name: Audit 3 — complete codebase
    needs: audit-2
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-4:
    name: Audit 4 — complete codebase
    needs: audit-3
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-5:
    name: Audit 5 — complete codebase
    needs: audit-4
    runs-on: ubuntu-latest
    steps: *audit_steps
