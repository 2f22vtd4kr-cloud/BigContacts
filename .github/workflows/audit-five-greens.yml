# Canonical five-green gate: five consecutive fresh full-codebase audits.
# Gemini Right-hand migration gate: migrate active runtime first, then audit the resulting tree.
name: Five Green Complete Codebase Audit

on:
  push:
    branches: [audit/genuine-five-green-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-green-complete-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 8080
  NODE_ENV: development
  ENABLE_AUTO_PIPELINE: "false"
  APEX_SKIP_SEMANTIC: "1"
  APEX_AGENTIC_CONCURRENCY: "1"
  APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
  APEX_API_AUTH_TOKEN: audit-${{ github.run_id }}-apex-five-green-token

jobs:
  migrate-active-source:
    name: Migrate active Right-hand to Gemini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Replace retired DeepSeek/NVIDIA runtime calls only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/api-server/src')
          replacements=[
            ('./deepseek-case-reasoning','./gemini-right-hand-reasoning'),
            ('./nvidia-nim-case-reasoning','./gemini-right-hand-reasoning'),
            ('deepseek-case-reasoning','gemini-right-hand-reasoning'),
            ('nvidia-nim-case-reasoning','gemini-right-hand-reasoning'),
            ('getDeepSeekCaseReasoningStatus','getGeminiRightHandStatus'),
            ('runDeepSeekCaseReasoning','runGeminiRightHandCaseReasoning'),
            ('runDeepSeekDiscoveryAdvice','runGeminiRightHandDiscoveryAdvice'),
            ('runDeepSeekFreeJson','runGeminiRightHandFreeJson'),
            ('runDeepSeekFinalReview','runGeminiRightHandFinalReview'),
            ('runNvidiaNimFinalReview','runGeminiRightHandFinalReview'),
            ('DeepSeekCaseReasoningResult','GeminiRightHandCaseReasoningResult'),
            ('DeepSeekCaseReasoningStatus','GeminiRightHandStatus'),
            ('DeepSeekDiscoveryAdviceResult','GeminiRightHandDiscoveryAdviceResult'),
            ('DEEPSEEK_CASE_REASONING_MODEL','GEMINI_RIGHT_HAND_MODEL'),
            ('deepseek-ai/deepseek-v4-flash-0731','gemini-3.8-flash'),
            ('nvidia/nemotron-3.5-lightning-30b-a3b','gemini-3.8-flash'),
            ('nvidia/nemotron-3-nano-30b-a3b','gemini-3.8-flash'),
            ('DeepSeek-V4-Flash-0731','Gemini 3.8 Flash'),
            ('DeepSeek via NVIDIA NIM','Gemini Right-hand'),
            ('DeepSeek via NVIDIA Integrate','Gemini Right-hand'),
            ('DeepSeek via Gemini API','Gemini Right-hand'),
            ('Gemini via NVIDIA NIM','Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right Hand','Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right-hand','Gemini Right-hand'),
            ('DeepSeek/NVIDIA','Gemini Right-hand'),
            ('DeepSeek Right-hand','Gemini Right-hand'),
            ('NVIDIA NIM','Gemini Right-hand'),
            ('NVIDIA Integrate','Gemini API'),
            ('deepseek-right-hand-final-review','gemini-right-hand-final-review'),
            ('deepseek-right-hand','gemini-right-hand'),
            ('api.deepseek.com/chat/completions','generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent'),
            ('DEEPSEEK_API_KEY','GEMINI_API_KEY'),
            ('DeepSeek','Gemini'),
            ('deepseek','gemini'),
          ]
          changed=[]
          for p in root.rglob('*'):
            if not p.is_file() or '.git' in p.parts: continue
            try:s=p.read_text()
            except (UnicodeDecodeError,OSError):continue
            old=s
            for a,b in replacements:s=s.replace(a,b)
            if s!=old:
              p.write_text(s); changed.append(str(p))
          for path in ['artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts','artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts']:
            Path(path).unlink(missing_ok=True)
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM|NVIDIA_AGENTIC|NVIDIA_NIM_MODEL|NVIDIA NIM|NVIDIA Integrate|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' artifacts/api-server/src 2>/dev/null; then
            echo 'Active Apex source still contains retired provider references.'
            exit 1
          fi
          echo "Changed ${#changed[@]} active source files."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src
          git diff --cached --stat
          git commit -m 'Migrate all active Apex Right-hand calls to Gemini' || exit 0
          git push

  audit-1:
    name: Audit 1 — complete codebase
    needs: migrate-active-source
    runs-on: ubuntu-latest
    steps: &audit_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Verify retired DeepSeek/NVIDIA runtime paths are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM_API_KEY|NVIDIA_AGENTIC_MODEL|NVIDIA_NIM_MODEL|NVIDIA NIM|NVIDIA Integrate|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' -- artifacts/api-server/src; then
            echo 'Retired DeepSeek/NVIDIA reference found in active Apex runtime source.'
            exit 1
          fi
          test ! -e artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts
          test ! -e artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          grep -qi 'DeepSeek.*no longer part of Apex' docs/BUREAU_REACT_ARCHITECTURE.md
      - name: Assert unified investigator architecture
        run: node scripts/check-unified-investigator-architecture.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Provision local API dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          cd lib/db
          bash ../../scripts/ci-provision-db.sh
      - run: pnpm run check:bureau
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Start API for live smoke tests
        run: |
          set -euo pipefail
          redis-cli ping
          nohup node artifacts/api-server/dist/index.mjs </dev/null > /tmp/apex-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/apex-api.pid
          for i in $(seq 1 60); do
            sleep 1
            if [ "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = "200" ]; then exit 0; fi
          done
          cat /tmp/apex-api.log
          exit 1
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            echo "===== FULL AUDIT TEST: ${test_file} ====="
            pnpm exec vitest run --maxWorkers=1 "${test_file}"
          done
      - name: Restore build-time safety-only source sanitization
        if: always()
        run: git checkout -- artifacts/apex-finder/src/pages/data-sources.tsx
      - run: git diff --exit-code
  audit-2:
    name: Audit 2 — complete codebase
    needs: audit-1
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-3:
    name: Audit 3 — complete codebase
    needs: audit-2
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-4:
    name: Audit 4 — complete codebase
    needs: audit-3
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-5:
    name: Audit 5 — complete codebase
    needs: audit-4
    runs-on: ubuntu-latest
    steps: *audit_steps
