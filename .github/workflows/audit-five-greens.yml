# Canonical five-green gate: five consecutive fresh full-codebase audits.
name: Five Green Complete Codebase Audit

on:
  push:
    branches: [audit/genuine-five-green-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-green-complete-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 8080
  NODE_ENV: development
  ENABLE_AUTO_PIPELINE: "false"
  APEX_SKIP_SEMANTIC: "1"
  APEX_AGENTIC_CONCURRENCY: "1"
  APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
  APEX_API_AUTH_TOKEN: audit-${{ github.run_id }}-apex-five-green-token

jobs:
  prepare-context:
    name: Prepare authoritative context patch when requested
    if: hashFiles('AUDIT_CONTEXT_PATCH_REQUIRED') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Apply lossless context patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('artifacts/api-server/src/src/lib/bureau-agentic-pass.ts'); t=p.read_text(); t=re.sub(r'runIds:\[\.\.\.new Set\(\[\.\.\.\(Array\.isArray\(current\.runIds\).*?input\.runId\]\)\]\)', 'runIds:[...new Set([...(Array.isArray(current.runIds)?current.runIds:[]),input.runId])]', t); p.write_text(t)
          for f in ['artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts','artifacts/api-server/src/src/lib/target-control-decision.ts','artifacts/api-server/src/src/lib/atlas-control-decision.ts','artifacts/api-server/src/src/lib/final-target-review.ts']:
            p=Path(f); t=p.read_text(); t=re.sub(r'\.slice\(-\d+\)','',t); t=re.sub(r'\.slice\(\d+\s*,\s*\d+\)','',t); p.write_text(t)
          p=Path('artifacts/api-server/src/src/lib/agentic-web-research-core.ts'); t=p.read_text(); old='const body = await response.text(); return body.slice(0, MAX_NETWORK_RESPONSE_BYTES);'; new='const body = await response.text(); if (Buffer.byteLength(body, "utf8") > MAX_NETWORK_RESPONSE_BYTES) throw new Error(`Network response exceeds the configured memory safety bound (${MAX_NETWORK_RESPONSE_BYTES} bytes); response was rejected, not truncated.`); return body;'; t=t.replace(old,new,1); p.write_text(t)
          p=Path('artifacts/api-server/src/src/lib/case-bureau.ts'); t=p.read_text()
          for old,new in [('.slice(0, 8)',''),('.slice(0, 12)',''),('.slice(0, 20)',''),('.slice(0, 30)',''),('.slice(0, 40)',''),('.slice(-100)',''),('.slice(-50)',''),('.slice(-30)',''),('.slice(-20)',''),('.slice(0, 100_000)','')]: t=t.replace(old,new)
          t=re.sub(r'return \[\.\.\.new Set\(strings\)\]\.slice\(0, limit\);','return [...new Set(strings)];',t)
          marker='"Gemini Boss text-generation capacity busy; stopping this Boss attempt (not a web-search failure)"'
          if marker in t:
            t=t.replace(marker,'"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"',1); pos=t.index('"Gemini Boss text-generation capacity busy; trying the next compatible Gemini model"'); ret=t.find('          return { model, raw: null, error: lastError };',pos)
            if ret<0: raise SystemExit('Boss transient return missing')
            t=t[:ret]+'          continue;'+t[ret+len('          return { model, raw: null, error: lastError };'):]
          p.write_text(t)
          PY
      - name: Verify source patch and commit it
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'slice\(-[0-9]+\)|slice\([0-9]+, *[0-9]+\)|MAX_TRAJECTORY_RECORDS = 100|MAX_OBS = 5_000' artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/case-bureau.ts
          rm -f AUDIT_CONTEXT_PATCH_REQUIRED
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/src/lib/bureau-agentic-pass.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/case-bureau.ts AUDIT_CONTEXT_PATCH_REQUIRED
          git commit -m 'Close out context integrity and Gemini fallback audit'
          git push origin audit/genuine-five-green-final
  audit-1:
    name: Audit 1 — complete codebase
    needs: prepare-context
    if: always()
    runs-on: ubuntu-latest
    steps: &audit_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Verify retired DeepSeek/NVIDIA runtime paths are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM_API_KEY|NVIDIA_AGENTIC_MODEL|NVIDIA_NIM_MODEL|NVIDIA NIM|NVIDIA Integrate|NVIDIA|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' -- artifacts/api-server/src; then exit 1; fi
          test ! -e artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts
          test ! -e artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts
          grep -qi 'DeepSeek.*no longer part of Apex' docs/BUREAU_REACT_ARCHITECTURE.md
      - name: Assert unified investigator architecture
        run: node scripts/check-unified-investigator-architecture.mjs
      - name: Context integrity — no hard prompt/data clipping
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'slice\(-[0-9]+\)|slice\([0-9]+, *[0-9]+\)|MAX_TRAJECTORY_RECORDS = 100|MAX_OBS = 5_000' -- artifacts/api-server/src/src/lib/agentic-web-research-core.ts artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts artifacts/api-server/src/src/lib/target-control-decision.ts artifacts/api-server/src/src/lib/atlas-control-decision.ts artifacts/api-server/src/src/lib/final-target-review.ts artifacts/api-server/src/src/lib/case-bureau.ts
          grep -q 'trajectoryRecords' artifacts/api-server/src/src/lib/agentic-web-research-core.ts
          grep -q 'trying the next compatible Gemini model' artifacts/api-server/src/src/lib/case-bureau.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Provision local API dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          cd lib/db
          bash ../../scripts/ci-provision-db.sh
      - run: pnpm run check:bureau
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Start API for live smoke tests
        run: |
          set -euo pipefail
          redis-cli ping
          nohup node artifacts/api-server/dist/index.mjs </dev/null > /tmp/apex-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/apex-api.pid
          for i in $(seq 1 60); do sleep 1; if [ "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = "200" ]; then exit 0; fi; done
          cat /tmp/apex-api.log; exit 1
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do echo "===== FULL AUDIT TEST: ${test_file} ====="; pnpm exec vitest run --maxWorkers=1 "${test_file}"; done
      - name: Restore build-time safety-only source sanitization
        if: always()
        run: git checkout -- artifacts/apex-finder/src/pages/data-sources.tsx
      - run: git diff --exit-code
  audit-2:
    name: Audit 2 — complete codebase
    needs: audit-1
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-3:
    name: Audit 3 — complete codebase
    needs: audit-2
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-4:
    name: Audit 4 — complete codebase
    needs: audit-3
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-5:
    name: Audit 5 — complete codebase
    needs: audit-4
    runs-on: ubuntu-latest
    steps: *audit_steps
