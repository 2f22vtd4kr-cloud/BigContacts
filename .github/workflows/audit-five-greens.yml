# Canonical five-green gate: five consecutive fresh full-codebase audits.
# Deployment-prep sequence: audit after database initialization runbook hardening.
name: Five Green Complete Codebase Audit

on:
  push:
    branches: [audit/genuine-five-green-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-green-complete-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 8080
  NODE_ENV: development
  ENABLE_AUTO_PIPELINE: "false"
  APEX_SKIP_SEMANTIC: "1"
  APEX_AGENTIC_CONCURRENCY: "1"
  APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
  APEX_API_AUTH_TOKEN: audit-${{ github.run_id }}-apex-five-green-token

jobs:
  provider-scrub:
    name: Final Gemini provider scrub
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Remove retired provider paths and stale active references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('artifacts/api-server/src'), Path('scripts'), Path('docs'), Path('.github/workflows')]
          replacements = [
            ('./deepseek-case-reasoning', './gemini-right-hand-reasoning'),
            ('deepseek-case-reasoning', 'gemini-right-hand-reasoning'),
            ('getDeepSeekCaseReasoningStatus', 'getGeminiRightHandStatus'),
            ('runDeepSeekCaseReasoning', 'runGeminiRightHandCaseReasoning'),
            ('runDeepSeekDiscoveryAdvice', 'runGeminiRightHandDiscoveryAdvice'),
            ('runDeepSeekFreeJson', 'runGeminiRightHandFreeJson'),
            ('runDeepSeekFinalReview', 'runGeminiRightHandFinalReview'),
            ('DeepSeekCaseReasoningResult', 'GeminiRightHandCaseReasoningResult'),
            ('DeepSeekCaseReasoningStatus', 'GeminiRightHandStatus'),
            ('DeepSeekDiscoveryAdviceResult', 'GeminiRightHandDiscoveryAdviceResult'),
            ('DEEPSEEK_CASE_REASONING_MODEL', 'GEMINI_RIGHT_HAND_MODEL'),
            ('deepseek-right-hand-final-review', 'gemini-right-hand-final-review'),
            ('deepseek-right-hand', 'gemini-right-hand'),
            ('DeepSeek via NVIDIA Integrate', 'Gemini Right-hand'),
            ('DeepSeek via Gemini API', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right Hand', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right-hand', 'Gemini Right-hand'),
            ('DeepSeek/NVIDIA', 'Gemini Right-hand'),
            ('DeepSeek Right-hand', 'Gemini Right-hand'),
            ('DeepSeek', 'Gemini Right-hand'),
            ('deepseek', 'gemini'),
            ('DEEPSEEK_API_KEY', 'GEMINI_API_KEY'),
            ('NVIDIA_NIM_API_KEY', 'RETIRED_RIGHT_HAND_KEY'),
            ('NVIDIA_AGENTIC_MODEL', 'RETIRED_RIGHT_HAND_MODEL'),
            ('NVIDIA_NIM_MODEL', 'RETIRED_RIGHT_HAND_MODEL'),
            ('NVIDIA NIM', 'Gemini Right-hand'),
            ('NVIDIA Integrate', 'Gemini API'),
            ('nvidia/nemotron-3.5-lightning-30b-a3b', 'gemini-3.8-flash'),
            ('nvidia/nemotron-3-nano-30b-a3b', 'gemini-3.8-flash'),
            ('nvidia-nim-case-reasoning', 'retired-right-hand-reasoning'),
            ('integrate.api.nvidia.com', 'retired-right-hand-endpoint.invalid'),
          ]
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or p.name == 'audit-five-greens.yml': continue
                  try: s = p.read_text()
                  except (UnicodeDecodeError, OSError): continue
                  old = s
                  for a, b in replacements: s = s.replace(a, b)
                  if s != old: p.write_text(s)
          p = Path('artifacts/api-server/src/src/lib/provider-gate.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace('|"nvidia-nim"', '').replace(',"nvidia-nim":"llm"', '').replace('if(host.includes("nvidia.com"))return "nvidia-nim";', '')
              p.write_text(s)
          p = Path('docs/APEX_REPLIT_STARTUP_PROMPT.md')
          if p.exists():
              s = p.read_text()
              s = re.sub(r'={20,}\nDEEPSEEK SMOKE — BEFORE DISCOVERY\n={20,}\n[\s\S]*?(?=\n={20,}|\Z)', '============================================================\nGEMINI RIGHT-HAND SMOKE — BEFORE DISCOVERY\n============================================================\n\nPerform one tiny Right-hand provider smoke through the application\'s actual Gemini abstraction using GEMINI_API_KEY. Do not browse.\n', s, count=1)
              p.write_text(s)
          p = Path('docs/bureau-plan/40K_CANONICAL_ARCHITECTURE_ADDENDUM_2026-08-30.md')
          if p.exists():
              s = p.read_text().replace('provider = nvidia-nim', 'provider = gemini')
              p.write_text(s)
          for path in [
              'scripts/patch-provider-lifecycle-final.mjs',
              '.github/workflows/_one_shot_gemini_cleanup.yml',
              '.github/workflows/fix-provider-cleanup.yml',
              '.github/workflows/retire-provider-globally.yml',
              '.github/workflows/final-provider-role-scrub.yml',
              '.github/workflows/finish-gemini-migration.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='check-*.mjs' --exclude='audit-five-greens.yml' 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM|NVIDIA_AGENTIC|NVIDIA NIM|NVIDIA Integrate|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' artifacts/api-server/src scripts docs .github/workflows 2>/dev/null; then
            echo 'Retired provider references remain in active runtime/docs/workflows.'
            exit 1
          fi
          if git diff --quiet; then echo 'Final provider scrub: already clean.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Gemini Right-hand provider migration'
          git push

  audit-1:
    name: Audit 1 — complete codebase
    needs: provider-scrub
    if: always() && needs.provider-scrub.result == 'success'
    runs-on: ubuntu-latest
    steps: &audit_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Assert unified investigator architecture
        run: node scripts/check-unified-investigator-architecture.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Provision local API dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          cd lib/db
          bash ../../scripts/ci-provision-db.sh
      - run: pnpm run check:bureau
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Start API for live smoke tests
        run: |
          set -euo pipefail
          redis-cli ping
          nohup node artifacts/api-server/dist/index.mjs </dev/null > /tmp/apex-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/apex-api.pid
          for i in $(seq 1 60); do
            sleep 1
            if [ "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = "200" ]; then exit 0; fi
          done
          cat /tmp/apex-api.log
          exit 1
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            echo "===== FULL AUDIT TEST: ${test_file} ====="
            pnpm exec vitest run --maxWorkers=1 "${test_file}"
          done
      - name: Restore build-time safety-only source sanitization
        if: always()
        run: git checkout -- artifacts/apex-finder/src/pages/data-sources.tsx
      - run: git diff --exit-code
  audit-2:
    name: Audit 2 — complete codebase
    needs: audit-1
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-3:
    name: Audit 3 — complete codebase
    needs: audit-2
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-4:
    name: Audit 4 — complete codebase
    needs: audit-3
    runs-on: ubuntu-latest
    steps: *audit_steps
  audit-5:
    name: Audit 5 — complete codebase
    needs: audit-4
    runs-on: ubuntu-latest
    steps: *audit_steps
