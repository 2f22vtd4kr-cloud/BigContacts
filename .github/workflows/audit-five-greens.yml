name: Five Green Current-Main Audit

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/apex-finder/**"
      - "scripts/**"
      - "lib/db/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-green-current-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-ssrf:
    name: Green 1 — SSRF boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @workspace/api-server... --registry=https://registry.npmjs.org/
      - run: pnpm --dir artifacts/api-server exec vitest run src/src/test/ssrf-safe-fetch.test.ts

  autonomy:
    name: Green 2 — autonomy contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @workspace/api-server... --registry=https://registry.npmjs.org/
      - run: |
          pnpm run check:no-force-dig
          pnpm run check:agentic-runtime
          node scripts/check-agentic-timeout.mjs
          node scripts/check-api-auth-boundary.mjs
          node scripts/check-retired-research-routes.mjs

  discovery:
    name: Green 3 — discovery/runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @workspace/api-server... --registry=https://registry.npmjs.org/
      - run: |
          pnpm run check:discovery-quality
          pnpm run check:trajectory
          pnpm run check:comparison-contract
          pnpm --dir artifacts/api-server exec vitest run src/src/test/discovery-agent-parse.test.ts src/src/test/discovery-runtime-correctness.test.ts

  provenance:
    name: Green 4 — provenance/persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @workspace/api-server... --registry=https://registry.npmjs.org/
      - run: pnpm --dir artifacts/api-server exec vitest run src/src/test/agentic-source-provenance.test.ts src/src/test/bureau-contact-persist-strict.test.ts

  workflow-integrity:
    name: Green 5 — workflow integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node scripts/check-workflow-action-pins.mjs
      - run: node scripts/check-api-auth-boundary.mjs
