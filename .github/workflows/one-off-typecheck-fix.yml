name: One-off Typecheck Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-typecheck-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply exact typecheck fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts": [
                  ('metadata: JSON.stringify({ reviewOnly: true, admission: "investigator-explicit-promotion", sourceUrl, discoveryCaseId })', 'metadata: JSON.stringify({ reviewOnly: true, admission: "investigator-explicit-promotion", sourceUrl, discoveryCaseId: input.discoveryCaseId })'),
                  ('sourceUrls: discovery.findings.flatMap((finding) => finding.sourceUrls).slice(0, 20)', 'sourceUrls: (discovery.findings ?? []).flatMap((finding) => finding.sourceUrls).slice(0, 20)'),
              ],
              "artifacts/api-server/src/src/lib/provider-gate.ts": [
                  ('await acquireConcurrency(provider, init?.signal);', 'await acquireConcurrency(provider, init?.signal ?? undefined);'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {filename}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text)

          Path(".github/workflows/one-off-typecheck-fix.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/lib/provider-gate.ts .github/workflows/one-off-typecheck-fix.yml
          git commit -m "fix: close remaining strict typecheck errors"
          git push origin HEAD:main
