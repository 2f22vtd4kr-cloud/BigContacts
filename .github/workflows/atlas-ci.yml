name: Atlas CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: atlas-ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_local_dev
          POSTGRES_DB: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U apex -d apex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Typecheck workspace libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: API regression suite
        run: pnpm --filter @workspace/api-server test

      - name: API build
        run: pnpm --filter @workspace/api-server build
