name: One-off Typecheck Final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-typecheck-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply final strict typecheck repairs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts": [
                  ('const finding = discovery.findings.find((item)', 'const finding = (discovery.findings ?? []).find((item)'),
              ],
              "artifacts/api-server/src/src/lib/provider-gate.ts": [
                  ('const waiter: Waiter = { provider, resolve, reject, signal };', 'const waiter: Waiter = { provider, resolve, reject, signal: signal ?? undefined };'),
              ],
              "artifacts/api-server/src/src/test/api-auth.test.ts": [
                  ('response.status = ((code: number) => { response.statusCode = code; return response; }) as Response["status"];', 'response.status = ((code: number): TestResponse => { response.statusCode = code; return response; }) as unknown as Response["status"];'),
                  ('response.json = ((body: unknown) => { response.jsonBody = body; return response; }) as Response["json"];', 'response.json = ((body: unknown): TestResponse => { response.jsonBody = body; return response; }) as unknown as Response["json"];'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {filename}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text)
          Path(".github/workflows/one-off-typecheck-final.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/lib/provider-gate.ts artifacts/api-server/src/src/test/api-auth.test.ts .github/workflows/one-off-typecheck-final.yml
          git commit -m "fix: finish strict typecheck boundary repairs"
          git push origin HEAD:main
