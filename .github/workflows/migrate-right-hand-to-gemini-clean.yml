name: migrate-right-hand-to-gemini-clean
on:
  push:
    branches:
      - audit/genuine-five-green-final
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.author.name != 'gemini-right-hand-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Implement Gemini Right-hand architecture
        shell: bash
        run: |
          set -euo pipefail

          cat > artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts <<'EOF'
          import type { BureauAction, DiscoveryCaseFile, ResearchCaseFile } from "./case-bureau";
          import { installGeminiTransientRetry } from "./gemini-transient-retry";

          export const GEMINI_RIGHT_HAND_MODEL = "gemini-3.8-flash";
          const GEMINI_GENERATE_API = "https://generativelanguage.googleapis.com/v1beta/models";
          const REQUEST_TIMEOUT_MS = 45_000;
          const MAX_RETRIES = 2;

          type GeminiResponse = { candidates?: Array<{ content?: { parts?: Array<{ text?: string }> } }> };
          type GeminiResult = { raw: string; error: string | null };

          export type GeminiRightHandStatus = {
            configured: boolean;
            model: string;
            endpoint: string;
            role: "right_hand_advisor";
            capability: "case_file_reasoning_only";
          };
          export type GeminiRightHandCaseReasoningResult = {
            status: "completed" | "unavailable";
            model: string;
            actionId: string | null;
            decision: string | null;
            reason: string | null;
            confidence: number | null;
            error: string | null;
          };
          export type GeminiRightHandDiscoveryAdviceResult = {
            status: "completed" | "unavailable";
            model: string;
            decision: string | null;
            reason: string | null;
            focusLanes: string[];
            confidence: number | null;
            error: string | null;
          };

          function key(): string | null { return process.env.GEMINI_API_KEY?.trim() || null; }
          function textOf(payload: GeminiResponse): string { return (payload.candidates?.[0]?.content?.parts ?? []).map((part) => part.text ?? "").join("\n").trim(); }
          function extractJson(raw: string): Record<string, unknown> | null {
            const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i)?.[1]?.trim();
            const source = fenced || raw.trim();
            const start = source.indexOf("{"), end = source.lastIndexOf("}");
            if (start < 0 || end <= start) return null;
            try { const value = JSON.parse(source.slice(start, end + 1)); return value && typeof value === "object" ? value as Record<string, unknown> : null; } catch { return null; }
          }

          async function request(system: string, user: string): Promise<GeminiResult> {
            const apiKey = key();
            if (!apiKey) return { raw: "", error: "GEMINI_API_KEY is not configured." };
            installGeminiTransientRetry();
            const url = `${GEMINI_GENERATE_API}/${encodeURIComponent(GEMINI_RIGHT_HAND_MODEL)}:generateContent?key=${encodeURIComponent(apiKey)}`;
            let lastError = "Gemini Right-hand request failed.";
            for (let attempt = 0; attempt <= MAX_RETRIES; attempt += 1) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
              try {
                const response = await fetch(url, {
                  method: "POST",
                  headers: { Accept: "application/json", "Content-Type": "application/json" },
                  body: JSON.stringify({
                    systemInstruction: { parts: [{ text: system }] },
                    contents: [{ role: "user", parts: [{ text: user }] }],
                    generationConfig: { temperature: 0, maxOutputTokens: 2048, responseMimeType: "application/json" },
                  }),
                  signal: controller.signal,
                });
                const body = await response.text();
                if (response.ok) {
                  try {
                    const raw = textOf(JSON.parse(body) as GeminiResponse);
                    if (raw) return { raw, error: null };
                    lastError = "Gemini Right-hand returned an empty response.";
                  } catch { lastError = "Gemini Right-hand returned invalid JSON."; }
                  break;
                }
                lastError = `Gemini API ${GEMINI_RIGHT_HAND_MODEL} HTTP ${response.status}${body ? `: ${body.slice(0, 300)}` : ""}`;
                const transient = response.status === 408 || response.status === 429 || response.status >= 500;
                if (!transient || attempt >= MAX_RETRIES) break;
                await new Promise((resolve) => setTimeout(resolve, 500 * 2 ** attempt));
              } catch (error) {
                lastError = error instanceof Error && error.name === "AbortError" ? `Gemini Right-hand request timed out after ${REQUEST_TIMEOUT_MS}ms.` : error instanceof Error ? error.message : "Gemini Right-hand request failed.";
                if (attempt >= MAX_RETRIES) break;
                await new Promise((resolve) => setTimeout(resolve, 500 * 2 ** attempt));
              } finally { clearTimeout(timer); }
            }
            return { raw: "", error: lastError };
          }

          function compactCase(file: ResearchCaseFile): string {
            return JSON.stringify({ target: file.target, hypotheses: file.hypotheses?.slice(-12), evidenceSummary: file.evidenceSummary, specialistRoster: file.specialistRoster, actionQueue: file.actionQueue, contactRoutes: file.contactRoutes?.slice(-16), investigationProgress: file.investigationProgress, researchDepth: file.researchDepth, decisionLog: file.decisionLog?.slice(-8), rightHandAdvice: file.rightHandAdvice, bossPlan: file.bossPlan }, null, 2);
          }
          function compactDiscovery(file: DiscoveryCaseFile): string {
            return JSON.stringify({ humanBrief: file.humanBrief, bossPremise: file.bossPremise, candidateLanes: file.candidateLanes, initialResearch: file.initialResearch, investigatorReports: file.investigatorReports?.slice(-10), currentProgress: file.currentProgress, discoveredCandidates: file.discoveredCandidates?.slice(-20), orgFootprint: file.orgFootprint, decisionLog: file.decisionLog?.slice(-8) }, null, 2);
          }
          export function getGeminiRightHandStatus(): GeminiRightHandStatus { return { configured: Boolean(key()), model: GEMINI_RIGHT_HAND_MODEL, endpoint: GEMINI_GENERATE_API, role: "right_hand_advisor", capability: "case_file_reasoning_only" }; }

          export async function runGeminiRightHandCaseReasoning(input: { file: ResearchCaseFile; iteration: number }): Promise<GeminiRightHandCaseReasoningResult> {
            const queued = input.file.actionQueue.filter((action) => action.status === "queued").slice(0, 16);
            const system = "You are Apex Atlas Right Hand. Reason only over the supplied case file. Never browse, invent evidence, contacts, people, URLs, or facts. You are oversight, not an Investigator. Recommend exactly one existing queued action. Return JSON only.";
            const user = `${system}\n\nIteration ${input.iteration}. Identify what is newly unresolved, which contact vectors are still pending, and the highest-leverage complementary queued action.\nCASE:\n${compactCase(input.file)}\n\nQUEUED ACTIONS:\n${JSON.stringify(queued, null, 2)}\n\nReturn {"actionId":"exact queued id","decision":"short recommendation","reason":"concrete evidence-gap reason","confidence":0.0}.`;
            const result = await request(system, user);
            if (result.error) return { status: "unavailable", model: GEMINI_RIGHT_HAND_MODEL, actionId: null, decision: null, reason: null, confidence: null, error: result.error };
            const parsed = extractJson(result.raw);
            const actionId = typeof parsed?.actionId === "string" ? parsed.actionId.trim() : "";
            const action = queued.find((candidate: BureauAction) => candidate.id === actionId);
            const decision = typeof parsed?.decision === "string" ? parsed.decision.trim() : "";
            const reason = typeof parsed?.reason === "string" ? parsed.reason.trim() : "";
            const confidence = typeof parsed?.confidence === "number" && Number.isFinite(parsed.confidence) ? Math.max(0, Math.min(1, parsed.confidence)) : null;
            if (!action || !decision || !reason) return { status: "unavailable", model: GEMINI_RIGHT_HAND_MODEL, actionId: null, decision: null, reason: null, confidence, error: "Gemini Right-hand returned an invalid or non-queued recommendation." };
            return { status: "completed", model: GEMINI_RIGHT_HAND_MODEL, actionId: action.id, decision: decision.slice(0, 500), reason: reason.slice(0, 1000), confidence, error: null };
          }

          export async function runGeminiRightHandDiscoveryAdvice(input: { file: DiscoveryCaseFile; iteration: number }): Promise<GeminiRightHandDiscoveryAdviceResult> {
            const system = "You are Apex Atlas Right Hand for public-record discovery. Reason only over supplied evidence. Never invent people, contacts, relationships, or URLs. You are oversight, not an Investigator. Return JSON only.";
            const user = `${system}\n\nIteration ${input.iteration}. Recommend the most useful next research direction from the existing discovery frontier.\nDISCOVERY CASE:\n${compactDiscovery(input.file)}\n\nReturn {"decision":"...","reason":"...","focusLanes":["..."],"confidence":0.0}.`;
            const result = await request(system, user);
            if (result.error) return { status: "unavailable", model: GEMINI_RIGHT_HAND_MODEL, decision: null, reason: null, focusLanes: [], confidence: null, error: result.error };
            const parsed = extractJson(result.raw);
            if (!parsed) return { status: "unavailable", model: GEMINI_RIGHT_HAND_MODEL, decision: null, reason: null, focusLanes: [], confidence: null, error: "Gemini Right-hand returned invalid discovery JSON." };
            return { status: "completed", model: GEMINI_RIGHT_HAND_MODEL, decision: typeof parsed.decision === "string" ? parsed.decision.slice(0, 800) : null, reason: typeof parsed.reason === "string" ? parsed.reason.slice(0, 1200) : null, focusLanes: Array.isArray(parsed.focusLanes) ? parsed.focusLanes.filter((value): value is string => typeof value === "string").slice(0, 8) : [], confidence: typeof parsed.confidence === "number" ? Math.max(0, Math.min(1, parsed.confidence)) : null, error: null };
          }

          export async function runGeminiRightHandFreeJson(userPrompt: string, systemExtra = "Reply with ONE JSON object only. Never invent contacts, people, or URLs."): Promise<{ status: "completed" | "unavailable"; model: string; raw: string | null; error: string | null }> {
            const result = await request(systemExtra, userPrompt);
            return result.raw ? { status: "completed", model: GEMINI_RIGHT_HAND_MODEL, raw: result.raw, error: null } : { status: "unavailable", model: GEMINI_RIGHT_HAND_MODEL, raw: null, error: result.error };
          }
          export async function runGeminiRightHandFinalReview(prompt: string): Promise<{ status: "completed" | "unavailable"; model: string; raw: string | null; error: string | null }> {
            return runGeminiRightHandFreeJson(prompt, "You are the Apex Atlas Right Hand reviewing final public-contact evidence. Return ONE JSON object only. Never invent contacts, people, or URLs.");
          }
          export type GeminiRightHandResultAction = BureauAction;
          EOF

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'artifacts/api-server/src/src/lib/atlas-control-decision.ts': [
              ('./deepseek-case-reasoning', './gemini-right-hand-reasoning'),
              ('runDeepSeekFreeJson', 'runGeminiRightHandFreeJson'),
              ('DeepSeek/NVIDIA is Right Hand Advisor', 'Gemini is Right Hand Advisor'),
              ('You are the DeepSeek/NVIDIA Right-hand.', 'You are the Gemini Right-hand.'),
              ('DeepSeek/NVIDIA Right Hand was unavailable', 'Gemini Right Hand was unavailable'),
            ],
            'artifacts/api-server/src/src/lib/case-bureau.ts': [
              ('./deepseek-case-reasoning', './gemini-right-hand-reasoning'),
              ('getDeepSeekCaseReasoningStatus', 'getGeminiRightHandStatus'),
              ('runDeepSeekCaseReasoning', 'runGeminiRightHandCaseReasoning'),
              ('runDeepSeekDiscoveryAdvice', 'runGeminiRightHandDiscoveryAdvice'),
              ('runDeepSeekFreeJson', 'runGeminiRightHandFreeJson'),
              ('runDeepSeekFinalReview', 'runGeminiRightHandFinalReview'),
              ('DEEPSEEK_CASE_REASONING_MODEL', 'GEMINI_RIGHT_HAND_MODEL'),
              ('DeepSeekCaseReasoningResult', 'GeminiRightHandCaseReasoningResult'),
              ('DeepSeekCaseReasoningStatus', 'GeminiRightHandStatus'),
              ('DeepSeekDiscoveryAdviceResult', 'GeminiRightHandDiscoveryAdviceResult'),
              ('DeepSeekResultAction', 'GeminiRightHandResultAction'),
              ('provider: "deepseek"', 'provider: "gemini"'),
              ('lane: "deepseek-right-hand"', 'lane: "gemini-right-hand"'),
              ('DeepSeek-V4-Flash-0731', 'Gemini 3.8 Flash'),
              ('DeepSeek-V4-Flash', 'Gemini 3.8 Flash'),
              ('deepseek-right-hand', 'gemini-right-hand'),
              ('Explicit coordination with DeepSeek', 'Explicit coordination with Gemini Right-hand'),
            ],
          }
          for name, pairs in replacements.items():
            p = Path(name); text = p.read_text()
            for old, new in pairs: text = text.replace(old, new)
            p.write_text(text)

          # Remove the obsolete adapter and any exact provider-key list entry.
          Path('artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts').unlink(missing_ok=True)
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.suffix not in {'.ts','.tsx','.js','.mjs','.json','.md','.yml','.yaml','.env',''}: continue
            try: text = p.read_text()
            except UnicodeDecodeError: continue
            text = text.replace('DEEPSEEK_API_KEY', 'GEMINI_API_KEY') if 'DEEPSEEK_API_KEY' in text and 'GEMINI_API_KEY' not in text else text
            text = text.replace('NVIDIA_NIM_API_KEY', '')
            if text != p.read_text(): p.write_text(text)
          PY

          rm -f .github/workflows/migrate-right-hand-to-gemini.yml .github/workflows/migrate-right-hand-to-gemini-clean.yml

          # Architecture documentation: retain an explicit historical removal statement,
          # but never describe the removed provider as an active role.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/BUREAU_REACT_ARCHITECTURE.md')
          t=p.read_text()
          t=t.replace('Right-hand = DeepSeek via NVIDIA NIM.', 'Right-hand = Gemini via the canonical Gemini API. The former DeepSeek/NVIDIA NIM dependency has been removed from Apex.')
          t=t.replace('Right-hand = DeepSeek', 'Right-hand = Gemini')
          t=t.replace('DeepSeek/NVIDIA', 'former DeepSeek/NVIDIA')
          t=t.replace('DeepSeek', 'the former Right-hand provider')
          p.write_text(t)
          PY

          # The canonical architecture check must assert the new two-Gemini oversight layer.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-unified-investigator-architecture.mjs'); t=p.read_text()
          t=t.replace('DeepSeek is present in the Investigator adapter pool; DeepSeek must remain Right-hand only.', 'A removed provider is present in the Investigator adapter pool; oversight providers must remain separate from Investigators.')
          t=t.replace('/resolveGeminiBossModel\\s*\\(/.test(source.atlasControl) && /runDeepSeekFreeJson\\s*\\(/.test(source.atlasControl), "Atlas transition control does not use Gemini Boss plus DeepSeek Right-hand oversight.");', '/resolveGeminiBossModel\\s*\\(/.test(source.atlasControl) && /runGeminiRightHandFreeJson\\s*\\(/.test(source.atlasControl), "Atlas transition control does not use Gemini Boss plus Gemini Right-hand oversight.");')
          t=t.replace('assert(/Gemini/.test(source.architecture) && /DeepSeek/.test(source.architecture) && /Investigator LLM pool/.test(source.architecture), "Canonical ReAct architecture document is missing the two-layer role law.");', 'assert(/Boss\\s*=\\s*Gemini/.test(source.architecture) && /Right-hand\\s*=\\s*Gemini/.test(source.architecture) && /Investigator LLM pool/.test(source.architecture), "Canonical ReAct architecture document is missing the two-layer role law.");')
          t=t.replace('console.log("- Gemini remains Boss only");\nconsole.log("- DeepSeek remains Right-hand only");', 'console.log("- Gemini is Boss and Gemini is Right-hand oversight");\nconsole.log("- The former DeepSeek/NVIDIA provider is absent from active Apex execution");')
          t=t.replace('Atlas transition is selected by Gemini after DeepSeek advice', 'Atlas transition is selected by Gemini after independent Gemini Right-hand advice')
          p.write_text(t)
          PY

          # No active code or configuration may reference the removed provider.
          if git grep -n -i -E '(^|[^a-z])deepseek([^a-z]|$)|api\\.deepseek\\.com|deepseek-ai/|NVIDIA_NIM_API_KEY' -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml'; then
            echo 'ERROR: active DeepSeek/NVIDIA references remain'
            exit 1
          fi
          git diff --check
          git config user.name 'gemini-right-hand-migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: replace DeepSeek Right-hand with Gemini'
          git push origin audit/genuine-five-green-final
