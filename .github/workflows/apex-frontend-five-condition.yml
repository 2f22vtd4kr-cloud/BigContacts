name: Apex frontend five-condition gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apex-frontend-five-condition
  cancel-in-progress: false

jobs:
  frontend-five:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.15.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Condition 1 — sidebar decorative indicators are absent
        run: node scripts/check-apex-frontend-polish.mjs
      - name: Condition 2 — lower sidebar occupies the available rail
        run: node scripts/check-apex-frontend-polish.mjs
      - name: Condition 3 — desktop shell has no rail-overlap compensation
        run: node scripts/check-apex-frontend-polish.mjs
      - name: Condition 4 — responsive shell remains bounded
        run: node scripts/check-frontend-responsive.mjs
      - name: Condition 5 — whole-desk frontend integrity and build
        run: pnpm --filter @workspace/apex-finder build
