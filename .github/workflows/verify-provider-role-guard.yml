name: verify provider role guard
on:
  push:
    branches: [apex/provider-role-guard-fix]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run check:provider-role-docs
      - name: remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-provider-role-guard.yml
          git commit -m 'chore: remove provider role guard verification workflow'
          git push