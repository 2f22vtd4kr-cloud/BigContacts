name: apply-investigator-promotion-truth
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-investigator-promotion-truth.mjs"
      - ".github/workflows/apply-investigator-promotion-truth.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: |
          set -euo pipefail
          node scripts/apply-p0-incremental-admit.mjs || true
          node scripts/apply-roadmap-remaining.mjs || true
          node scripts/apply-investigator-promotion-truth.mjs
          node scripts/apply-mobile-span-live-feed.mjs || true
          grep -q 'investigator_promotion_decision\|INVESTIGATOR_PROMOTION' artifacts/api-server/src/src/lib/discovery-agent.ts
          grep -q 'SEARCH_PROVIDER\|provider: "serper"' artifacts/api-server/src/src/lib/agentic-web-research.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/*.ts artifacts/apex-finder/src/components/mobile-reactor-flow.tsx || true
          if git diff --cached --quiet; then echo no-changes; else
            git commit -m "fix(architecture): investigator decides promotion; search provider truth"
            git push
          fi
