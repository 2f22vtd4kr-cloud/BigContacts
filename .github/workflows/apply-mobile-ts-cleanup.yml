name: apply mobile Reactor type cleanup

on:
  push:
    branches: [apex/mobile-ts-cleanup]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch narrow TypeScript contract issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/apex-finder/src/components/mobile-reactor-flow.tsx')
          s = p.read_text()
          old = '  runStatus: "running" | "done" | "failed";'
          new = '  runStatus: "running" | "paused" | "done" | "failed" | "cancelled";'
          if old not in s: raise SystemExit('mobile runStatus type anchor missing')
          s = s.replace(old, new, 1)
          old = '''    if (!isLive) {\n      wasLiveRef.current = false;\n      setArming(false);\n    }\n  }, [isLive, forceArming]);'''
          new = '''    if (!isLive) {\n      wasLiveRef.current = false;\n      setArming(false);\n    }\n    return undefined;\n  }, [isLive, forceArming]);'''
          if old not in s: raise SystemExit('arming effect anchor missing')
          s = s.replace(old, new, 1)
          old = '''    }\n    prevEventCountRef.current = n;\n  }, [deskEvents.length]);'''
          new = '''    }\n    prevEventCountRef.current = n;\n    return undefined;\n  }, [deskEvents.length]);'''
          if old not in s: raise SystemExit('event count effect anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/apex-finder/src/components/mobile-reactor-flow.tsx
          git rm .github/workflows/apply-mobile-ts-cleanup.yml
          git commit -m 'fix: align mobile Reactor status types'
          git push