name: one-time evidence boundary verification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'apex/evidence-card-boundary-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Enforce evidence-only legacy projector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('artifacts/api-server/src/src/lib/bureau-contact-persist.ts')
          s = p.read_text()
          changed = False

          auto_re = re.compile(r'  // Dig bag → card: promote best non-issuer phone/email onto the entity so.*?\n  return rows\.length;', re.S)
          matches = auto_re.findall(s)
          if len(matches) > 1:
              raise SystemExit(f'expected at most one legacy auto-promotion block, found {len(matches)}')
          if matches:
              s = auto_re.sub('  // Evidence persistence ends here. Card mutation belongs exclusively to the\n  // explicit investigator-selected promotion boundary.\n  return rows.length;', s, count=1)
              changed = True

          generated_re = re.compile(r'    // related-person without URL: attach issuer EDGAR search when company known; else drop\n.*?\n    const collision = assessIdentityCollision\(', re.S)
          gm = generated_re.search(s)
          if gm:
              replacement = '    // Missing exact source pages are not provenance. Do not manufacture search URLs.\n\n    const collision = assessIdentityCollision('
              s = s[:gm.start()] + replacement + s[gm.end():]
              changed = True
          elif 'efts.sec.gov/LATEST/search-index' in s:
              raise SystemExit('generated query provenance remains but its known block was not matched')

          rehydrate_re = re.compile(r'/\*\* Rehydrate entity cards from durable contact_evidence \(no new dig\)\. \*/\nexport async function rehydrateEntityCardFromEvidence\(entityId: number\): Promise<boolean> \{.*?\n\}', re.S)
          replacement_rehydrate = '''/**
          * Legacy rehydration is intentionally disabled.
          * Durable evidence is not a promotion decision; only the canonical investigator
          * promotion boundary may mutate an entity card.
          */
          export async function rehydrateEntityCardFromEvidence(_entityId: number): Promise<boolean> {
            return false;
          }'''
          rm = rehydrate_re.search(s)
          if rm and 'return false;' not in rm.group(0):
              s = s[:rm.start()] + replacement_rehydrate + s[rm.end():]
              changed = True

          p.write_text(s)
          PY
          git diff --check
          if grep -n "promoteBureauContactsToEntityCard(entityId" artifacts/api-server/src/src/lib/bureau-contact-persist.ts; then exit 1; fi
          if grep -n "efts.sec.gov/LATEST/search-index" artifacts/api-server/src/src/lib/bureau-contact-persist.ts; then exit 1; fi
          git diff --check
          git diff --stat
      - name: Run focused promotion/provenance tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts src/src/test/agentic-scope-boundary.test.ts src/src/test/investigator-promotion-contract.test.ts
      - name: Commit branch hardening when needed
        run: |
          if git diff --quiet -- artifacts/api-server/src/src/lib/bureau-contact-persist.ts; then
            echo 'legacy boundary already hardened'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/bureau-contact-persist.ts
          git commit -m 'fix: enforce explicit evidence to card promotion boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}