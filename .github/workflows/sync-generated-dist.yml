name: Sync generated API dist

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/package.json"
      - "artifacts/apex-finder/src/pages/data-sources.tsx"
      - "artifacts/apex-finder/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - ".github/workflows/sync-generated-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-dist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @workspace/api-server... --filter apex-finder-local... --registry=https://registry.npmjs.org/
      - name: Canonicalize Investigator UI safety boundary
        run: pnpm --dir artifacts/apex-finder run build
      - name: Build generated API dist
        run: pnpm --dir artifacts/api-server run build
      - name: Commit canonical source and generated dist only
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated outputs already match the canonical build."
            exit 0
          fi
          if git diff --name-only | grep -v -E '^(artifacts/api-server/dist/|artifacts/apex-finder/dist/)$' | grep -q .; then
            echo "Build mutated files outside generated output; refusing to commit them."
            git diff --name-only
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/dist artifacts/apex-finder/dist
          git commit -m "chore: sync generated outputs"
          git push origin HEAD:main
