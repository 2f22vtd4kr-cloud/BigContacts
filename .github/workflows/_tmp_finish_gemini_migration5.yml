name: _tmp_finish_gemini_migration5
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, 'finish Gemini Right-hand source cleanup v5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: audit/genuine-five-green-final, fetch-depth: 0}
      - name: Apply exact replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          p=root/'artifacts/api-server/src/src/lib/case-bureau.ts'; s=p.read_text()
          reps={
            './deepseek-case-reasoning':'./gemini-right-hand-reasoning',
            'getDeepSeekCaseReasoningStatus':'getGeminiRightHandStatus',
            'runDeepSeekCaseReasoning':'runGeminiRightHandCaseReasoning',
            'runDeepSeekDiscoveryAdvice':'runGeminiRightHandDiscoveryAdvice',
            'runDeepSeekFreeJson':'runGeminiRightHandFreeJson',
            'runDeepSeekFinalReview':'runGeminiRightHandFinalReview',
            'DEEPSEEK_CASE_REASONING_MODEL':'GEMINI_RIGHT_HAND_MODEL',
            'DeepSeekCaseReasoningResult':'GeminiRightHandCaseReasoningResult',
            'DeepSeekCaseReasoningStatus':'GeminiRightHandStatus',
            'DeepSeekDiscoveryAdviceResult':'GeminiRightHandDiscoveryAdviceResult',
            'DeepSeek-V4-Flash-0731':'Gemini 3.8 Flash',
            'deepseek-right-hand':'gemini-right-hand',
            'provider: "deepseek"':'provider: "gemini"',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          if re.search(r'(?i)deepseek',s): raise SystemExit('case-bureau still contains DeepSeek')
          p.write_text(s)

          # Ensure the Right-hand always installs the bounded Gemini retry wrapper when imported directly.
          p=root/'artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts'; s=p.read_text()
          if 'installGeminiTransientRetry' not in s:
            s=s.replace('import type { BureauAction, DiscoveryCaseFile, ResearchCaseFile } from "./case-bureau";','import type { BureauAction, DiscoveryCaseFile, ResearchCaseFile } from "./case-bureau";\nimport { installGeminiTransientRetry } from "./gemini-transient-retry";\n\ninstallGeminiTransientRetry();',1)
          p.write_text(s)

          # Live audits: remove obsolete env entries and replace only the provider-specific probe with Gemini Right-hand.
          p=root/'.github/workflows/apex-live-audit.yml'; s=p.read_text()
          s=s.replace('      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}\n','').replace('      DEEPSEEK_MODEL: deepseek-ai/deepseek-v4-flash-0731\n','')
          old="digReady=groq||mistral; await probe('https://integrate.api.nvidia.com/v1/chat/completions',process.env.DEEPSEEK_API_KEY,process.env.DEEPSEEK_MODEL||'deepseek-ai/deepseek-v4-flash-0731','nvidia-right-hand');"
          if old not in s: raise SystemExit('live audit NVIDIA probe not found')
          s=s.replace(old,'digReady=groq||mistral;',1)
          old2="const keys=[process.env.GEMINI_API_KEY,...Array.from({length:13},(_,i)=>process.env[`GEMINI_API_KEY_${i+1}`])].filter(Boolean); let bossReady=false;"
          new2=old2+" let rightHandReady=false;"
          if old2 not in s: raise SystemExit('live audit Gemini boss probe not found')
          s=s.replace(old2,new2,1)
          old3="console.log(JSON.stringify({digReady,bossReady,results},null,2)); if(!digReady || !bossReady){"
          probe="for(const key of keys){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply READY only.'}]}],generationConfig:{maxOutputTokens:8}}),signal:AbortSignal.timeout(15000)});await r.text();results.push({provider:'gemini-right-hand',status:r.status});if(r.ok){rightHandReady=true;break}}catch(e){results.push({provider:'gemini-right-hand',state:'transport_error',error:String(e?.message||e)})}}\n          console.log(JSON.stringify({digReady,bossReady,rightHandReady,results},null,2)); if(!digReady || !bossReady || !rightHandReady){"
          if old3 not in s: raise SystemExit('live audit preflight guard not found')
          s=s.replace(old3,probe,1)
          p.write_text(s)

          p=root/'.github/workflows/apex-single-target-audit.yml'; s=p.read_text()
          s=s.replace('      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}\n','').replace('      DEEPSEEK_MODEL: deepseek-ai/deepseek-v4-flash-0731\n','')
          old="          const rh=await probe('https://integrate.api.nvidia.com/v1/chat/completions',process.env.DEEPSEEK_API_KEY,process.env.DEEPSEEK_MODEL||'deepseek-ai/deepseek-v4-flash-0731','deepseek-right-hand');\n"
          if old not in s: raise SystemExit('single-target NVIDIA probe not found')
          s=s.replace(old,'',1)
          oldg="          console.log(JSON.stringify({digReady:dig,rightHandReady:rh,bossReady:boss})); if(!dig || !boss) process.exit(2);"
          newg="          let rightHand=false; for(const key of keys){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply READY only.'}]}],generationConfig:{maxOutputTokens:8}}),signal:AbortSignal.timeout(15000)});await r.text();if(r.ok){rightHand=true;break}}catch{}}\n          console.log(JSON.stringify({digReady:dig,rightHandReady:rightHand,bossReady:boss})); if(!dig || !boss || !rightHand) process.exit(2);"
          if oldg not in s: raise SystemExit('single-target preflight guard not found')
          s=s.replace(oldg,newg,1)
          p.write_text(s)

          p=root/'.github/workflows/audit-five-greens.yml'; s=p.read_text()
          s=re.sub(r'      - name: Apply Gemini Right-hand migration before audit\n.*?(?=      - uses: actions/setup-node@)','',s,flags=re.S)
          s=s.replace('permissions:\n  contents: write','permissions:\n  contents: read',1)
          if 'migrate-right-hand-to-gemini.py' in s or 'git push origin' in s: raise SystemExit('five-green still self-mutates')
          p.write_text(s)

          p=root/'scripts/check-unified-investigator-architecture.mjs'; s=p.read_text()
          if 'rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),' not in s:
            s=s.replace('  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),','  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),\n  rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),',1)
          if 'Gemini Right-hand is not pinned' not in s:
            anchor='assert(/investigatorLlm/.test(source.research), "ReAct research runtime does not receive investigatorLlm.");'
            add='''assert(/GEMINI_RIGHT_HAND_MODEL\\s*=\\s*["']gemini-3\\.8-flash["']/.test(source.rightHand), "Gemini Right-hand is not pinned to the requested Gemini 3.8 Flash model.");\nassert(/GEMINI_API_KEY/.test(source.rightHand) && !/DEEPSEEK|NVIDIA|integrate\\.api\\.nvidia/i.test(source.rightHand), "Gemini Right-hand source still references the retired DeepSeek/NVIDIA provider path.");\nassert(/case file|case-file/i.test(source.rightHand) && /Never browse|Never.*browse/i.test(source.rightHand), "Gemini Right-hand does not declare case-file-only, no-browse reasoning.");\nassert(/actionId/.test(source.rightHand) && /queued/.test(source.rightHand), "Gemini Right-hand does not preserve the queued-action contract.");\n'''
            if anchor not in s: raise SystemExit('checker anchor missing')
            s=s.replace(anchor,anchor+'\n'+add,1)
          p.write_text(s)

          bad=[]
          for base in [root/'artifacts',root/'.github/workflows']:
            for f in base.rglob('*'):
              if not f.is_file() or f.suffix not in {'.ts','.tsx','.js','.mjs','.json','.yml','.yaml'}: continue
              if f==root/'scripts/check-unified-investigator-architecture.mjs': continue
              try:t=f.read_text().lower()
              except Exception:continue
              if any(x in t for x in ('deepseek_api_key','api.deepseek.com','deepseek-ai/','integrate.api.nvidia.com','nvidia_nim_api_key')): bad.append(str(f))
          if bad: raise SystemExit('obsolete provider refs remain: '+', '.join(bad[:30]))
          (root/'.github/workflows/_tmp_finish_gemini_migration5.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finish Gemini Right-hand source cleanup v5'
          git push origin audit/genuine-five-green-final
