name: _tmp_finish_gemini_migration5
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, 'finish Gemini Right-hand source cleanup v5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: audit/genuine-five-green-final, fetch-depth: 0}
      - name: Apply exact replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          p=root/'artifacts/api-server/src/src/lib/case-bureau.ts'; s=p.read_text()
          reps={
            './deepseek-case-reasoning':'./gemini-right-hand-reasoning',
            'getDeepSeekCaseReasoningStatus':'getGeminiRightHandStatus',
            'runDeepSeekCaseReasoning':'runGeminiRightHandCaseReasoning',
            'runDeepSeekDiscoveryAdvice':'runGeminiRightHandDiscoveryAdvice',
            'runDeepSeekFreeJson':'runGeminiRightHandFreeJson',
            'runDeepSeekFinalReview':'runGeminiRightHandFinalReview',
            'DEEPSEEK_CASE_REASONING_MODEL':'GEMINI_RIGHT_HAND_MODEL',
            'DeepSeekCaseReasoningResult':'GeminiRightHandCaseReasoningResult',
            'DeepSeekCaseReasoningStatus':'GeminiRightHandStatus',
            'DeepSeekDiscoveryAdviceResult':'GeminiRightHandDiscoveryAdviceResult',
            'DeepSeek-V4-Flash-0731':'Gemini 3.8 Flash',
            'deepseek-right-hand':'gemini-right-hand',
            'provider: "deepseek"':'provider: "gemini"',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          if re.search(r'(?i)deepseek',s): raise SystemExit('case-bureau still contains DeepSeek')
          p.write_text(s)

          # Ensure the Right-hand always installs the bounded Gemini retry wrapper when imported directly.
          p=root/'artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts'; s=p.read_text()
          if 'installGeminiTransientRetry' not in s:
            s=s.replace('import type { BureauAction, DiscoveryCaseFile, ResearchCaseFile } from "./case-bureau";','import type { BureauAction, DiscoveryCaseFile, ResearchCaseFile } from "./case-bureau";\nimport { installGeminiTransientRetry } from "./gemini-transient-retry";\n\ninstallGeminiTransientRetry();',1)
          p.write_text(s)

          # Retire obsolete provider implementation and old migration helper.
          for rel in ['artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts','artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts','scripts/migrate-right-hand-to-deepseek.mjs']:
            q=root/rel
            if q.exists(): q.unlink()

          # Migrate remaining active Apex source identifiers without touching historical archives/assets.
          active=[]
          for base in [root/'artifacts', root/'scripts', root/'.github/workflows']:
            for q in base.rglob('*'):
              if not q.is_file() or q.suffix not in {'.ts','.tsx','.js','.mjs','.json','.yml','.yaml'}: continue
              if 'attached_assets' in q.parts or (len(q.parts)>1 and q.parts[0]=='docs' and q.parts[1]=='archive'): continue
              active.append(q)
          for q in active:
            try: t=q.read_text()
            except Exception: continue
            old=t
            for a,b in reps.items(): t=t.replace(a,b)
            t=t.replace('DeepSeek Right-hand','Gemini Right-hand').replace('DeepSeek right-hand','Gemini Right-hand').replace('DeepSeek','Gemini').replace('deepseek','gemini')
            t=t.replace('NVIDIA NIM','Gemini Right-hand').replace('NVIDIA-NIM','Gemini Right-hand')
            t=t.replace('NVIDIA_NIM_API_KEY','')
            if t!=old: q.write_text(t)

          # Provider gate must not retain a phantom NVIDIA provider.
          p=root/'artifacts/api-server/src/src/lib/provider-gate.ts'; s=p.read_text()
          s=s.replace('|"nvidia-nim"','').replace(',"nvidia-nim":"llm"','')
          s=re.sub(r'if\(host\.includes\("nvidia\\.com"\)\)return "nvidia-nim";','',s)
          p.write_text(s)

          # Remove obsolete secret references from active workflows and provider checks.
          for q in active:
            try: t=q.read_text()
            except Exception: continue
            old=t
            t=re.sub(r'^\s*DEEPSEEK_API_KEY:.*\n','',t,flags=re.M)
            t=re.sub(r'^\s*DEEPSEEK_MODEL:.*\n','',t,flags=re.M)
            t=re.sub(r'^\s*NVIDIA_NIM_API_KEY:.*\n','',t,flags=re.M)
            if t!=old: q.write_text(t)

          # Strengthen architecture guard with explicit Gemini Right-hand invariants.
          p=root/'scripts/check-unified-investigator-architecture.mjs'; s=p.read_text()
          if 'rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),' not in s:
            s=s.replace('  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),','  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),\n  rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),',1)
          if 'Gemini Right-hand is not pinned' not in s:
            anchor='assert(/investigatorLlm/.test(source.research), "ReAct research runtime does not receive investigatorLlm.");'
            add='''assert(/GEMINI_RIGHT_HAND_MODEL\\s*=\\s*["']gemini-3\\.8-flash["']/.test(source.rightHand), "Gemini Right-hand is not pinned to the requested Gemini 3.8 Flash model.");\nassert(/GEMINI_API_KEY/.test(source.rightHand) && !/DEEPSEEK|NVIDIA|integrate\\.api\\.nvidia/i.test(source.rightHand), "Gemini Right-hand source still references the retired DeepSeek/NVIDIA provider path.");\nassert(/case file|case-file/i.test(source.rightHand) && /Never browse|Never.*browse/i.test(source.rightHand), "Gemini Right-hand does not declare case-file-only, no-browse reasoning.");\nassert(/actionId/.test(source.rightHand) && /queued/.test(source.rightHand), "Gemini Right-hand does not preserve the queued-action contract.");\n'''
            if anchor not in s: raise SystemExit('checker anchor missing')
            s=s.replace(anchor,anchor+'\n'+add,1)
          p.write_text(s)

          # Only runtime Apex artifacts/workflows are forbidden from using the retired provider.
          bad=[]
          scan=[root/'artifacts',root/'.github/workflows']
          for base in scan:
            for f in base.rglob('*'):
              if not f.is_file() or f.suffix not in {'.ts','.tsx','.js','.mjs','.json','.yml','.yaml'}: continue
              if 'attached_assets' in f.parts: continue
              if f.name in {'_tmp_finish_gemini_migration5.yml','repair-gemini-right-hand.yml'}: continue
              try:t=f.read_text().lower()
              except Exception:continue
              if any(x in t for x in ('deepseek_api_key','api.deepseek.com','deepseek-ai/','integrate.api.nvidia.com','nvidia_nim_api_key')): bad.append(str(f))
          if bad: raise SystemExit('obsolete provider refs remain: '+', '.join(bad[:30]))
          # Remove this temporary workflow and the second repair workflow from the final tree.
          for rel in ['.github/workflows/_tmp_finish_gemini_migration5.yml','.github/workflows/repair-gemini-right-hand.yml']:
            q=root/rel
            if q.exists(): q.unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'finish Gemini Right-hand source cleanup v5'
          git push origin audit/genuine-five-green-final
