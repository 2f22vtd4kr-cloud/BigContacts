name: Audit round 10 Bureau inline repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove synthetic Bureau UI fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/apex-finder/src/components/bureau-ops-stage.tsx')
          s=p.read_text()
          s=s.replace('Working on this person','Live research activity')
          s=s.replace('  const t = (e.targetName || "this person").trim();','  const t = (e.targetName || "the current case").trim()')
          s=s.replace('  const safeQuery = query && !isLogGarbage(query) && !isInternalLanePrompt(query)\n    ? query\n    : (e.targetName ? `${e.targetName}` : undefined);','  const safeQuery = query && !isLogGarbage(query) && !isInternalLanePrompt(query)\n    ? query\n    : undefined;')
          s=s.replace('    query: unavailable ? (e.targetName ? `${e.targetName} (search offline)` : safeQuery) : safeQuery,','    query: unavailable ? undefined : safeQuery,')
          p.write_text(s)
          PY
          ! grep -n 'Working on this person' artifacts/apex-finder/src/components/bureau-ops-stage.tsx
      - name: Commit repair and remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_audit_round10_bureau_inline.yml .github/workflows/_audit_round10_bureau_fix.yml scripts/_audit_round10_bureau_fix.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: remove synthetic Bureau UI fallbacks'
          git push
