name: _tmp_finish_gemini_migration3
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, 'finish Gemini Right-hand source cleanup v3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: audit/genuine-five-green-final, fetch-depth: 0}
      - name: Clean and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          p=root/'artifacts/api-server/src/src/lib/case-bureau.ts'
          s=p.read_text()
          s=re.sub(r'export\s*\{[^}]*DeepSeek[^}]*\}\s*from\s*["\']\.\/deepseek-case-reasoning["\'];\s*', '', s, flags=re.I|re.S)
          s=re.sub(r'export\s+type\s*\{[^}]*DeepSeek[^}]*\}\s*from\s*["\']\.\/deepseek-case-reasoning["\'];\s*', '', s, flags=re.I|re.S)
          if 'getGeminiRightHandStatus' not in s:
              needle='export type BossPlanOutcome = "proceed" | "reject_target" | "reframe";'
              block='''export {\n  getGeminiRightHandStatus,\n  runGeminiRightHandCaseReasoning,\n  runGeminiRightHandDiscoveryAdvice,\n  runGeminiRightHandFreeJson,\n  runGeminiRightHandFinalReview,\n  GEMINI_RIGHT_HAND_MODEL,\n} from "./gemini-right-hand-reasoning";\nexport type {\n  GeminiRightHandCaseReasoningResult,\n  GeminiRightHandStatus,\n  GeminiRightHandDiscoveryAdviceResult,\n} from "./gemini-right-hand-reasoning";\n\n'''
              if needle not in s: raise SystemExit('case-bureau insertion point missing')
              s=s.replace(needle,block+needle,1)
          s=s.replace('DeepSeek-V4-Flash-0731 right-hand','Gemini 3.8 Flash right-hand')
          if re.search(r'(?i)deepseek',s): raise SystemExit('case-bureau still contains DeepSeek')
          p.write_text(s)

          for rel in ['.github/workflows/apex-live-audit.yml','.github/workflows/apex-single-target-audit.yml']:
              p=root/rel; s=p.read_text()
              s=re.sub(r'^.*(?:DEEPSEEK_API_KEY|DEEPSEEK_MODEL|api\.deepseek\.com|deepseek-ai/|integrate\.api\.nvidia\.com|nvidia-right-hand|deepseek-right-hand|NVIDIA_NIM_API_KEY|NVIDIA_AGENTIC_MODEL|NVIDIA_NIM_MODEL).*$\n?','',s,flags=re.I|re.M)
              p.write_text(s)

          p=root/'.github/workflows/audit-five-greens.yml'; s=p.read_text()
          s=re.sub(r'      - name: Apply Gemini Right-hand migration before audit\n.*?(?=      - uses: actions/setup-node@)','',s,flags=re.S)
          s=s.replace('permissions:\n  contents: write','permissions:\n  contents: read',1)
          p.write_text(s)

          p=root/'scripts/check-unified-investigator-architecture.mjs'; s=p.read_text()
          if 'rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),' not in s:
              s=s.replace('  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),','  orientation: path.join(root, "artifacts/api-server/src/src/lib/apex-bureau-orientation.ts"),\n  rightHand: path.join(root, "artifacts/api-server/src/src/lib/gemini-right-hand-reasoning.ts"),',1)
          if 'Gemini Right-hand is not pinned' not in s:
              anchor='assert(/investigatorLlm/.test(source.research), "ReAct research runtime does not receive investigatorLlm.");'
              add='''assert(/GEMINI_RIGHT_HAND_MODEL\\s*=\\s*["']gemini-3\\.8-flash["']/.test(source.rightHand), "Gemini Right-hand is not pinned to the requested Gemini 3.8 Flash model.");\nassert(/GEMINI_API_KEY/.test(source.rightHand) && !/DEEPSEEK|NVIDIA|integrate\\.api\\.nvidia/i.test(source.rightHand), "Gemini Right-hand source still references the retired DeepSeek/NVIDIA provider path.");\nassert(/case file|case-file/i.test(source.rightHand) && /Never browse|Never.*browse/i.test(source.rightHand), "Gemini Right-hand does not declare case-file-only, no-browse reasoning.");\nassert(/actionId/.test(source.rightHand) && /queued/.test(source.rightHand), "Gemini Right-hand does not preserve the queued-action contract.");\n'''
              if anchor not in s: raise SystemExit('checker anchor missing')
              s=s.replace(anchor,anchor+'\n'+add,1)
          p.write_text(s)

          bad=[]
          for base in [root/'artifacts',root/'.github/workflows']:
              for f in base.rglob('*'):
                  if not f.is_file() or f.suffix not in {'.ts','.tsx','.js','.mjs','.json','.yml','.yaml'}: continue
                  if f==root/'scripts/check-unified-investigator-architecture.mjs': continue
                  try:t=f.read_text().lower()
                  except Exception:continue
                  if any(x in t for x in ('deepseek_api_key','api.deepseek.com','deepseek-ai/','integrate.api.nvidia.com','nvidia_nim_api_key')): bad.append(str(f))
          if bad: raise SystemExit('obsolete provider refs remain: '+', '.join(bad[:30]))
          (root/'.github/workflows/_tmp_finish_gemini_migration3.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finish Gemini Right-hand source cleanup v3'
          git push origin audit/genuine-five-green-final
