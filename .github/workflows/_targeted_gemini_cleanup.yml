name: Targeted Gemini cleanup
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean only known stale provider files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/APEX_REPLIT_STARTUP_PROMPT.md')
          if p.exists():
            s=p.read_text()
            s=re.sub(r'={20,}\nDEEPSEEK SMOKE — BEFORE DISCOVERY\n={20,}\n[\s\S]*?(?=\n={20,}|\Z)', '============================================================\nGEMINI RIGHT-HAND SMOKE — BEFORE DISCOVERY\n============================================================\n\nPerform one tiny Right-hand provider smoke through the application\'s actual Gemini abstraction using GEMINI_API_KEY. Do not browse.\n', s, count=1)
            p.write_text(s)
          p=Path('docs/bureau-plan/40K_CANONICAL_ARCHITECTURE_ADDENDUM_2026-08-30.md')
          if p.exists(): p.write_text(p.read_text().replace('provider = nvidia-nim','provider = gemini'))
          p=Path('artifacts/api-server/src/src/lib/provider-gate.ts')
          if p.exists():
            s=p.read_text().replace('|"nvidia-nim"','').replace(',"nvidia-nim":"llm"','').replace('if(host.includes("nvidia.com"))return "nvidia-nim";','')
            p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/APEX_REPLIT_STARTUP_PROMPT.md docs/bureau-plan/40K_CANONICAL_ARCHITECTURE_ADDENDUM_2026-08-30.md artifacts/api-server/src/src/lib/provider-gate.ts
          git commit -m 'Remove stale retired provider references' || exit 0
          git push
