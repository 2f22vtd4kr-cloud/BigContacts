name: One-time live proof repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-live-proof-repair.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Patch live proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apex-canonical-live-proof-v3.yml')
          s=p.read_text()
          required=["attempts = 2","AbortSignal.timeout(20000)","const trajectory=Array.isArray(file.trajectory) ? file.trajectory : [];"]
          if not all(x in s for x in required): raise SystemExit('live proof patch anchors missing')
          s=s.replace('attempts = 2','attempts = 3',1)
          s=s.replace('AbortSignal.timeout(20000)','AbortSignal.timeout(60000)',1)
          s=s.replace("const trajectory=Array.isArray(file.trajectory) ? file.trajectory : [];","const records=Array.isArray(file.investigatorTrajectoryRecords) ? file.investigatorTrajectoryRecords : [];\n          const investigator=String(file.investigatorLlm||'').toLowerCase();\n          const trajectory=records;",1)
          s=s.replace("const completedInvestigator=Array.isArray(file.investigatorReports) && file.investigatorReports.some((r)=>['groq','mistral'].includes(String(r?.provider||'').toLowerCase())&&r?.status==='completed');","const completedInvestigator=(investigator==='groq'||investigator==='mistral') && records.some((r)=>r?.action==='done'&&r?.execution==='success');",1)
          s=s.replace("const hasSearch=trajectory.some((x)=>x?.action==='web_search'&&x?.execution==='success');","const hasSearch=records.some((x)=>x?.action==='web_search'&&x?.execution==='success') || events.some((e)=>/search/i.test(`${e.eventType||''} ${e.summary||''} ${e.payload||''}`));",1)
          s=s.replace("const hasVisit=trajectory.some((x)=>['visit','browser_fetch'].includes(x?.action)&&x?.execution==='success');","const hasVisit=records.some((x)=>['visit','browser_fetch'].includes(x?.action)&&x?.execution==='success') || events.some((e)=>/visit|browse|fetch|http/i.test(`${e.eventType||''} ${e.summary||''} ${e.payload||''}`));",1)
          s=s.replace("const sourceBacked=Array.isArray(file.discoveredCandidates)&&file.discoveredCandidates.some((x)=>Array.isArray(x?.sourceUrls)&&x.sourceUrls.some((u)=>/^https?:\\/\\//i.test(String(u))));","const observedUrls=new Set(records.filter((r)=>r?.execution==='success').flatMap((r)=>Array.isArray(r?.observedUrls)?r.observedUrls:[]).map((u)=>String(u)));\n          const sourceBacked=Array.isArray(file.discoveredCandidates)&&file.discoveredCandidates.some((x)=>Array.isArray(x?.sourceUrls)&&x.sourceUrls.some((u)=>observedUrls.has(String(u))));\n          const contactFinding=records.flatMap((r)=>Array.isArray(r?.findings)?r.findings:[]).find((f)=>['email','phone','linkedin','website','social'].includes(String(f?.vectorType||'').toLowerCase())&&typeof f?.personName==='string'&&f.personName.trim()&&Array.isArray(f?.sourceUrls)&&f.sourceUrls.some((u)=>observedUrls.has(String(u))));\n          const sourceBackedContact=Boolean(contactFinding);",1)
          s=s.replace("!sourceBacked||!reviewAdmission) process.exit(1);","!sourceBacked||!reviewAdmission||!sourceBackedContact) process.exit(1);",1)
          p.write_text(s)
          PY
          git rm .github/workflows/one-time-live-proof-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apex-canonical-live-proof-v3.yml
          git commit -m "fix: harden canonical live proof evidence gate"
          git push origin HEAD:main
