name: apex-discovery-static-check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-single-canonical-discovery-control-plane.mjs
      - run: node scripts/check-discovery-mode-boundary.mjs
      - run: node scripts/check-atlas-control-durability.mjs
      - run: node scripts/check-workflow-action-pins.mjs
