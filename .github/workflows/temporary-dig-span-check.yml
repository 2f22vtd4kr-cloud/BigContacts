name: Temporary Dig span verification

on:
  push:
    branches:
      - apex/dig-live-tool-spans

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-reactor-live-integrity.mjs
      - run: pnpm --dir artifacts/api-server run typecheck
      - run: pnpm --dir artifacts/api-server run test -- --run artifacts/api-server/src/src/test/dig-span-otel.test.ts
      - run: pnpm --dir artifacts/apex-finder run build
