name: Temporary Reactor syntax repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace standby wrapper with a verified fragment
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reactor = Path('artifacts/apex-finder/src/pages/reactor.tsx')
          text = reactor.read_text()
          opening = '        {!isLive && (\n          <div data-testid="reactor-standby-scheme">\n        {/* Scheme canvas — standby/explanatory only; live mode uses telemetry activity above */}'
          replacement = '        {!isLive && (\n          <>\n        {/* Scheme canvas — standby/explanatory only; live mode uses telemetry activity above */}'
          if text.count(opening) != 1:
              raise SystemExit('Expected exactly one standby wrapper opening')
          text = text.replace(opening, replacement, 1)
          closing = '          </div>{/* reactor-standby-scheme */}\n        )}'
          if text.count(closing) != 1:
              raise SystemExit('Expected exactly one standby wrapper closing')
          text = text.replace(closing, '          </>\n        )}', 1)
          reactor.write_text(text)

          guard = Path('scripts/check-reactor-live-integrity.mjs')
          guard_text = guard.read_text()
          old = 'const staticCanvasIsExplicitlyStandby = /!isLive\\s*&&\\s*\\(/.test(page) && page.includes(legacyCanvasMarker);'
          if guard_text.count(old) != 1:
              raise SystemExit('Expected exactly one standby guard expression')
          # Keep the guard semantic: the legacy scheme must remain beneath an explicit !isLive gate.
          guard.write_text(guard_text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --filter ./artifacts/apex-finder... --registry=https://registry.npmjs.org/
      - run: node scripts/check-generated-reactor-syntax.mjs
      - run: node scripts/check-frontend-responsive.mjs
      - run: node scripts/check-reactor-live-integrity.mjs
      - run: pnpm --dir artifacts/apex-finder run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/apex-finder/src/pages/reactor.tsx
          git diff --cached --quiet || git commit -m "fix(reactor): repair standby wrapper syntax"
          git push origin HEAD:${{ github.head_ref }}
