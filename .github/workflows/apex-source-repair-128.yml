name: apex-source-repair-128

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip apex repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair canonical final-review source
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path

          root = Path('.')
          source_path = root / 'artifacts/api-server/src/src/lib/ai-extractor.ts'
          source = source_path.read_text()

          marker = '  // 3) Groq capacity fallback (multi-model)\n'
          start = source.find(marker)
          if start < 0:
              raise SystemExit('expected Groq final-review block is absent; refusing mutation')
          end_marker = '  return adjudicateFinalTargetReview(input, {}, "unavailable-final-review");'
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('unavailable-final-review return anchor missing; refusing mutation')
          block = source[start:end]
          if block.count('groq-final-review-fallback') != 1 or block.count('for (const key of getGroqKeys())') != 1:
              raise SystemExit('Groq final-review block shape changed; refusing ambiguous mutation')

          source = source[:start] + source[end:]
          source = source.replace(
              ' * Final card publication review: Boss (Gemini) primary → NVIDIA right-hand → Groq.\n',
              ' * Final card publication review: Boss (Gemini) primary → NVIDIA right-hand.\n',
              1,
          )
          source = source.replace(
              'import { GROQ_DEFAULT_MODEL as GROQ_MODEL, GROQ_CHAT_MODELS } from "./groq-models";',
              'import { GROQ_DEFAULT_MODEL as GROQ_MODEL } from "./groq-models";',
              1,
          )
          source = source.replace('const GROQ_MODEL_FAST = "openai/gpt-oss-20b";\n', '', 1)
          source_path.write_text(source)

          package_path = root / 'artifacts/api-server/package.json'
          package = package_path.read_text()
          hardener = 'node scripts/apply-final-review-role-boundary.mjs && '
          if package.count(hardener) != 2:
              raise SystemExit(f'expected final-review hardener twice in package scripts, found {package.count(hardener)}')
          package = package.replace(hardener, '', 2)
          package_path.write_text(package)

          hardener_path = root / 'scripts/apply-final-review-role-boundary.mjs'
          if not hardener_path.exists():
              raise SystemExit('expected final-review migration hardener is absent; refusing mutation')
          hardener_path.unlink()

          if 'groq-final-review-fallback' in source or 'Groq capacity fallback' in source:
              raise SystemExit('Groq reviewer marker remains after repair')
          if 'node scripts/apply-final-review-role-boundary.mjs' in package:
              raise SystemExit('final-review hardener remains in package scripts')
          PYFIX
      - name: Verify source and architecture guards
        run: |
          node scripts/check-final-review-role-boundary.mjs
          node scripts/check-source-migration-hardener-parity.mjs
          node scripts/check-unified-investigator-architecture.mjs
      - name: Typecheck
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/api-server typecheck
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/ai-extractor.ts artifacts/api-server/package.json scripts/apply-final-review-role-boundary.mjs
          if git diff --cached --quiet; then
            echo 'No source repair changes required.'
            exit 0
          fi
          git commit -m 'Remove Groq final-review fallback at source [skip apex repair]'
          git push origin HEAD:main
