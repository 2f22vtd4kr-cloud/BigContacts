name: One-time provider environment cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Normalize provider environment access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/agentic-web-research-core.ts')
          s = p.read_text()
          old = [
            'const key = [process.env.SERPER_API_KEY, process.env.SERPER_API_KEY_2, process.env.SERPER_API_KEY_3, process.env.SERPER_KEY].map((x) => (x || "").trim()).find(Boolean);',
            'const key = [process.env.TAVILY_API_KEY, ...Array.from({ length: 8 }, (_, i) => process.env[`TAVILY_API_KEY_${i + 1}`])].map((x) => (x || "").trim()).find(Boolean);',
            'const key = [process.env.EXA_API_KEY, process.env.EXA_1, process.env.EXA_2, ...Array.from({ length: 8 }, (_, i) => process.env[`EXA_API_KEY_${i + 1}`])].map((x) => (x || "").trim()).find(Boolean);',
            'const keys = ["GROQ_API_KEY", ...Array.from({ length: 5 }, (_, i) => `GROQ_API_KEY_${i + 1}`)].map((n) => (process.env[n] || "").trim()).filter(Boolean);',
          ]
          new = [
            'const key = process.env.SERPER_API_KEY?.trim() || null;',
            'const key = process.env.TAVILY_API_KEY?.trim() || null;',
            'const key = process.env.EXA_API_KEY?.trim() || null;',
            'const keys = [process.env.GROQ_API_KEY?.trim() || ""].filter(Boolean);',
          ]
          for a, b in zip(old, new):
              if a not in s:
                  raise SystemExit('expected provider environment pattern not found')
              s = s.replace(a, b)
          p.write_text(s)
          q = Path('.github/workflows/fix-provider-env-aliases.yml')
          q.unlink()
          PY
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/agentic-web-research-core.ts .github/workflows/fix-provider-env-aliases.yml
          git commit -m 'fix: use canonical provider environment names only'
          git push