name: one-time retire deterministic target research v3
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Retire Atlas deterministic MCTS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('artifacts/api-server/src/src/lib/atlas-orchestrator.ts'); s=p.read_text()
          if 'runTargetResearch' not in s: raise SystemExit('expected active MCTS call absent')
          s=s.replace('import { runTargetResearch } from "./target-research";\n','',1)
          pat=re.compile(r'\n    await setAtlasTelemetry\(atlasJobId, \{\n      stage: "UCT RESEARCH",.*?\n    \}, target\.id\);\n    try \{\n      const researchResult = await runTargetResearch\(target\.id, 3\);.*?\n    \}\n',re.S)
          s,n=pat.subn('\n    summary["Target research"] = "Model-selected target research handled by the Investigator loop.";\n',s,1)
          if n!=1: raise SystemExit(f'active single-target MCTS block matches={n}')
          s,n=re.subn(r'\n  const skipMcts = digAlreadyReady \|\| process\.env\.APEX_SKIP_MCTS_AFTER_DIG === "1";','',s,1)
          if n!=1: raise SystemExit(f'skip declaration matches={n}')
          s,n=re.subn(r'\n  \} else if \(skipMcts\) \{.*?\n  \}\n','\n',s,1,flags=re.S)
          if n!=1: raise SystemExit(f'skip branch matches={n}')
          p10=re.compile(r'  // ── Phase 10:.*?\n  // ── Final count',re.S)
          s,n=p10.subn('  // ── Phase 10: model-owned target research ─────────────────────────────────\n  summary["Phase 10"] = opts.runResearch === false\n    ? "Skipped (runResearch=false)"\n    : "Model-selected Investigator research; no deterministic MCTS path.";\n\n  // ── Final count',s,1)
          if n!=1: raise SystemExit(f'Phase 10 matches={n}')
          for x in ('runTargetResearch','APEX_SKIP_MCTS_AFTER_DIG','UCT RESEARCH','activeToolId: "mcts"'):
            if x in s: raise SystemExit(f'residue: {x}')
          p.write_text(s)
          PY
          git diff --check
          git diff -- artifacts/api-server/src/src/lib/atlas-orchestrator.ts
      - name: Commit source and remove all temporary runners
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          git commit -m 'fix: retire deterministic target research from Atlas'
          git rm .github/workflows/apex-one-time-retire-target-research.yml .github/workflows/apex-one-time-retire-target-research-v2.yml .github/workflows/apex-one-time-retire-target-research-v3.yml tmp/apex-target-research-runner-trigger.txt || true
          git commit -m 'chore: remove one-time target research runners' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
