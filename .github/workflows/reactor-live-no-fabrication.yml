name: Reactor Live no-fabrication contract
on:
  push:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "artifacts/api-server/src/src/lib/job-queue.ts"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  pull_request:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "artifacts/api-server/src/src/lib/job-queue.ts"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply audited lifecycle repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/job-queue.ts')
          s = p.read_text()
          old = 'if(type==="atlas-run"||type==="case-bureau-discovery"){try{const {releaseCanonicalJob}=await import("./canonical-job-lock");const released=await releaseCanonicalJob(type,jobId);if(released){memoryActiveByType.delete(type);ACTIVE_JOB_READ_CACHE.set(type,{at:Date.now(),id:null});}return released;}catch{return false;}}'
          new = 'if(type==="atlas-run"){try{const {releaseCanonicalJob}=await import("./canonical-job-lock");const released=await releaseCanonicalJob(type,jobId);if(released){memoryActiveByType.delete(type);ACTIVE_JOB_READ_CACHE.set(type,{at:Date.now(),id:null});}return released;}catch{return false;}}'
          if old not in s: raise SystemExit('canonical release branch anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit audited lifecycle repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/job-queue.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(job-queue): release continuation lane atomically'
          git push
      - name: Check Reactor Live no-fabrication contract
        run: node scripts/check-reactor-live-no-fabrication.mjs
