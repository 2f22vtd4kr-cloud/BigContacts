name: Reactor Live no-fabrication contract
on:
  push:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  pull_request:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply Reactor live truth fixes once
        if: ${{ !contains(github.event.head_commit.message, 'audit: apply round 10 Reactor live truth fixes') }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/apex-finder/src/pages/reactor.tsx')
          s = p.read_text()
          replacements = [
            ('return { kind: "log", resultSummary: "Working on this person", timestamp, raw: text };',
             'return { kind: "log", resultSummary: "Live telemetry unavailable", timestamp, raw: text };'),
            ('resultSummary: cleaned.length > 8 && cleaned.length < 160 ? cleaned : "Working on this person",',
             'resultSummary: cleaned.length > 8 && cleaned.length < 160 ? cleaned : "Live telemetry unavailable",'),
            ('return "Working on this person";',
             'return "Live telemetry unavailable";'),
            ('width: running ? "42%" : state?.runStatus === "done" ? "100%" : "0%",',
             'width: state?.phaseTotal && state.phaseTotal > 0 ? `${Math.min(100, Math.max(0, (state.phaseProgress / state.phaseTotal) * 100))}%` : state?.runStatus === "done" ? "100%" : "0%",'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected source pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify Reactor Live no-fabrication contract
        run: node scripts/check-reactor-live-no-fabrication.mjs
      - name: Commit source repair
        if: ${{ !contains(github.event.head_commit.message, 'audit: apply round 10 Reactor live truth fixes') }}
        shell: bash
        run: |
          git config user.name '2f22vtd4kr-cloud'
          git config user.email '2f22vtd4kr@users.noreply.github.com'
          git add artifacts/apex-finder/src/pages/reactor.tsx
          git commit -m 'audit: apply round 10 Reactor live truth fixes'
          git push origin HEAD:audit/deep-round10
