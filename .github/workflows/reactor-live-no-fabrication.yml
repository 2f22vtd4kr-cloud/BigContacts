name: Reactor Live no-fabrication contract
on:
  push:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/components/reactor-live-surface.tsx"
      - "artifacts/apex-finder/src/components/reactor-activity-only.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/lib/reactor-live-store.ts"
      - "artifacts/apex-finder/src/lib/use-bureau-live.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - "scripts/check-reactor-live-integrity.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  pull_request:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/components/reactor-live-surface.tsx"
      - "artifacts/apex-finder/src/components/reactor-activity-only.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/lib/reactor-live-store.ts"
      - "artifacts/apex-finder/src/lib/use-bureau-live.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - "scripts/check-reactor-live-integrity.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reactor-live-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Reactor Live no-fabrication contract
        run: node scripts/check-reactor-live-no-fabrication.mjs
      - name: Verify Reactor Live integrity contract
        run: node scripts/check-reactor-live-integrity.mjs
