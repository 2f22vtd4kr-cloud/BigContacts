name: Reactor Live no-fabrication contract
on:
  push:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  pull_request:
    paths:
      - "artifacts/apex-finder/src/components/bureau-ops-stage.tsx"
      - "artifacts/apex-finder/src/lib/reactor-live-model.ts"
      - "artifacts/apex-finder/src/pages/reactor.tsx"
      - "scripts/check-reactor-live-no-fabrication.mjs"
      - ".github/workflows/reactor-live-no-fabrication.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply pending audit repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/src/lib/bureau-contact-persist-strict.ts'); s=p.read_text()
          old='where(and(eq(entitiesTable.id,entityId),or(isNull(fieldColumn),eq(fieldColumn,""))))'
          new='where(and(eq(entitiesTable.id,entityId),or(isNull(fieldColumn),eq(fieldColumn,"")),sql`EXISTS (SELECT 1 FROM research_cases rc WHERE rc.id = ${provenance.caseId} AND rc.status = \'active\' AND (rc.case_file::jsonb ->> \'atlasJobId\') = ${provenance.runId})`))'
          if old not in s: raise SystemExit('promotion update guard not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit pending audit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/bureau-contact-persist-strict.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(audit): fence card promotion on active case'
          git push
      - name: Check Reactor Live no-fabrication contract
        run: node scripts/check-reactor-live-no-fabrication.mjs
