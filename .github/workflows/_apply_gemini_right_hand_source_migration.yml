name: Apply Gemini Right-hand source migration
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate active Apex source references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('artifacts/api-server/src')
          files=[p for p in root.rglob('*') if p.is_file()]
          replacements=[
            ('./deepseek-case-reasoning','./gemini-right-hand-reasoning'),
            ('deepseek-case-reasoning','gemini-right-hand-reasoning'),
            ('getDeepSeekCaseReasoningStatus','getGeminiRightHandStatus'),
            ('runDeepSeekCaseReasoning','runGeminiRightHandCaseReasoning'),
            ('runDeepSeekDiscoveryAdvice','runGeminiRightHandDiscoveryAdvice'),
            ('runDeepSeekFreeJson','runGeminiRightHandFreeJson'),
            ('runDeepSeekFinalReview','runGeminiRightHandFinalReview'),
            ('DeepSeekCaseReasoningResult','GeminiRightHandCaseReasoningResult'),
            ('DeepSeekCaseReasoningStatus','GeminiRightHandStatus'),
            ('DeepSeekDiscoveryAdviceResult','GeminiRightHandDiscoveryAdviceResult'),
            ('DEEPSEEK_CASE_REASONING_MODEL','GEMINI_RIGHT_HAND_MODEL'),
            ('deepseek-ai/deepseek-v4-flash-0731','gemini-3.8-flash'),
            ('DeepSeek-V4-Flash-0731','Gemini 3.8 Flash'),
            ('DeepSeek via NVIDIA Integrate','Gemini Right-hand'),
            ('DeepSeek via Gemini API','Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right Hand','Gemini Right-hand'),
            ('DeepSeek/NVIDIA Right-hand','Gemini Right-hand'),
            ('DeepSeek/NVIDIA','Gemini Right-hand'),
            ('DeepSeek Right-hand','Gemini Right-hand'),
            ('deepseek-right-hand-final-review','gemini-right-hand-final-review'),
            ('deepseek-right-hand','gemini-right-hand'),
            ('api.deepseek.com/chat/completions','generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent'),
            ('DEEPSEEK_API_KEY','GEMINI_API_KEY'),
            ('DeepSeek','Gemini'),
            ('deepseek','gemini'),
          ]
          for p in files:
            try:s=p.read_text()
            except (UnicodeDecodeError,OSError):continue
            old=s
            for a,b in replacements:s=s.replace(a,b)
            if s!=old:p.write_text(s)
          PY
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM|NVIDIA_AGENTIC|NVIDIA_NIM_MODEL|NVIDIA NIM|NVIDIA Integrate|nvidia/nemotron|nvidia-nim|integrate\.api\.nvidia\.com' artifacts/api-server/src; then
            echo 'Active Apex source still contains retired provider references.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src
          git commit -m 'Migrate all active Apex Right-hand calls to Gemini' || exit 0
          git push
