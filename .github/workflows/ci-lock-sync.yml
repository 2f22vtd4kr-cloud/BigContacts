name: CI lockfile sync (verification only)

on:
  push:
    branches: [ci/verify-main-audit]
    paths:
      - "pnpm-workspace.yaml"
      - "package.json"
      - "**/package.json"
      - ".github/workflows/ci-lock-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-main-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pnpm@9
      - name: Regenerate lockfile from committed workspace configuration
        run: pnpm install --no-frozen-lockfile --ignore-scripts --fetch-retries=8 --fetch-timeout=120000 --registry=https://registry.npmjs.org/
      - name: Commit regenerated lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "LOCKFILE_ALREADY_CURRENT=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "ci: synchronize pnpm lockfile"
          git push origin HEAD:ci/verify-main-audit
