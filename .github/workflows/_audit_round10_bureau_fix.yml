name: Audit round 10 Bureau UI repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/_audit_round10_bureau_fix.sh
      - run: |
          set -euo pipefail
          rm .github/workflows/_audit_round10_bureau_fix.yml scripts/_audit_round10_bureau_fix.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: remove synthetic Bureau UI fallbacks'
          git push
