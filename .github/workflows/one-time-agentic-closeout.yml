name: One-time agentic runtime closeout
on:
  pull_request:
    branches: [main]
    types: [reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove arbitrary Investigator iteration clamp
        shell: python
        run: |
          from pathlib import Path
          p=Path('artifacts/api-server/src/src/lib/agentic-web-research-core.ts')
          t=p.read_text()
          old='const maxIter = Math.min(MAX_ITER, Math.max(1, requestedIterations));'
          new='const maxIter = requestedIterations > 0 ? requestedIterations : Number.POSITIVE_INFINITY;'
          if old not in t:
            raise SystemExit('iteration clamp pattern missing')
          t=t.replace(old,new,1)
          t=t.replace('.slice(0, MAX_OBS + 800)','',1)
          p.write_text(t)
      - name: Verify
        run: |
          set -euo pipefail
          ! grep -q 'Math.min(MAX_ITER, Math.max(1, requestedIterations))' artifacts/api-server/src/src/lib/agentic-web-research-core.ts
          grep -q 'const maxIter = requestedIterations > 0 ? requestedIterations : Number.POSITIVE_INFINITY;' artifacts/api-server/src/src/lib/agentic-web-research-core.ts
      - name: Commit and remove patcher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-agentic-closeout.yml
          git add artifacts/api-server/src/src/lib/agentic-web-research-core.ts
          git commit -m 'Close out agentic runtime iteration policy'
          git push
