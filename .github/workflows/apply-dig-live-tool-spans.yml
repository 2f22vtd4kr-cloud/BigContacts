name: Apply Dig live tool span patch

on:
  push:
    branches: [apex/dig-live-tool-spans]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted Dig telemetry patch
        run: node scripts/apply-dig-live-tool-spans-v2.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/agentic-web-research.ts artifacts/apex-finder/src/components/reactor-activity-only.tsx scripts/check-reactor-live-integrity.mjs scripts/apply-dig-live-tool-spans-v2.mjs .github/workflows/apply-dig-live-tool-spans.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor(dig): expose active tool spans to Reactor"
          git push
