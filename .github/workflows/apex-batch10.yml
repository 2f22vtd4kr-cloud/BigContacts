name: Apex Batch 3 Bureau Audit (manual)

on:
  workflow_dispatch:

# Manual replay harness. The authoritative audit remains in apex-live-audit.yml.
concurrency:
  group: apex-batch3-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  batch3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_URL_1: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      ENABLE_REDIS_ON_BOOT: "true"
      GROQ_BOSS_API_KEY: ${{ secrets.GROQ_BOSS_API_KEY }}
      GROQ_RIGHT_HAND_API_KEY: ${{ secrets.GROQ_RIGHT_HAND_API_KEY }}
      GROQ_RIGHT_HAND_API_KEY_2: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_2 }}
      GROQ_RIGHT_HAND_API_KEY_3: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_3 }}
      GROQ_RIGHT_HAND_API_KEY_4: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_4 }}
      GROQ_RIGHT_HAND_API_KEY_5: ${{ secrets.GROQ_RIGHT_HAND_API_KEY_5 }}
      GROQ_INVESTIGATOR_API_KEY: ${{ secrets.GROQ_INVESTIGATOR_API_KEY }}
      GROQ_INVESTIGATOR_API_KEY_1: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_1 }}
      GROQ_INVESTIGATOR_API_KEY_2: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_2 }}
      GROQ_INVESTIGATOR_API_KEY_3: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_3 }}
      GROQ_INVESTIGATOR_API_KEY_4: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_4 }}
      GROQ_INVESTIGATOR_API_KEY_5: ${{ secrets.GROQ_INVESTIGATOR_API_KEY_5 }}
      NODE_ENV: development

      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EXA_1: ${{ secrets.EXA_1 }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }
      - name: Fail fast when canonical model roles are not configured
        shell: bash
        run: |
          set -euo pipefail
          require_any() {
            for name in "$@"; do
              value="$(printenv "$name" 2>/dev/null || true)"
              if [ -n "$value" ]; then return 0; fi
            done
            return 1
          }
          require_any GROQ_BOSS_API_KEY GROQ_BOSS_API_KEY_1 GROQ_BOSS_API_KEY_2 GROQ_BOSS_API_KEY_3 GROQ_BOSS_API_KEY_4 GROQ_BOSS_API_KEY_5 GROQ_BOSS_API_KEY_6 GROQ_BOSS_API_KEY_7 GROQ_BOSS_API_KEY_8 GROQ_BOSS_API_KEY_9 GROQ_BOSS_API_KEY_10 || { echo "::error::Missing GitHub Actions secret for the Groq Boss role."; exit 1; }
          require_any GROQ_RIGHT_HAND_API_KEY GROQ_RIGHT_HAND_API_KEY_2 GROQ_RIGHT_HAND_API_KEY_3 GROQ_RIGHT_HAND_API_KEY_4 GROQ_RIGHT_HAND_API_KEY_5 || { echo "::error::Missing GitHub Actions secret for the Groq Right-hand role."; exit 1; }
          require_any GROQ_INVESTIGATOR_API_KEY GROQ_INVESTIGATOR_API_KEY_1 GROQ_INVESTIGATOR_API_KEY_2 GROQ_INVESTIGATOR_API_KEY_3 GROQ_INVESTIGATOR_API_KEY_4 GROQ_INVESTIGATOR_API_KEY_5 || { echo "::error::Missing GitHub Actions secret for the Groq Investigator role."; exit 1; }
          require_any SERPER_API_KEY TAVILY_API_KEY EXA_API_KEY EXA_1 || { echo "::error::Missing GitHub Actions search-provider credential."; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, registry-url: https://registry.npmjs.org/ }
      - run: npm install -g pnpm@9.15.9
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --filter @workspace/db... --filter @workspace/api-server... --filter @workspace/api-zod... --filter apex-finder-local... --registry=https://registry.npmjs.org/
      - name: Install services
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
      - name: Build and checks
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts && cd ../../
          pnpm --dir artifacts/apex-finder run build
          test -f artifacts/apex-finder/dist/public/index.html
          pnpm --dir artifacts/api-server run build
          pnpm run check:no-force-dig
          pnpm run check:free-react
          pnpm run check:discovery-quality
          pnpm run check:trajectory
          pnpm run check:comparison-contract
          pnpm run check:agentic-runtime
          pnpm run check:agentic-timeout
          node scripts/check-workflow-action-pins.mjs
          pnpm run check:retired-api-contract-callers
          pnpm --dir artifacts/api-server exec vitest run src/src/test/discovery-agent-parse.test.ts src/src/test/bureau-contact-persist-strict.test.ts
      - name: Configure isolated operator authentication
        run: |
          set -euo pipefail
          API_TOKEN="$(openssl rand -hex 32)"
          OPERATOR_PASSWORD="$(openssl rand -hex 24)"
          SESSION_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$API_TOKEN"
          echo "::add-mask::$OPERATOR_PASSWORD"
          echo "::add-mask::$SESSION_SECRET"
          {
            echo "APEX_API_AUTH_TOKEN=$API_TOKEN"
            echo "APEX_OPERATOR_PASSWORD=$OPERATOR_PASSWORD"
            echo "APEX_SESSION_SECRET=$SESSION_SECRET"
          } >> "$GITHUB_ENV"
      - name: Run bounded batch research and capture evidence
        run: |
          set -euo pipefail
          rm -f /tmp/apex-api.log /tmp/launch.json /tmp/atlas-status.json /tmp/entities.json /tmp/scoreboard.json /tmp/health.json /tmp/atlas-trace.json
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          API_PID=$!
          collect_batch_evidence() {
            JOB_ID="$(node -p 'try{require("/tmp/launch.json").jobId||""}catch{""}')"
            if [ -n "$JOB_ID" ]; then
              curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" | tee /tmp/atlas-status.json || true
              curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/atlas-trace/$JOB_ID" | tee /tmp/atlas-trace.json || true
            fi
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" 'http://127.0.0.1:8080/api/entities?limit=50&offset=0' | tee /tmp/entities.json || true
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" 'http://127.0.0.1:8080/api/ingest/scoreboard-snapshot?limit=50' | tee /tmp/scoreboard.json || true
            curl -sS -m 10 http://127.0.0.1:8080/api/healthz | tee /tmp/health.json || true
            cat /tmp/apex-api.log || true
            if kill -0 "$API_PID" 2>/dev/null; then kill "$API_PID" 2>/dev/null || true; fi
            wait "$API_PID" 2>/dev/null || true
          }
          trap collect_batch_evidence EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS -m 2 http://127.0.0.1:8080/api/healthz >/tmp/health.json; then READY=1; break; fi
            if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/apex-api.log; exit 1; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/apex-api.log; exit 1; fi
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run \
            -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"discoveryFirst":true,"targetCount":3,"researchLimit":3,"runResearch":true,"skipFaa":true,"targetTimeoutMs":180000,"researchDepth":"standard"}' | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json");if(!x.jobId)process.exit(1);console.log("job",x.jobId)'
          JOB_ID="$(node -p 'require("/tmp/launch.json").jobId')"
          for i in $(seq 1 600); do
            sleep 5
            curl -sS -m 10 -H "Authorization: Bearer ${APEX_API_AUTH_TOKEN}" "http://127.0.0.1:8080/api/ingest/job/$JOB_ID" > /tmp/atlas-status.json || true
            STATUS="$(node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json","utf8"));process.stdout.write(String(x.status||x.job?.status||""))}catch{}')"
            node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json","utf8"));console.log(JSON.stringify({status:x.status,jobId:x.jobId||x.job?.jobId,phase:x.phase,processed:x.processed,admitted:x.admitted,target:x.currentTarget||x.currentTargetName}))}catch{}'
            case "$STATUS" in done|completed) exit 0;; failed|cancelled) cat /tmp/atlas-status.json; exit 1;; esac
          done
          cat /tmp/atlas-status.json
          exit 1
      - name: Audit live Bureau evidence
        if: always()
        run: node scripts/audit-live-bureau.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: apex-batch3
          path: |
            /tmp/launch.json
            /tmp/atlas-status.json
            /tmp/entities.json
            /tmp/scoreboard.json
            /tmp/health.json
            /tmp/atlas-trace.json
            /tmp/apex-api.log