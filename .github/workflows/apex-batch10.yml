name: Apex Batch 10 Bureau Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      REDIS_URL: redis://127.0.0.1:6379
      PORT: 8080
      ENABLE_AUTO_PIPELINE: "false"
      NODE_ENV: development
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EXA_1: ${{ secrets.EXA_1 }}
      SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHOXY_API_KEY: ${{ secrets.WHOXY_API_KEY }}
      RESEARCH_DEPTH: standard
      APEX_SKIP_SEMANTIC: "1"
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org/ }
      - name: Materialize mandatory 40k research-agent plan
        run: |
          node scripts/generate-apex-research-agent-integrity-plan.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bureau-plan/40K_RESEARCH_AGENT_INTEGRITY_PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: materialize 40k Apex research-agent integrity plan [skip ci]"
            git push origin HEAD:main
          fi
      - name: Apply causal identity integrity repair
        run: |
          node scripts/apply-apex-identity-integrity-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/discovery-agent.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix: enforce source-bound identity evidence before discovery admission [skip ci]"
            git push origin HEAD:main
          fi
      - run: npm install -g pnpm@9
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --filter @workspace/db... --filter @workspace/api-server... --filter @workspace/api-zod... --filter apex-finder-local... --registry=https://registry.npmjs.org/
      - name: Install services
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
      - name: Build and checks
        run: |
          cd lib/db && npx drizzle-kit push --config ./drizzle.config.ts && cd ../../
          pnpm --dir artifacts/apex-finder run build
          test -f artifacts/apex-finder/dist/public/index.html
          pnpm --dir artifacts/api-server run build
          pnpm run check:no-force-dig
          pnpm run check:free-react
          pnpm run check:discovery-quality
          pnpm run check:trajectory
          pnpm run check:comparison-contract
      - name: Start API
        run: |
          node artifacts/api-server/dist/index.mjs > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 45); do sleep 1; curl -sS -m 2 -o /tmp/health.json http://127.0.0.1:8080/api/healthz && break || true; done
          cat /tmp/health.json
          test "$(curl -sS -m 5 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz)" = 200
      - name: Launch 10-target discovery-first Bureau
        run: |
          curl -sS -m 15 -X POST http://127.0.0.1:8080/api/ingest/atlas-run -H 'Content-Type: application/json' -d '{"discoveryFirst":true,"targetCount":10,"researchLimit":10,"runResearch":true,"skipFaa":true,"targetTimeoutMs":180000,"researchDepth":"standard"}' | tee /tmp/launch.json
          node -e 'const x=require("/tmp/launch.json"); if(!x.jobId) throw Error(JSON.stringify(x)); console.log(x.jobId)'
      - name: Poll until idle
        run: |
          for i in $(seq 1 600); do
            sleep 5
            curl -sS -m 10 http://127.0.0.1:8080/api/ingest/atlas-status > /tmp/atlas-status.json || true
            node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json"));console.log(JSON.stringify({status:x.status,jobId:x.jobId||x.job?.jobId,phase:x.phase,processed:x.processed,admitted:x.admitted,target:x.currentTarget||x.currentTargetName}))}catch{}'
            S=$(node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/atlas-status.json"));process.stdout.write(String(x.status||x.job?.status||""))}catch{}')
            case "$S" in idle|done|completed) exit 0;; failed|cancelled) exit 1;; esac
          done
          exit 1
      - name: Freeze 10-target output
        if: always()
        run: |
          curl -sS -m 10 'http://127.0.0.1:8080/api/entities?limit=50&offset=0' | tee /tmp/entities.json || true
          curl -sS -m 10 'http://127.0.0.1:8080/api/ingest/scoreboard-snapshot?limit=50' | tee /tmp/scoreboard.json || true
          curl -sS -m 10 http://127.0.0.1:8080/api/healthz | tee /tmp/health.json || true
          node scripts/audit-live-bureau.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-batch10
          path: |
            /tmp/launch.json
            /tmp/atlas-status.json
            /tmp/entities.json
            /tmp/scoreboard.json
            /tmp/health.json
            /tmp/apex-api.log
