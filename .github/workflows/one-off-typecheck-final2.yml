name: One-off Typecheck Final 2

# PR trigger marker 2
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-typecheck-final2.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-off-typecheck-final2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply final repairs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts")
          text = p.read_text()
          old = 'findings: [...discovery.findings, ...nextDiscovery.findings], modelFindings: [...discovery.modelFindings, ...nextDiscovery.modelFindings]'
          new = 'findings: [...(discovery.findings ?? []), ...(nextDiscovery.findings ?? [])], modelFindings: [...(discovery.modelFindings ?? []), ...(nextDiscovery.modelFindings ?? [])]'
          if text.count(old) != 1: raise SystemExit(f"canonical match={text.count(old)}")
          p.write_text(text.replace(old, new))

          p = Path("artifacts/api-server/src/src/test/api-auth.test.ts")
          text = p.read_text()
          old = '''  const response = {} as TestResponse;
  response.statusCode = 200;
  response.jsonBody = undefined;
  response.status = ((code: number): TestResponse => { response.statusCode = code; return response; }) as unknown as Response["status"];
  response.json = ((body: unknown): TestResponse => { response.jsonBody = body; return response; }) as unknown as Response["json"];
'''
          new = '''  const response = {
    statusCode: 200,
    jsonBody: undefined as unknown,
    status(code: number) { this.statusCode = code; return this; },
    json(body: unknown) { this.jsonBody = body; return this; },
  } as unknown as TestResponse;
'''
          if text.count(old) != 1: raise SystemExit(f"auth helper match={text.count(old)}")
          p.write_text(text.replace(old, new))

          Path(".github/workflows/one-off-typecheck-final2.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/canonical-atlas-discovery.ts artifacts/api-server/src/src/test/api-auth.test.ts .github/workflows/one-off-typecheck-final2.yml
          git commit -m "fix: normalize optional discovery findings and test response"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
