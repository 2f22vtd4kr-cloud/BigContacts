name: one-time evidence boundary hardening
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove legacy evidence-to-card projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('artifacts/api-server/src/src/lib/bureau-contact-persist.ts')
          s = p.read_text()

          auto = re.compile(r'  // Dig bag → card: promote best non-issuer phone/email onto the entity so.*?\n  return rows\.length;', re.S)
          s, n = auto.subn('  // Evidence persistence ends here. Card mutation belongs exclusively to the\n  // explicit investigator-selected promotion boundary.\n  return rows.length;', s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one legacy auto-promotion block, found {n}')

          generated = re.compile(r'    // related-person without URL: attach issuer EDGAR search when company known; else drop\n.*?    const collision = assessIdentityCollision\(', re.S)
          s, n = generated.subn('    // Missing exact source pages are not provenance. Do not manufacture search URLs.\n\n    const collision = assessIdentityCollision(', s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one generated query-URL block, found {n}')

          helper = re.compile(r'\nfunction isGenericLocal\(email: string\): boolean \{.*?\n\}\n\ntype DiscoveryCandidateContactSource =', re.S)
          s, n = helper.subn('\n\ntype DiscoveryCandidateContactSource =', s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one legacy card projector block, found {n}')

          rehydrate = re.compile(r'/\*\* Rehydrate entity cards from durable contact_evidence \(no new dig\)\. \*/\nexport async function rehydrateEntityCardFromEvidence\(entityId: number\): Promise<boolean> \{.*?\n\}', re.S)
          replacement = '''/**
          * Legacy rehydration is intentionally disabled.
          * Durable evidence is not a promotion decision; only the canonical investigator
          * promotion boundary may mutate an entity card.
          */
          export async function rehydrateEntityCardFromEvidence(_entityId: number): Promise<boolean> {
            return false;
          }'''
          s, n = rehydrate.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one legacy rehydration function, found {n}')

          p.write_text(s)
          PY
          git diff --check
          ! grep -n "promoteBureauContactsToEntityCard" artifacts/api-server/src/src/lib/bureau-contact-persist.ts
          ! grep -n "efts.sec.gov/LATEST/search-index" artifacts/api-server/src/src/lib/bureau-contact-persist.ts
          git diff --stat
      - name: Verify targeted boundary tests
        run: |
          npm install -g pnpm@9
          pnpm install --frozen-lockfile
          pnpm --dir artifacts/api-server exec vitest run src/src/test/bureau-contact-persist-strict.test.ts src/src/test/agentic-scope-boundary.test.ts src/src/test/investigator-promotion-contract.test.ts
      - name: Commit source hardening and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/src/lib/bureau-contact-persist.ts
          git commit -m 'fix: enforce explicit evidence to card promotion boundary'
          git rm .github/workflows/apex-one-time-boundary-hardening.yml
          git commit -m 'chore: remove one-time boundary hardening runner'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
