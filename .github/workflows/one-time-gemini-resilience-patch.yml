# One-shot source patch runner; self-removal happens after the patch is verified.
name: one-time Gemini resilience patch

on:
  push:
    branches:
      - audit/genuine-five-green-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'one-time Gemini resilience patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/genuine-five-green-final
          fetch-depth: 0
      - name: Patch Gemini 429/503 handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/src/lib/case-bureau.ts')
          text = path.read_text()
          old = '''        if (response.status === 429 || response.status === 503) {
          const detail = (await response.text().catch(() => "")).slice(0, 300);
          lastError = `Gemini Boss ${model} text-generation HTTP ${response.status}${detail ? `: ${detail}` : ""}`;
          logger.warn(
            { model, status: response.status, keyName: entry.name, detail },
            "Gemini Boss text-generation capacity busy; stopping this Boss attempt (not a web-search failure)",
          );
          // A 429/503 is commonly project/model capacity, not a model-local
          // failure. Do not fan out across the catalog and spend more quota.
          return { model, raw: null, error: lastError };
        }
'''
          new = '''        if (response.status === 429 || response.status === 503) {
          const detail = (await response.text().catch(() => "")).slice(0, 300);
          lastError = `Gemini Boss ${model} text-generation HTTP ${response.status}${detail ? `: ${detail}` : ""}`;
          logger.warn(
            { model, status: response.status, keyName: entry.name, detail },
            "Gemini Boss text-generation capacity busy; trying the next compatible catalog model",
          );
          // 429/503 are transient capacity conditions. Keep the Boss inside
          // the catalog already resolved for this key and try the next
          // compatible model instead of fail-closing the entire Bureau.
          continue;
        }
'''
          if old not in text:
              raise SystemExit('expected Gemini capacity block not found; refusing speculative edit')
          if 'trying the next compatible catalog model' in text:
              raise SystemExit('patch already present')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/src/lib/case-bureau.ts
          git commit -m "fix: fall through Gemini model capacity errors"
          git push origin HEAD:audit/genuine-five-green-final
