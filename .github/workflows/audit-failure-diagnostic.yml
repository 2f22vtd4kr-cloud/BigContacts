name: Full Audit Failure Diagnostic

on:
  push:
    branches: [audit/genuine-five-green-final]
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 8080
  NODE_ENV: development
  ENABLE_AUTO_PIPELINE: "false"
  APEX_SKIP_SEMANTIC: "1"
  APEX_AGENTIC_CONCURRENCY: "1"
  APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
  APEX_API_AUTH_TOKEN: diagnostic-${{ github.run_id }}

jobs:
  locate:
    name: Locate failing API test
    runs-on: ubuntu-latest
    outputs:
      failed_test: ${{ steps.tests.outputs.failed_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Provision local API dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          cd lib/db
          bash ../../scripts/ci-provision-db.sh
      - run: pnpm run check:bureau
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Start API
        run: |
          set -euo pipefail
          nohup node artifacts/api-server/dist/index.mjs </dev/null > /tmp/apex-api.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 1
            if [ "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = "200" ]; then exit 0; fi
          done
          cat /tmp/apex-api.log
          exit 1
      - name: Run every API test until first failure
        id: tests
        run: |
          set -uo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            echo "===== DIAGNOSTIC TEST: ${test_file} ====="
            if ! pnpm exec vitest run --maxWorkers=1 "${test_file}"; then
              echo "failed_test=${test_file}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "failed_test=" >> "$GITHUB_OUTPUT"

  report:
    name: Diagnostic result — ${{ needs.locate.outputs.failed_test || 'all isolated API tests passed' }}
    needs: locate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "First failing isolated API test: ${{ needs.locate.outputs.failed_test || 'none' }}"
