name: apply typecheck workflow hardening
on:
  push:
    branches: [apex/harden-api-typecheck-workflow]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repository-writing diagnostics from API typecheck gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apex-api-typecheck.yml')
          s = p.read_text()
          s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          start = s.index('      - name: Publish failing typecheck diagnostics for repair')
          end = s.index('      - name: Run strict provenance tests', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
          git diff --check
          git diff -- .github/workflows/apex-api-typecheck.yml
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apex-api-typecheck.yml
          git rm .github/workflows/apply-typecheck-workflow-hardening.yml
          git commit -m 'fix(ci): make API typecheck gate read-only'
          git push