name: Final retired provider cleanup
on:
  push:
    branches: [audit/genuine-five-green-final]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired DeepSeek and NVIDIA references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/src/lib/ai-extractor.ts')
          s = p.read_text()
          replacements = {
            './deepseek-case-reasoning': './gemini-right-hand-reasoning',
            'runDeepSeekFinalReview': 'runGeminiRightHandFinalReview',
            'DeepSeek via NVIDIA Integrate': 'Gemini Right-hand',
            'Your right-hand (NVIDIA)': 'Your right-hand (Gemini)',
            '`deepseek-right-hand-final-review:': '`gemini-right-hand-final-review:',
            'DeepSeek right-hand unavailable': 'Gemini Right-hand unavailable',
            'DeepSeek/NVIDIA is the only model fallback': 'Gemini Right-hand is the only oversight fallback',
          }
          for a, b in replacements.items():
              s = s.replace(a, b)
          p.write_text(s)
          PY
          rm -f artifacts/api-server/src/src/lib/nvidia-nim-case-reasoning.ts artifacts/api-server/src/src/lib/deepseek-case-reasoning.ts
          rm -f .github/workflows/_one_shot_gemini_cleanup.yml .github/workflows/fix-provider-cleanup.yml
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'DEEPSEEK_API_KEY|runDeepSeek|DeepSeek|deepseek|NVIDIA_NIM_API_KEY|nvidia-nim-case-reasoning|NVIDIA NIM|NVIDIA_AGENTIC_MODEL|NVIDIA_NIM_MODEL|integrate\.api\.nvidia\.com' artifacts/api-server/src scripts docs .github 2>/dev/null; then
            echo 'Retired DeepSeek/NVIDIA references remain in active Apex tree.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired DeepSeek and NVIDIA provider paths' || exit 0
          git push
