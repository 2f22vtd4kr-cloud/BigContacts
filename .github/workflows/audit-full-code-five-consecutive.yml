# Five consecutive complete audits. Each pass gets a fresh checkout and independently reruns the full repository contract suite, typecheck, build, live API smoke tests, every API test file, and source-mutation check.
# No pass is counted unless the entire audit job succeeds.
name: Five Consecutive Full Code Audits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-code-five-consecutive-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9
  DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
  REDIS_URL: redis://127.0.0.1:6379
  PORT: 8080
  ENABLE_AUTO_PIPELINE: "false"
  NODE_ENV: development
  APEX_SKIP_SEMANTIC: "1"
  APEX_AGENTIC_CONCURRENCY: "1"
  APEX_AGENTIC_PROVIDER_CONCURRENCY: "1"
  APEX_API_AUTH_TOKEN: "ci-${{ github.sha }}"

jobs:
  audit-1:
    name: Audit 1 — complete codebase
    runs-on: ubuntu-latest
    steps: &audit_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: true
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Provision local API dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql redis-server
          sudo service postgresql start
          sudo service redis-server start
          sudo -u postgres psql -c "CREATE USER apex WITH PASSWORD 'apex_local_dev' SUPERUSER;" || true
          sudo -u postgres psql -c "CREATE DATABASE apex OWNER apex;" || true
          rm -rf /tmp/apex-drizzle
          pnpm --dir lib/db exec drizzle-kit generate --config ./drizzle.config.ts --out /tmp/apex-drizzle --name ci-bootstrap
          while IFS= read -r -d '' migration; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find /tmp/apex-drizzle -type f -name '*.sql' -print0 | sort -z)
      - name: Repository architecture contract suite
        run: pnpm run check:bureau
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Start API for live smoke tests
        run: |
          set -euo pipefail
          redis-cli ping
          nohup node artifacts/api-server/dist/index.mjs </dev/null > /tmp/apex-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/apex-api.pid
          disown "$api_pid" || true
          for i in $(seq 1 45); do
            sleep 1
            if [ "$(curl -sS -m 2 -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/api/healthz || true)" = "200" ]; then exit 0; fi
          done
          cat /tmp/apex-api.log
          exit 1
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            echo "===== FULL AUDIT TEST: ${test_file} ====="
            pnpm exec vitest run --maxWorkers=1 "${test_file}"
          done
      - name: Build must not mutate source
        run: git diff --exit-code

  audit-2:
    name: Audit 2 — complete codebase
    needs: audit-1
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-3:
    name: Audit 3 — complete codebase
    needs: audit-2
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-4:
    name: Audit 4 — complete codebase
    needs: audit-3
    runs-on: ubuntu-latest
    steps: *audit_steps

  audit-5:
    name: Audit 5 — complete codebase
    needs: audit-4
    runs-on: ubuntu-latest
    steps: *audit_steps
