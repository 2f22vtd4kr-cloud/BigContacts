# Five consecutive complete audits. Each pass gets a fresh checkout and independently reruns the full repository contract suite, typecheck, build, every API test file, and source-mutation check.
# Final verification run: no merge until all five complete audits pass consecutively.
# Audit chain activation: this workflow is intentionally the complete five-pass gate, not a five-lane shortcut.
# Final-tree verification marker: current complete-audit restart after Gemini latency fixture hardening.
name: Five Consecutive Full Code Audits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-code-five-consecutive-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 9.15.9

jobs:
  audit-1:
    name: Audit 1 — complete codebase
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://apex:apex_local_dev@127.0.0.1:5432/apex
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex_local_dev
          POSTGRES_DB: apex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex -d apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm install -g pnpm@${PNPM_VERSION}
      - run: pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Repository architecture contract suite
        run: pnpm run check:bureau
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Push database schema for live smoke tests
        run: cd lib/db && pnpm exec drizzle-kit push --config ./drizzle.config.ts
      - name: Create ephemeral API credential for live smoke tests
        run: echo "APEX_API_AUTH_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start API server for live smoke tests
        run: |
          set -euo pipefail
          cd artifacts/api-server
          nohup node --enable-source-maps ./dist/index.mjs > /tmp/bigcontacts-api.log 2>&1 &
          echo $! > /tmp/bigcontacts-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/tmp/bigcontacts-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bigcontacts-api.log
          exit 1
      - name: Live smoke API test
        run: |
          set -euo pipefail
          cd artifacts/api-server
          pnpm exec vitest run --maxWorkers=1 src/src/test/smoke.test.ts
      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/bigcontacts-api.pid ]; then
            kill "$(cat /tmp/bigcontacts-api.pid)" 2>/dev/null || true
          fi
      - name: Every API test file, isolated
        run: |
          set -euo pipefail
          cd artifacts/api-server
          for test_file in src/src/test/*.test.ts; do
            if [[ "${test_file}" == *"/smoke.test.ts" ]]; then continue; fi
            echo "===== FULL AUDIT TEST: ${test_file} ====="
            pnpm exec vitest run --maxWorkers=1 "${test_file}"
          done
      - name: Build must not mutate source
        run: git diff --exit-code

