name: apply-residual-honesty
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply-residual-honesty.py"
      - ".github/workflows/apply-residual-honesty.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply residual honesty
        run: |
          set -euo pipefail
          test "$(wc -l < artifacts/api-server/src/src/lib/atlas-orchestrator.ts)" -ge 500
          test "$(wc -l < artifacts/apex-finder/src/pages/reactor.tsx)" -ge 2000
          python3 scripts/apply-residual-honesty.py
          grep -q 'ended incomplete' artifacts/api-server/src/src/lib/atlas-orchestrator.ts
          grep -q 'label: "BRIEF"' artifacts/apex-finder/src/pages/reactor.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no-changes; else
            git commit -m "fix(bureau): residual incomplete messaging + desk quiet-start consistency"
            git push
          fi
