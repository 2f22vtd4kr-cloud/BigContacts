name: One-shot dependency lock repair

on:
  push:
    branches: [audit/genuine-five-green-final]
    paths:
      - "artifacts/apex-finder/package.json"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): sync framer-motion lock') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/genuine-five-green-final
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --lockfile-only --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/repair-framer-motion-lock.yml
          git diff --cached --exit-code && { echo "No lockfile change was generated"; exit 1; } || true
          git commit -m "chore(deps): sync framer-motion lock"
          git push origin HEAD:audit/genuine-five-green-final
