<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase R</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;gap:28px;flex-wrap:wrap}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.card{width:320px;border-radius:12px;border:1px solid #1e293b;background:#071018;padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:11px;font-weight:700;letter-spacing:.12em}
.pulse{color:#67e8f9;text-shadow:0 0 10px rgba(34,211,238,.55);font-family:ui-monospace,monospace;font-size:11px}
.sess{border:1px solid #22d3ee55;border-radius:8px;padding:12px;background:#0d1525;box-shadow:0 0 12px rgba(34,211,238,.08);margin-bottom:8px}
.sess .n{font-size:12px;font-weight:700;color:#e2e8f0}
.sess .m{font-size:10px;color:#94a3b8;margin-top:4px}
</style></head>
<body>
<div>
<p class="cap">Live event count pulse</p>
<div class="card">
  <div class="head"><span>DESK · LIVE</span><span class="pulse">7 events · new</span></div>
  <div style="height:60px;border:1px dashed #334155;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#64748b">tool window</div>
</div>
</div>
<div>
<p class="cap">Session card hover</p>
<div class="card">
  <div class="sess"><div class="n">Walker Tool &amp; Die</div><div class="m">UCT path · signal 0.8 · 14 Aug</div></div>
  <div class="sess" style="border-color:#243044;box-shadow:none"><div class="n">Griffin Tool</div><div class="m">UCT path · signal 0.7 · 13 Aug</div></div>
</div>
</div>
</body></html>
