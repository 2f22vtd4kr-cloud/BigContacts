<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Manual</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.wrap{width:420px}

.sec{border:1px solid #1e293b;border-radius:8px;padding:12px;margin-bottom:8px;font-size:13px;font-weight:600}
.sec.open{border-color:rgba(52,211,153,.35)}

<body>
<div class="wrap">
<p class="cap">Field manual</p>
<div class="card">
  <h1>Field manual</h1>
  <p class="p">How Apex Atlas works: find reachable people, run live research, read scores, and stay honest about what is proven.</p>
  <input value="reactor" readonly />
  <div class="sec open">4. Intelligence Reactor (live activity)

</div>
