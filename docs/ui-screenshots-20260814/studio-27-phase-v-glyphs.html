<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase V glyphs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:14px}
.phone{width:400px;border-radius:28px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.h{padding:12px 16px;border-bottom:1px solid #1e293b;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#67e8f9}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #1e293b}
.glyph{width:36px;height:36px;border-radius:999px;border:1.5px solid rgba(34,211,238,.55);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(34,211,238,.35);position:relative;flex-shrink:0}
.glyph.done{border-color:rgba(52,211,153,.55);box-shadow:0 0 10px rgba(52,211,153,.25)}
.glyph svg{width:16px;height:16px}
.story{font-size:14px;font-weight:600;line-height:1.35}
.now{color:#67e8f9;font-weight:700}
.done{color:#6ee7b7;font-weight:700}
.sub{font-size:10px;color:#94a3b8;margin-top:4px;font-family:ui-monospace,monospace}
@keyframes orbit{to{transform:rotate(360deg)}}
.pip{position:absolute;inset:0;animation:orbit 2.4s linear infinite}
.pip i{position:absolute;left:50%;top:0;width:5px;height:5px;margin-left:-2.5px;border-radius:99px;background:#67e8f9;box-shadow:0 0 6px #67e8f9}
</style></head>
<body>
<div>
<p class="cap">Motion glyphs · live activity</p>
<div class="phone">
  <div class="h">Live activity</div>
  <div class="row">
    <div class="glyph"><div class="pip"><i></i></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="2.25"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    </div>
    <div><div class="story"><span class="now">Now:</span> searching Google for “Walker Tool email”</div><div class="sub">Search</div></div>
  </div>
  <div class="row">
    <div class="glyph done">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2.25"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
    </div>
    <div><div class="story"><span class="done">Done:</span> opening walkertool.com to read about Walker Tool</div><div class="sub">Browser</div></div>
  </div>
  <div class="row">
    <div class="glyph"><div class="pip"><i></i></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="2.25"><path d="M4 19V5h4l2 4h10v10H4z"/><path d="M8 19v-6h8"/></svg>
    </div>
    <div><div class="story"><span class="now">Now:</span> searching a company registry for Walker Tool</div><div class="sub">Registry</div></div>
  </div>
</div>
</div>
</body></html>
