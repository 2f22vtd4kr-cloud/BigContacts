<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase M REACH CTA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:14px}
.phone{width:390px;border-radius:28px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.header{padding:14px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:99px;background:#34d399}
.reach{margin:14px 16px;border-radius:12px;border:1px solid rgba(52,211,153,.55);padding:12px;background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(16,185,129,.08))}
.lab{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a7f3d0}
.body{margin-top:6px;font-size:13px;color:#ecfdf5;line-height:1.4}
.cta{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1);padding:7px 11px;font-size:11px;font-weight:600;color:#ecfdf5;text-decoration:none}
.nodes{margin:0 16px 20px;display:flex;flex-direction:column;gap:8px}
.node{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;border:1px solid rgba(163,230,53,.45);background:rgba(163,230,53,.08)}
.node .t{font-size:11px;font-weight:700;letter-spacing:.08em;color:#a3e635}
.node .s{font-size:9px;color:rgba(163,230,53,.7);margin-top:2px}
.tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3e635}
.node.live{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.08)}
.node.live .t,.node.live .tag{color:#22d3ee}
</style></head>
<body>
<div>
<p class="cap">Apex Atlas · Phase M · REACH CTA + scheme tags</p>
<div class="phone">
  <div class="header"><span class="dot"></span><strong style="font-size:13px">Apex Atlas</strong></div>
  <div class="reach">
    <div class="lab">Contact route locked · REACH</div>
    <div class="body">2 attributable vectors · Walker Tool &amp; Die</div>
    <a class="cta" href="#">Open in Profiles <span style="opacity:.7;font-size:9px">→</span></a>
  </div>
  <div class="nodes">
    <div class="node"><div><div class="t">DOMAIN SURFACE</div><div class="s">RDAP · WhoisJSON</div></div><span class="tag">done</span></div>
    <div class="node live"><div><div class="t">CONTACT FACTS</div><div class="s">HTML extract</div></div><span class="tag">live</span></div>
    <div class="node"><div><div class="t">PERSONA REVIEW</div><div class="s">LLM admission</div></div><span class="tag">done</span></div>
  </div>
</div>
</div>
</body></html>
