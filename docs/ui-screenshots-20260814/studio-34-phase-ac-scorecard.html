<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Scorecard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#64748b;text-align:center;margin-bottom:12px}
.card{width:480px;border-radius:16px;border:1px solid #1e293b;background:#071018;padding:16px}
.h{font-size:11px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#34d399;margin-bottom:6px}
.p{font-size:11px;color:#94a3b8;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border:1px solid #1e293b;border-radius:8px;padding:8px}
.l{font-size:9px;font-family:ui-monospace,monospace;text-transform:uppercase;color:#64748b}
.v{font-size:18px;font-family:ui-monospace,monospace;color:#6ee7b7;margin-top:4px}
</style></head>
<body>
<div>
<p class="cap">Research scorecard</p>
<div class="card">
  <div class="h">Research scorecard</div>
  <div class="p">Each score answers a different question. Wealth is never treated as reachability.</div>
  <div class="grid">
    <div class="cell"><div class="l">Identity</div><div class="v">82</div></div>
    <div class="cell"><div class="l">Contact</div><div class="v">71</div></div>
    <div class="cell"><div class="l">Access</div><div class="v">64</div></div>
    <div class="cell"><div class="l">Sources</div><div class="v">78</div></div>
  </div>
</div>
</div>
</body></html>
