<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Profile tabs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:380px;border-radius:16px;border:1px solid #1e293b;background:#071018;padding:20px;text-align:center}
.cap{font-size:10px;font-family:ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin-bottom:12px;text-align:center}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.tab{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid #334155;color:#94a3b8}
.tab.on{border-color:rgba(52,211,153,.4);color:#6ee7b7;background:rgba(52,211,153,.1)}
.h{font-size:14px;font-weight:600;margin:12px 0 8px}
.p{font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:12px}
.btn{display:inline-block;padding:8px 12px;border-radius:8px;font-size:11px;border:1px solid #334155;margin:4px}
.btn.p{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12);color:#6ee7b7}
</style></head>
<body>
<div>
<p class="cap">Profile · research history empty</p>
<div class="card">
  <div class="tabs"><span class="tab">Assets</span><span class="tab">Network</span><span class="tab on">Research history</span></div>
  <div class="h">No research runs yet</div>
  <div class="p">Run research to collect public evidence, map introduction paths, and score how reachable this target is.</div>
  <span class="btn p">Run research</span><span class="btn">Open Reactor</span>
</div>
</div>
</body></html>
