<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apex Atlas · Phase K terminal</title>
<style>
:root{--reactor-ease:cubic-bezier(0.22,1,0.36,1);--reactor-cyan:#22d3ee;--reactor-emerald:#34d399}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;border-radius:28px;border:1px solid #1e293b;background:#071018;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.header{padding:14px 16px;border-bottom:1px solid #1e293b;background:rgba(7,16,24,.92)}
.row{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:99px;background:#34d399}
.pill{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.12);color:#a7f3d0}
.reach{margin:12px 16px 0;border-radius:12px;border:1px solid rgba(52,211,153,.55);padding:10px 12px;background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(16,185,129,.08));animation:reachIn 320ms var(--reactor-ease) both}
.reach .lab{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a7f3d0}
.reach .body{margin-top:4px;font-size:13px;color:#ecfdf5}
.term{margin:12px 16px;border-radius:12px;border:1px solid rgba(52,211,153,.45);padding:10px 12px;background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(15,23,42,.6));animation:terminalIn 220ms var(--reactor-ease) both}
.term .lab{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a7f3d0}
.term .body{margin-top:4px;font-size:12px;color:rgba(236,253,245,.9)}
.chrome{margin:12px 16px 20px;border-radius:12px;border:1px solid rgba(34,211,238,.35);background:linear-gradient(165deg,#111827,#0b1220);overflow:hidden}
.chrome-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(17,24,39,.85)}
.tl{display:flex;gap:6px}
.tl span{width:10px;height:10px;border-radius:99px}
.tl .r{background:#FF5F57}.tl .y{background:#FEBC2E}.tl .g{background:#28C840}
.done-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1);padding:2px 8px;font-size:9px;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.08em;color:#a7f3d0}
.done-pill i{width:6px;height:6px;border-radius:99px;background:#34d399}
.chrome-body{padding:12px;font-size:12px;color:#cbd5e1;line-height:1.45}
@keyframes reachIn{0%{opacity:0;transform:scale(.92) translateY(6px)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes terminalIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
.cap{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:10px;font-family:ui-monospace,monospace;color:#64748b;letter-spacing:.1em;text-transform:uppercase}
.wrap{position:relative}
</style></head>
<body>
<div class="wrap">
<p class="cap">Apex Atlas · Phase K · run complete</p>
<div class="phone" style="margin-top:28px">
  <div class="header">
    <div class="row">
      <span class="dot"></span>
      <strong style="font-size:13px">Apex Atlas</strong>
      <span class="pill">Complete</span>
    </div>
  </div>
  <div class="reach">
    <div class="lab">Contact route locked · REACH</div>
    <div class="body">2 attributable vectors · hr@ + purchasing@ recovered</div>
  </div>
  <div class="term">
    <div class="lab">Run complete</div>
    <div class="body">Atlas finished this target. Review tools below or open History.</div>
  </div>
  <div class="chrome">
    <div class="chrome-bar">
      <div class="tl"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <span style="font-size:11px;font-family:ui-monospace,monospace;color:#cbd5e1">Browser</span>
      <span class="done-pill"><i></i>DONE</span>
    </div>
    <div class="chrome-body">Visited resources.html · mailto hr@walkertool.com admitted</div>
  </div>
</div>
</div>
</body></html>
