kind = "api"
previewPath = "/"
title = "Apex Atlas"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "cd ../.. && bash scripts/replit-boot.sh"

[services.development.env]
NODE_ENV = "development"
APEX_OPERATOR_AUTH_BYPASS = "true"
VITE_APEX_OPERATOR_AUTH_BYPASS = "true"
APEX_CAPTURE_MODEL_PROMPTS = "true"
APEX_MODEL_AUDIT_INCLUDE_CONTACT_DATA = "true"
APEX_MODEL_AUDIT_FILE = "audits/★_STARRED_APEX_ATLAS_SEQUENTIAL_AUDIT_REPLIT_RUN_{jobId}.md"
APEX_CAPTURE_MODEL_PROMPTS_IN_TEST = "false"
APEX_MODEL_AUDIT_ALLOW_VISIBLE_FILE = "true"
APEX_MODEL_AUDIT_ALLOW_VISIBLE_CONTACT_DATA = "true"

[services.production]

[services.production.build]
args = ["sh", "-c", "pnpm --filter apex-finder-local run build && pnpm --filter @workspace/api-server run build"]

[services.production.build.env]
NODE_ENV = "production"
VITE_APEX_OPERATOR_AUTH_BYPASS = "true"

[services.production.run]
args = ["sh", "-c", "cd ../.. && bash scripts/replit-boot.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
APEX_OPERATOR_AUTH_BYPASS = "true"
VITE_APEX_OPERATOR_AUTH_BYPASS = "true"

[services.production.health.startup]
path = "/api/healthz"
