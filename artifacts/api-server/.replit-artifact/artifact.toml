kind = "api"
previewPath = "/"
title = "Apex Atlas"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "cd ../.. && bash scripts/replit-boot.sh"

[services.development.env]
NODE_ENV = "development"
APEX_CAPTURE_MODEL_PROMPTS = "false"
APEX_MODEL_AUDIT_INCLUDE_CONTACT_DATA = "false"
APEX_CAPTURE_MODEL_PROMPTS_IN_TEST = "false"
APEX_MODEL_AUDIT_ALLOW_VISIBLE_FILE = "false"
APEX_MODEL_AUDIT_FILE = "audits/APEX_ATLAS_SEQUENTIAL_AUDIT_2026-10-20_FRESH_PROJECT_RUN_03.md"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
