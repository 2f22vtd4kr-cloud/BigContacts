<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Apex Reactor Live Desk — visual QA</title>
<style>
  :root { --bg:#0b1120; --panel:#0d1219; --lime:#9CFF1A; --violet:#a78bfa; --text:#e8e0cc; --muted:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, sans-serif; min-height:100vh; }
  h1 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#b8ff4d; padding:14px 16px; border-bottom:1px solid #192840; }
  .tabs { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid #192840; flex-wrap:wrap; }
  .tabs button { background:#121820; border:1px solid #253850; color:#94a3b8; padding:8px 12px; border-radius:8px; font-size:11px; cursor:pointer; }
  .tabs button.on { border-color:#9CFF1A88; color:#d4ff8a; background:#9CFF1A14; }
  .stage { padding:16px; max-width:1100px; margin:0 auto; }
  .frame { border:1px solid #1e293b; border-radius:14px; overflow:hidden; background:#080c14; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .frame.desktop { width:100%; }
  .frame.mobile { width:390px; margin:0 auto; min-height:720px; }
  .chrome-top { height:36px; background:#0a0e16; border-bottom:1px solid #1e293b; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:10px; color:#64748b; letter-spacing:.12em; text-transform:uppercase; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#9CFF1A; box-shadow:0 0 10px #9CFF1A; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.4 } }
  .desk { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .narration { border:1px solid rgba(167,139,250,.4); background:linear-gradient(135deg,rgba(76,29,149,.45),#0c1018); border-radius:12px; padding:12px 14px; }
  .narration .label { font-family:ui-monospace,monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#ddd6fe; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .narration .dot { width:8px; height:8px; border-radius:50%; background:#c4b5fd; box-shadow:0 0 10px #a78bfa; animation:pulse 1.2s infinite; }
  .narration p { font-size:13px; line-height:1.45; color:#f5f3ff; }
  .scene { border:1px solid rgba(156,255,26,.18); border-radius:12px; overflow:hidden; background:#0d1219; }
  .scene-bar { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid rgba(156,255,26,.1); font-size:11px; color:#cbd5e1; }
  .scene-body { padding:12px; }
  .search-box { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .search-input { flex:1; border-radius:999px; border:1px solid #444; background:#141414; padding:10px 14px; color:#f1f5f9; font-size:13px; }
  .hit { padding:8px 4px; border-top:1px solid rgba(255,255,255,.05); }
  .hit a { color:#8ab4f8; font-size:13px; text-decoration:none; }
  .hit .snip { color:#94a3b8; font-size:11px; margin-top:3px; }
  .urlbar { font-family:ui-monospace,monospace; font-size:10px; color:#94a3b8; background:#0d1219; border:1px solid rgba(156,255,26,.08); border-radius:6px; padding:6px 8px; margin-bottom:10px; }
  .pre { font-family:ui-monospace,monospace; font-size:11px; color:#d9f99d; white-space:pre-wrap; line-height:1.5; }
  .badge { display:inline-flex; font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:999px; border:1px solid #9CFF1A55; color:#b8ff4d; }
  .row { display:grid; gap:12px; }
  .desktop .row { grid-template-columns: 1.1fr .9fr; }
  .side { border-left:1px solid #1e293b; padding:12px; background:#0a0f18; min-height:560px; }
  .note { margin-top:16px; font-size:11px; color:#64748b; line-height:1.5; }
  .fail { border-color:#fb718555; }
  .fail .badge { border-color:#fb718555; color:#fda4af; }
</style>
</head>
<body>
  <h1>Apex Reactor — Live Desk visual QA (static scenarios)</h1>
  <div class="tabs">
    <button class="on" data-s="desk-live">Desktop · live dig</button>
    <button data-s="desk-search">Desktop · Google SERP</button>
    <button data-s="desk-registry">Desktop · registry</button>
    <button data-s="desk-offline">Desktop · tool offline</button>
    <button data-s="mob-live">Mobile · live dig</button>
    <button data-s="mob-foot">Mobile · footprint</button>
  </div>
  <div class="stage" id="stage"></div>
  <script>
const N = (t) => `<div class="narration" data-testid="right-hand-narration"><div class="label"><span class="dot"></span>Right-hand · under the hood</div><p>${t}</p></div>`;
const scenes = {
  "desk-live": () => desk(`
    ${N("About page loaded cleanly — extracting domain emails and any officer bylines before we touch social footprint tools.")}
    <div class="scene">
      <div class="scene-bar"><span class="live-dot"></span> Reading a page · fetch · <span class="badge">Live</span></div>
      <div class="scene-body">
        <div class="urlbar">https://example-demo.test/about</div>
        <div class="pre">CONTACT FACTS
email: info@example-demo.test
phone: +1 555 0100
— page text excerpt —
Demo Holdings Ltd is a private company…</div>
      </div>
    </div>
  `),
  "desk-search": () => desk(`
    ${N("Serper returned the company site plus a filings hit — next hop is the about page, not another blind search.")}
    <div class="scene">
      <div class="scene-bar">Web search · Google/Serper · <span class="badge">Done</span></div>
      <div class="scene-body">
        <div class="search-box">
          <strong style="color:#9CFF1A">G</strong>
          <div class="search-input">Demo Holdings Ltd officers contact<span style="opacity:.5">|</span></div>
        </div>
        <div class="hit"><a href="#">Demo Holdings Ltd — About</a><div class="snip">Official company page · contact routes</div></div>
        <div class="hit"><a href="#">Companies House — Demo Holdings</a><div class="snip">Officers and filings</div></div>
      </div>
    </div>
  `),
  "desk-registry": () => desk(`
    ${N("Registry confirms two named officers — useful anchors if the website stays silent on personal routes.")}
    <div class="scene">
      <div class="scene-bar">Official records · Companies House · <span class="badge">Done</span></div>
      <div class="scene-body"><div class="pre">REGISTRY companies_house query="Demo Holdings Ltd"
1. Demo Holdings Ltd — London · active
2. Officer A · Director
3. Officer B · Secretary</div></div>
    </div>
  `),
  "desk-offline": () => desk(`
    ${N("Perplexity is offline this session — desk shows the gap honestly instead of inventing a search result.")}
    <div class="scene fail">
      <div class="scene-bar">Search offline · Perplexity · <span class="badge">Failed</span></div>
      <div class="scene-body"><div class="pre">Perplexity not configured or returned no result — not a live search.
Target still in play via Serper / page fetch.</div></div>
    </div>
  `),
  "mob-live": () => mobile(`
    ${N("Structuring two domain emails and a switchboard from the about page — nothing personal claimed without a named byline.")}
    <div class="scene">
      <div class="scene-bar"><span class="live-dot"></span> Writing findings · 6/6</div>
      <div class="scene-body">
        <div class="urlbar">extract · CONTACT FACTS</div>
        <div class="pre">2 domain emails · 1 switchboard
info@example-demo.test
office@example-demo.test</div>
      </div>
    </div>
  `),
  "mob-foot": () => mobile(`
    ${N("Footprint tools only confirmed public handles — treating them as soft leads, not verified personal inboxes.")}
    <div class="scene">
      <div class="scene-bar">Profile search · Maigret/Holehe · <span class="badge">Done</span></div>
      <div class="scene-body"><div class="pre">FOOTPRINT username demo_holdings
Maigret: 3 sites
Holehe: no email platforms
(review only)</div></div>
    </div>
  `),
};
function desk(inner) {
  return `<div class="frame desktop"><div class="chrome-top"><span class="live-dot"></span> Reactor · Live Desk · desktop</div>
  <div class="row"><div class="desk" style="min-height:560px;padding:16px;border-right:1px solid #1e293b">
    <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#64748b;margin-bottom:8px">Scheme (dimmed while desk open)</div>
    <div style="height:420px;border:1px dashed #1e293b;border-radius:12px;display:grid;place-items:center;color:#334155;font-size:12px">Atlas scheme canvas</div>
  </div><div class="side"><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a3e635;margin-bottom:10px">Live Desk</div>${inner}</div></div></div>
  <p class="note">Desktop: narration strip + method chrome in the side desk. Boss is not used for prose — right-hand only.</p>`;
}
function mobile(inner) {
  return `<div class="frame mobile"><div class="chrome-top"><span class="live-dot"></span> Reactor · mobile</div><div class="desk">${inner}</div></div>
  <p class="note">Mobile: compact narration + single scene workstage (swipe history in app).</p>`;
}
const stage = document.getElementById('stage');
function show(id) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.s===id));
  stage.innerHTML = scenes[id]();
}
window.showScenario = show;
document.querySelectorAll('.tabs button').forEach(b => {
  b.addEventListener('click', () => show(b.dataset.s));
});
show('desk-live');
</script>
</body>
</html>
