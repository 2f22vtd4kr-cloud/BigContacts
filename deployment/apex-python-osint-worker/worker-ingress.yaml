apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-python-osint-worker
  namespace: apex-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "130"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "130"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - apex-osint-worker.example.com
      secretName: apex-osint-worker-tls
  rules:
    - host: apex-osint-worker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apex-python-osint-worker
                port:
                  number: 8080
