# Public-web-only CONNECT/HTTP proxy for Apex's isolated OSINT workers.
# Kubernetes NetworkPolicy restricts ingress to the worker and restricts egress
# to public TCP/80,443 plus cluster DNS. This ACL is a second enforcement layer.
http_port 3128
visible_hostname apex-osint-egress-proxy
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_store_log none
access_log none
cache_log stdio:/dev/stderr
shutdown_lifetime 1 seconds
connect_timeout 15 seconds
read_timeout 30 seconds
request_timeout 30 seconds
request_body_max_size 2 MB
reply_body_max_size 2 MB all

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

acl denied_dst dst 0.0.0.0/8
acl denied_dst dst 10.0.0.0/8
acl denied_dst dst 100.64.0.0/10
acl denied_dst dst 127.0.0.0/8
acl denied_dst dst 169.254.0.0/16
acl denied_dst dst 172.16.0.0/12
acl denied_dst dst 192.0.0.0/24
acl denied_dst dst 192.0.2.0/24
acl denied_dst dst 192.88.99.0/24
acl denied_dst dst 192.168.0.0/16
acl denied_dst dst 198.18.0.0/15
acl denied_dst dst 198.51.100.0/24
acl denied_dst dst 203.0.113.0/24
acl denied_dst dst 224.0.0.0/4
acl denied_dst dst 240.0.0.0/4
acl denied_dst dst ::/128
acl denied_dst dst ::1/128
acl denied_dst dst ::ffff:0:0/96
acl denied_dst dst 64:ff9b::/96
acl denied_dst dst fc00::/7
acl denied_dst dst fe80::/10
acl denied_dst dst ff00::/8
acl denied_dst dst 2001:db8::/32

acl denied_domain dstdomain localhost .localhost .local .internal .svc .cluster.local metadata.google.internal metadata.goog

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny denied_dst
http_access deny denied_domain
http_access allow all
http_access deny all
