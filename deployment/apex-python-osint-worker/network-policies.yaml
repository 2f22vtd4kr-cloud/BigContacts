# These four policies define the worker/proxy egress boundary.
# Configure the actual cluster pod/service CIDRs in the proxy policy's except set
# before deployment, then use scripts/attest-python-osint-worker.py to verify.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apex-osint-worker-ingress
  namespace: apex-system
spec:
  podSelector:
    matchLabels:
      app: apex-python-osint-worker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apex-osint-worker-egress
  namespace: apex-system
spec:
  podSelector:
    matchLabels:
      app: apex-python-osint-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apex-system
          podSelector:
            matchLabels:
              app: apex-osint-egress-proxy
      ports:
        - protocol: TCP
          port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apex-osint-proxy-ingress
  namespace: apex-system
spec:
  podSelector:
    matchLabels:
      app: apex-osint-egress-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apex-system
          podSelector:
            matchLabels:
              app: apex-python-osint-worker
      ports:
        - protocol: TCP
          port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apex-osint-proxy-egress
  namespace: apex-system
spec:
  podSelector:
    matchLabels:
      app: apex-osint-egress-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - ::ffff:0:0/96
              - 64:ff9b::/96
              - fc00::/7
              - fe80::/10
              - ff00::/8
              - 2001:db8::/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
