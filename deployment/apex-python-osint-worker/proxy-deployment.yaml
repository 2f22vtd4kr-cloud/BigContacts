apiVersion: v1
kind: ConfigMap
metadata:
  name: apex-osint-egress-proxy-config
  namespace: apex-system
data:
  squid.conf: |
    # This ConfigMap is mounted into both squid and the worker for hash attestation.
    # Keep this content byte-for-byte equal to deployment/apex-python-osint-worker/squid.conf.
    http_port 3128
    visible_hostname apex-osint-egress-proxy
    pid_filename /tmp/squid.pid
    coredump_dir /tmp
    cache deny all
    cache_store_log none
    access_log none
    cache_log stdio:/dev/stderr
    shutdown_lifetime 1 seconds
    connect_timeout 15 seconds
    read_timeout 30 seconds
    request_timeout 30 seconds
    request_body_max_size 2 MB
    reply_body_max_size 2 MB all

    acl Safe_ports port 80 443
    acl SSL_ports port 443
    acl CONNECT method CONNECT

    acl denied_dst dst 0.0.0.0/8
    acl denied_dst dst 10.0.0.0/8
    acl denied_dst dst 100.64.0.0/10
    acl denied_dst dst 127.0.0.0/8
    acl denied_dst dst 169.254.0.0/16
    acl denied_dst dst 172.16.0.0/12
    acl denied_dst dst 192.0.0.0/24
    acl denied_dst dst 192.0.2.0/24
    acl denied_dst dst 192.88.99.0/24
    acl denied_dst dst 192.168.0.0/16
    acl denied_dst dst 198.18.0.0/15
    acl denied_dst dst 198.51.100.0/24
    acl denied_dst dst 203.0.113.0/24
    acl denied_dst dst 224.0.0.0/4
    acl denied_dst dst 240.0.0.0/4
    acl denied_dst dst ::/128
    acl denied_dst dst ::1/128
    acl denied_dst dst ::ffff:0:0/96
    acl denied_dst dst 64:ff9b::/96
    acl denied_dst dst fc00::/7
    acl denied_dst dst fe80::/10
    acl denied_dst dst ff00::/8
    acl denied_dst dst 2001:db8::/32

    acl denied_domain dstdomain localhost .localhost .local .internal .svc .cluster.local metadata.google.internal metadata.goog

    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports
    http_access deny denied_dst
    http_access deny denied_domain
    http_access allow all
    http_access deny all
---
apiVersion: v1
kind: Service
metadata:
  name: apex-osint-egress-proxy
  namespace: apex-system
  labels:
    app: apex-osint-egress-proxy
spec:
  type: ClusterIP
  selector:
    app: apex-osint-egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-osint-egress-proxy
  namespace: apex-system
  labels:
    app: apex-osint-egress-proxy
    app.kubernetes.io/part-of: apex-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-osint-egress-proxy
  template:
    metadata:
      labels:
        app: apex-osint-egress-proxy
        app.kubernetes.io/part-of: apex-atlas
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: apex-osint-egress-proxy:replace-before-apply
          imagePullPolicy: IfNotPresent
          command: ["/usr/sbin/squid", "-N", "-f", "/etc/squid/squid.conf"]
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/squid
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: apex-osint-egress-proxy-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
