apiVersion: v1
kind: Service
metadata:
  name: apex-osint-egress-proxy
  namespace: apex-system
  labels:
    app: apex-osint-egress-proxy
spec:
  type: ClusterIP
  selector:
    app: apex-osint-egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-osint-egress-proxy
  namespace: apex-system
  labels:
    app: apex-osint-egress-proxy
    app.kubernetes.io/part-of: apex-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-osint-egress-proxy
  template:
    metadata:
      labels:
        app: apex-osint-egress-proxy
        app.kubernetes.io/part-of: apex-atlas
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: apex-osint-egress-proxy:replace-before-apply
          imagePullPolicy: IfNotPresent
          command: ["/usr/sbin/squid", "-N", "-f", "/etc/squid/squid.conf"]
          ports:
            - name: proxy
              containerPort: 3128
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/squid
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: apex-osint-egress-proxy-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
